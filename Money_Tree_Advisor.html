<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{--g:#005826;--br:#934E32;--gold:#F9B738;--bg:#F0F8FF;--dk:#39293E;--line:#dfe6ea;--mut:#6b6472}

.pop .pt2 .n{text-align:right;white-space:nowrap}.pop .pt2 tr.t td{font-weight:700;border-top:1.5px solid #cfdcd3}

@media(max-width:640px){.wrap{padding:8px}.card{padding:12px}.rt td,.rt th{padding:5px 5px;font-size:12.5px}.xrow{flex-direction:column;align-items:stretch}.pt th:nth-child(2),.pt td:nth-child(2){display:none}}
</style></head><body>
<header><h1>🌳 Money Tree <small>Advisor view · not for clients</small></h1>
<select id="famList" title="Saved families"></select><input id="famName" placeholder="Family name">
<span class="sp"></span>
<button class="hbtn" id="newFam">New family</button><button class="hbtn" id="expFam">Export file</button><button class="hbtn" id="impFam">Import file</button><input type="file" id="impFile" accept=".json" hidden>
</header>
<div class="wrap">
<div class="side">
  <div class="card"><h3>Family &amp; parents</h3><div id="pParents"></div></div>
  <div class="card"><h3>Child</h3><div class="chips" id="childTabs"></div><div id="pChild"></div><button class="lnk" id="delChild">Remove this child</button></div>
  <div class="card"><h3>Goals</h3><div id="pGoals"></div></div>
  <div class="card"><h3>SIP</h3><div id="pSip"></div></div>
  <div class="card"><h3>Assumptions</h3><div id="pAssume"></div></div>
  <div class="card"><h3>Money already invested</h3><div id="pNow"></div></div>
</div>
<main id="out"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script>// ===== Money Tree advisor engine v2 (pure functions) =====
// Model: two buckets. Every month: SIP in -> rebalance so the DEBT bucket holds exactly the money for
// goals due within the next `safeYears` (each discounted at the debt rate) -> pay goals due this month
// -> grow equity at the equity rate and debt at the debt rate. Monthly rates = (1+annual)^(1/12)-1.
// Method A = this month-by-month simulation. Method B = closed-form present values.
const MT2 = (() => {
  const GOALS = () => ([
    { id: 'puc', label: 'PUC (11th & 12th)', on: true, cost: 150000, perYear: true, startAge: 16, years: 2, infl: 10, edu: true },
    { id: 'grad', label: 'Graduation', on: true, cost: 300000, perYear: true, startAge: 18, years: 4, infl: 10, edu: true },
    { id: 'pg', label: 'Post-graduation', on: true, cost: 1500000, perYear: false, startAge: 22, years: 2, infl: 10, edu: true },
    { id: 'car', label: 'First car', on: true, cost: 1000000, perYear: false, startAge: 24, years: 1, infl: 7 },
    { id: 'wedding', label: 'Wedding', on: true, cost: 1500000, perYear: false, startAge: 27, years: 1, infl: 7 }
  ]);
  function defaultChild(dobISO, startISO) {
    return {
      id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      name: '', dob: dobISO, startDate: startISO, product: null, // null = auto (tree if child <= 5 at start)
      goals: GOALS(),
      seed: { on: true, name: 'Golden Seed', targetToday: 500000, age: 27 },
      sip: { type: 'stepup', stepUp: 5, endAge: 18, mode: 'required', amount: 0, lumpsum: 0 },
      caseSel: 'low',
      current: { value: 0, date: '' },
      whatIf: []
    };
  }
  function defaultFamily() {
    const t = new Date(), iso = d => d.toISOString().slice(0, 10);
    return {
      id: 'f' + Date.now().toString(36), name: '',
      parents: [{ name: '', dob: '', earns: true, share: 100, existing: 0 }, { name: '', dob: '', earns: false, share: 0, existing: 0 }],
      coverMode: 'proportional',
      a: { eqLow: 10, eqHigh: 12, debt: 5.5, safeYears: 2, infl: 7 },
      children: [defaultChild(iso(t), iso(t))]
    };
  }

  function monthsBetween(d1, d2) {
    const a = new Date(d1 + 'T00:00:00'), b = new Date(d2 + 'T00:00:00');
    let m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
    if (b.getDate() < a.getDate()) m -= 1;
    return m;
  }
  const mRate = p => Math.pow(1 + p / 100, 1 / 12) - 1;
  const productOf = c => c.product || (Math.max(0, monthsBetween(c.dob, c.startDate)) <= 60 ? 'tree' : 'plant');

  // ---- the liabilities: every goal payment (paid) + the Golden Seed target (kept, not paid) ----
  // k = months after the SIP start date; need = cost today x (1+inflation)^(k/12)
  function liabilities(child, A, goalsOverride) {
    const a0m = Math.max(0, monthsBetween(child.dob, child.startDate));
    const K = child.seed.age * 12 - a0m;
    const out = [];
    (goalsOverride || child.goals).forEach(g => {
      if (!g.on) return;
      const years = Math.max(1, Math.round(g.years || 1));
      const per = g.perYear ? g.cost : g.cost / years;
      for (let y = 0; y < years; y++) {
        const age = g.startAge + y, k = age * 12 - a0m;
        if (k < 0 || age > child.seed.age) continue;
        out.push({ gid: g.id, label: g.label, age, k, today: per, infl: g.infl, need: per * Math.pow(1 + g.infl / 100, k / 12), paid: true });
      }
    });
    if (child.seed.on && child.seed.targetToday > 0) out.push({ gid: 'seed', label: child.seed.name || 'Golden Seed', age: child.seed.age, k: K, today: child.seed.targetToday, infl: A.infl, need: child.seed.targetToday * Math.pow(1 + A.infl / 100, K / 12), paid: false });
    return { list: out.sort((x, y) => x.k - y.k || (x.paid ? -1 : 1)), a0m, K };
  }

  // ---- money flows per month: SIP, lump sums/withdrawals, market falls ----
  function flows(child, fam, eq, s0, mods) {
    const a0m = Math.max(0, monthsBetween(child.dob, child.startDate)), K = child.seed.age * 12 - a0m;
    const sp = child.sip, endAge = mods && mods.endAge != null ? mods.endAge : sp.endAge;
    const step = sp.type === 'stepup' ? (sp.stepUp || 0) / 100 : 0;
    const sip = new Array(K + 1).fill(0), add = new Array(K + 1).fill(0), fall = new Array(K + 1).fill(0);
    const ev = (mods && mods.events) || [];
    const kOf = age => Math.round(age * 12) - a0m;
    for (let k = 0; k <= K; k++) {
      if (a0m + k >= endAge * 12) continue;
      let yrs = Math.floor(k / 12);
      ev.filter(e => e.type === 'skipStep').forEach(e => { const k1 = kOf(e.age); if (k >= k1) yrs -= Math.min(Math.round(e.years || 1), Math.floor((k - k1) / 12) + 1); });
      let amt = s0 * Math.pow(1 + step, Math.max(0, yrs));
      ev.forEach(e => {
        const k1 = kOf(e.age);
        if (e.type === 'pause' && k >= k1 && k < k1 + (e.months || 0)) amt = 0;
        if (e.type === 'reduce' && k >= k1 && k < k1 + (e.months || 0)) amt = Math.min(amt, e.amount || 0);
        if (e.type === 'death' && k >= k1) amt *= e.keep; // share of SIP that continues
      });
      if (mods && mods.multFrom != null && k >= mods.multFrom) amt *= mods.mult;
      sip[k] = amt;
    }
    add[0] += sp.lumpsum || 0;
    ev.forEach(e => {
      const k1 = kOf(e.age); if (k1 < 0 || k1 > K) return;
      if (e.type === 'lump') add[k1] += e.amount || 0;
      if (e.type === 'withdraw') add[k1] -= e.amount || 0;
      if (e.type === 'death') add[k1] += e.payout || 0;
      if (e.type === 'fall') fall[k1] = Math.min(1, (e.pct || 0) / 100);
    });
    if (mods && mods.lumpAt != null && mods.lumpAt <= K) add[mods.lumpAt] += mods.lump;
    return { sip, add, fall, a0m, K };
  }

  // ---- Method A: month-by-month simulation ----
  // opts: { eq, s0, mods, goals (override), fromK, startBal }
  function simulate(child, fam, o) {
    const A = fam.a, me = mRate(o.eq), md = mRate(A.debt), W = Math.round(A.safeYears * 12);
    const L = liabilities(child, A, o.goals), F = flows(child, fam, o.eq, o.s0, o.mods);
    const fromK = o.fromK || 0, K = L.K;
    let eqB = 0, dB = 0, total = o.startBal || 0;
    const paidBy = {}, rows = [];
    L.list.forEach(l => { if (l.paid) paidBy[l.gid] = paidBy[l.gid] || { need: 0, paid: 0, label: l.label, ages: [] }; });
    let seedVal = 0, minCash = 0;
    for (let k = fromK; k <= K; k++) {
      const sip = F.sip[k], add = F.add[k] - (k === 0 && o.noLump ? (child.sip.lumpsum || 0) : 0);
      // a market fall hits the equity part of the money at the start of that month
      if (F.fall[k]) { const loss = eqB * F.fall[k]; eqB -= loss; total -= loss; }
      total += sip + add;
      if (total < 0) { minCash = Math.min(minCash, total); total = 0; }
      let target = 0;
      L.list.forEach(l => { const d = l.k - k; if (d >= 0 && d <= W) target += l.need / Math.pow(1 + md, d); });
      dB = Math.min(total, target); eqB = total - dB;
      let due = 0, paid = 0; const pays = [];
      L.list.forEach(l => {
        if (l.k !== k || !l.paid) return;
        const p = Math.max(0, Math.min(total, l.need));
        total -= p; due += l.need; paid += p;
        const r = paidBy[l.gid]; r.need += l.need; r.paid += p; r.ages.push(l.age);
        pays.push({ gid: l.gid, label: l.label, age: l.age, need: l.need, paid: p });
      });
      dB = Math.max(0, dB - paid); eqB = total - dB;
      if (eqB < 0) { dB += eqB; eqB = 0; }
      const row = { k, age: (F.a0m + k) / 12, sip, add, target, debtIn: dB, eqIn: eqB, due, paid, pays };
      if (k === K) { seedVal = total; row.close = total; row.eqEnd = eqB; row.dEnd = dB; rows.push(row); break; }
      eqB *= 1 + me; dB *= 1 + md; total = eqB + dB;
      row.close = total; row.eqEnd = eqB; row.dEnd = dB; rows.push(row);
    }
    const seedL = L.list.find(l => l.gid === 'seed');
    const goals = Object.entries(paidBy).map(([gid, r]) => ({ gid, label: r.label, ages: r.ages, need: r.need, paid: r.paid, frac: r.need > 0 ? r.paid / r.need : 1 }));
    const allPaid = goals.every(g => g.paid >= g.need - 0.5);
    const seedOk = !seedL || seedVal >= seedL.need - 0.5;
    return { rows, goals, seedVal, seedTarget: seedL ? seedL.need : 0, allPaid, seedOk, ok: allPaid && seedOk, L, F };
  }

  const bisect = (lo, hi, okFn, it = 60) => { for (let i = 0; i < it; i++) { const m = (lo + hi) / 2; okFn(m) ? (hi = m) : (lo = m); } return hi; };

  // required SIP, Method A (exact, then rounded up to the next ₹100)
  function requiredSipA(child, fam, eq) {
    const ok = s => simulate(child, fam, { eq, s0: s }).ok;
    if (ok(0)) return { exact: 0, rounded: 0 };
    if (!ok(5e7)) return { exact: NaN, rounded: NaN };
    const x = bisect(0, 5e7, ok);
    return { exact: x, rounded: Math.ceil(x / 100) * 100 };
  }
  // present value at month k0 of one liability, along the plan's own path:
  // the last `safeYears` before it at the debt rate, everything before that at the equity rate
  function pvOf(l, k0, eq, A) {
    const me = mRate(eq), md = mRate(A.debt), W = Math.round(A.safeYears * 12), d = l.k - k0;
    const dm = Math.min(W, d), em = Math.max(0, d - W);
    return { d, dm, em, pv: l.need / Math.pow(1 + md, dm) / Math.pow(1 + me, em), fD: Math.pow(1 + md, dm), fE: Math.pow(1 + me, em) };
  }
  // required SIP, Method B: (PV of all goals + seed - lump sum) / PV of ₹1 of first-year SIP (with step-ups)
  function requiredSipB(child, fam, eq) {
    const L = liabilities(child, fam.a), me = mRate(eq);
    const pvL = L.list.reduce((s, l) => s + pvOf(l, 0, eq, fam.a).pv, 0);
    const F = flows(child, fam, eq, 1, null);
    let pvS = 0; F.sip.forEach((g, k) => { pvS += g / Math.pow(1 + me, k); });
    const exact = pvS > 0 ? Math.max(0, (pvL - (child.sip.lumpsum || 0)) / pvS) : NaN;
    return { exact, rounded: Math.ceil(exact / 100) * 100, pvL, pvS };
  }

  // valuation point: today's value + date (money already invested), else the start (lump sum)
  function valuation(child) {
    const a0m = Math.max(0, monthsBetween(child.dob, child.startDate)), K = child.seed.age * 12 - a0m;
    if (child.current && child.current.value > 0 && child.current.date) {
      const k0 = Math.max(0, Math.min(K, monthsBetween(child.startDate, child.current.date)));
      return { k0, value: child.current.value, date: child.current.date };
    }
    return { k0: 0, value: child.sip.lumpsum || 0, date: child.startDate };
  }
  // life cover needed (always at the low equity case): PV of remaining goals + seed - money already invested
  function coverB(child, fam) {
    const eq = fam.a.eqLow, V = valuation(child), L = liabilities(child, fam.a);
    const rows = L.list.filter(l => l.k >= V.k0).map(l => Object.assign({}, l, pvOf(l, V.k0, eq, fam.a)));
    const pv = rows.reduce((s, r) => s + r.pv, 0);
    return { need: Math.max(0, pv - V.value), pv, rows, V };
  }
  function coverA(child, fam) {
    const eq = fam.a.eqLow, V = valuation(child);
    const ok = x => simulate(child, fam, { eq, s0: 0, fromK: V.k0, startBal: V.value + x, noLump: true }).ok;
    if (ok(0)) return { need: 0 };
    return { need: bisect(0, 5e9, ok) };
  }

  // Life cover need month by month along the plan (low equity case, at the SIP actually used).
  // need(k) = value at k of every goal still to come - money the plan holds at the start of month k
  //           - (share of the SIP that continues after this parent's death) x value at k of the SIPs still to come

  [[wsI, 'Inputs'], [wsG, 'Goals'], [wsS, 'Month by month'], [wsV, 'Cover by age'], [wsC, 'Check']].forEach(([ws, n]) => XLSX.utils.book_append_sheet(wb, ws, n));

  return wb;
}
if (typeof module !== 'undefined') module.exports = buildCheckWorkbook;

<script>// ===== Money Tree advisor view: UI =====

  const isoOf = s => { const m = String(s || '').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); if (!m) return null; const d = +m[1], mo = +m[2], y = +m[3]; const dt = new Date(y, mo - 1, d); if (dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null; return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`; };

  const ageTxt = months => `${Math.floor(months / 12)}y ${months % 12}m`;

      <div class="seg" style="margin-top:8px"><span>Cover split</span>
        <button class="sg ${fam.coverMode === 'proportional' ? 'on' : ''}" data-set="fam.coverMode" data-val="proportional">In proportion to SIP share</button>
        <button class="sg ${fam.coverMode === 'full' ? 'on' : ''}" data-set="fam.coverMode" data-val="full">Full cover on each earning parent</button></div>

    $('pNow').innerHTML = `<div class="row">${field('Current value (₹)', 'c.current.value', c.current.value, 'amt')}${field('As on', 'c.current.date', c.current.date, 'date')}</div>
      <div class="hint">Optional. Market value from Wealth Elite (not cost). Used for life cover needed now and for what-ifs.</div>`;

  // ---------- "how is this calculated" popovers ----------
  const fx = p => String(+(1 + p / 100).toFixed(4));

  function results() {

    };

      <div class="badge">${prod === 'tree' ? '🌳 Money Tree' : '🪴 Money Plant'} · ${esc(c.name || 'Child')} · SIP from ${dmy(c.startDate)} till age ${c.sip.endAge}</div>
      <table class="rt"><tr><th></th><th class="n">Equity ${A.eqLow}%</th><th class="n">Equity ${A.eqHigh}%</th></tr>

      <div class="hint">Highlighted = the SIP type and case selected on the left. Rounded up to the next ₹100. Debt ${A.debt}% · each goal moves to debt ${A.safeYears} years before it is due${c.sip.lumpsum ? ' · lump sum ' + inr(c.sip.lumpsum) + ' at start' : ''}.</div></section>`;

    const st = f => f >= 0.9999 ? '<span class="ok">✓ 100%</span>' : f > 0.0001 ? `<span class="part">${pct(f)}</span>` : '<span class="no">0%</span>';
    let totToday = 0, totThen = 0;

      const gH = simH.goals[i], L1 = L.list.filter(l => l.gid === g.gid && l.paid), today = L1.reduce((s, l) => s + l.today, 0);

    const seedRow = c.seed.on ? `<tr class="seedr"><td>✨ ${esc(c.seed.name)}</td><td>${c.seed.age}</td><td class="n">${inr(c.seed.targetToday)}</td><td class="n">${xn(inr(simL.seedTarget), seedTX)}</td><td class="n">${xn(inr(simL.seedVal), seedVX(simL, A.eqLow))}<br><small>${pct(simL.seedTarget ? Math.min(9.99, simL.seedVal / simL.seedTarget) : 1)} of target</small></td><td class="n">${xn(inr(simH.seedVal), seedVX(simH, A.eqHigh))}<br><small>${pct(simH.seedTarget ? Math.min(9.99, simH.seedVal / simH.seedTarget) : 1)} of target</small></td></tr>` : '';
    const pvAll = req.low.curB.pvL, allToday = totToday + (c.seed.on ? c.seed.targetToday : 0);
    const pvX = `<h5>Value today: ${inr(pvAll)}</h5>${tbl([[`Cost of every goal${seedTxt} in today's prices`, inr(allToday)], ['Value today (what would need to be invested today)', inr(pvAll), 't']])}
      <div class="mut">Value today is lower because the money grows faster (${A.eqLow}% in equity, ${A.debt}% in debt for the last ${A.safeYears} years) than the costs rise (${[...new Set(L.list.map(l => l.infl))].join('% / ')}%). Each payment's working is in section 5.</div>`;
    h += `<section class="card"><h3>2 · What ${inr(s0)}/month ${c.sip.type === 'stepup' ? `(+${c.sip.stepUp}% a year)` : '(fixed)'} covers <small>${c.sip.mode === 'custom' ? 'what they can invest' : 'the required SIP, ' + (c.caseSel === 'low' ? A.eqLow : A.eqHigh) + '% case'}</small></h3>
      <table class="rt"><tr><th>Goal</th><th>Age</th><th class="n">Cost today</th><th class="n">Cost then</th><th class="n">Funded at ${A.eqLow}%</th><th class="n">Funded at ${A.eqHigh}%</th></tr>${goalRows}
      <tr class="tot"><td>All goals</td><td></td><td class="n">${inr(totToday)}</td><td class="n">${inr(totThen)}</td><td></td><td></td></tr>${seedRow}</table>
      <div class="hint">Goals${seedTxt} in today's prices: <b>${inr(allToday)}</b> · value today at ${A.eqLow}%: <b>${xn(inr(pvAll), pvX)}</b>. Goals are paid in date order, so a shortfall falls on the later goals first, then on the ${esc(c.seed.name || 'Golden Seed')}.</div></section>`;
    // 3. life cover
    const V = cp.B.V, P = cp.path, pk = P.peakAll, now = P.now;
    const yearPts = P.pts.filter((p, i) => i === 0 || Math.round(p.age * 12) % 12 === 0);
    const byAge = `<div class="mut" style="margin-top:8px"><b>Cover needed if death happens at each age</b> (₹ lakh; highest marked):</div>
      <div class="strip"><table class="pt2"><tr>${yearPts.map(p => `<td class="n" style="${p.k === pk.k ? 'background:#fff6dc;font-weight:700' : ''}">${ageLbl(p.age)}</td>`).join('')}</tr><tr>${yearPts.map(p => `<td class="n" style="${p.k === pk.k ? 'background:#fff6dc;font-weight:700' : ''}">${lakh(p.all)}</td>`).join('')}</tr></table></div>`;
    const buyX = `${coverX(pk, '', 0)}<div class="mut">This is the highest need in any year of the plan, so one level policy of this size, bought now, keeps the Money Tree whole whenever the claim comes. It is higher than the need today (${inr(now.all)}) because a claim paid later has fewer years to grow, while the SIPs it replaces (stepping up ${c.sip.type === 'stepup' ? c.sip.stepUp : 0}% a year) are larger.</div>${byAge}`;
    h += `<section class="card"><h3>3 · Life cover to buy now <small>one level term policy, ${A.eqLow}% case, on ${inr(s0)}/month</small></h3>
      <div class="big">${xn(inr(pk.all), buyX)}</div>
      <div class="hint">Enough for a claim in <b>any year</b> of the plan: the highest need comes at child's age ${ageLbl(pk.age)}. If the claim came today, ${xn(inr(now.all), coverX(now, '', 0))} would be enough${pk.k !== now.k ? '; later claims need more because they have fewer years to grow' : ''}. Method A check: ${inr(cp.A.need)} today.</div>
      ${fam.parents.some(p => p.earns) ? `<h4>Notes for the premium quote</h4>
      <table class="rt"><tr><th>Life to be insured</th><th class="n">Share</th><th class="n">Cover to buy</th><th class="n">Existing (set aside)</th><th class="n">Gap</th><th class="n">Sum assured to quote</th><th class="n">Age now</th><th class="n">Age at policy end</th></tr>
      ${cp.per.map((p, i) => { if (!p) return ''; const pt = P.pts.find(x => x.k === p.peakK), nm = p.name || 'Parent ' + (i + 1);
        return `<tr><td>${esc(nm)}</td><td class="n">${fam.coverMode === 'full' ? 'Full' : pct(p.part)}</td><td class="n">${xn(inr(p.need), coverX(pt, nm, p.keep) + `<div class="mut">Highest need for ${esc(nm)}, at child's age ${ageLbl(p.peakAge)}.</div>`)}</td><td class="n">${inr(p.existing)}</td>
        <td class="n">${xn(inr(p.gap), `<h5>Gap: ${esc(nm)}</h5>${tbl([['Cover to buy (highest need)', inr(p.need)], ['− existing cover set aside for this plan', inr(p.existing)], ['= gap', inr(p.gap), 't']])}`)}</td>
        <td class="n"><b>${p.sa ? xn(inr(p.sa), `<h5>Sum assured: ${esc(nm)}</h5><div class="eq">Gap ${inr(p.gap)} rounded up to the next ₹5,00,000 = <b>${inr(p.sa)}</b></div>`) : '—'}</b></td><td class="n">${p.ageNow != null ? Math.floor(p.ageNow) : '—'}</td><td class="n">${p.ageEnd != null ? Math.floor(p.ageEnd) : '—'}</td></tr>`; }).join('')}</table>
      <ul class="notes">
        <li><b>Policy term: ${cp.term} years</b>, until the child is ${cp.endAge}${cp.fullyFundedLow ? ` (when the SIP ends; after that the money already invested funds everything)` : ` (the last goal: the SIP used is below the ${A.eqLow}%-case required SIP of ${inr(cp.reqLow)}, so the need never reaches zero earlier)`}.</li>
        <li><b>Premium paying term: ${cp.ppt} years</b> (regular pay). Limited pay (e.g. 10 years) is an option: higher yearly premium, finishes earlier.</li>
        <li>Sum assured = the highest gap in any year, rounded up to the next ₹5,00,000. One level term policy bought now; it never needs changing.</li>
        <li>This is cover for this plan only, on top of cover for the family's other needs (home loan, spouse's income).</li></ul>` : ''}</section>`;
    // 4. what if
    h += whatIfHTML(c, s0, cp);
    // 5. cross-check
    h += crossHTML(c, req, s0, cp);
    $('out').innerHTML = (warn.length ? `<div class="warn">${warn.join('<br>')}</div>` : '') + h;
    window.__last = { c, s0, req, cp };
  }
  const lakh = n => (n / 1e5).toLocaleString('en-IN', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

  const WI_TYPES = { pause: 'SIP paused (job loss)', reduce: 'SIP reduced', skipStep: 'Step-up skipped', fall: 'Market fall', lump: 'Bonus / gift added', withdraw: 'Emergency withdrawal', goal: 'Goal changed', death: 'Death of a parent' };
  function evLabel(e, c) {
    const g = c.goals.find(x => x.id === e.gid), p = fam.parents[+e.parent || 0] || {};
    return ({ pause: () => `SIP paused at age ${e.age} for ${e.months} months`, reduce: () => `SIP cut to ${inr(e.amount || 0)} at age ${e.age} for ${e.months} months`,
      skipStep: () => `Step-up skipped for ${e.years} year(s) from age ${e.age}`, fall: () => `Market fall of ${e.pct}% at age ${e.age}`,
      lump: () => `Bonus of ${inr(e.amount || 0)} at age ${e.age}`, withdraw: () => `Withdrawal of ${inr(e.amount || 0)} at age ${e.age}`,
      goal: () => `${g ? esc(g.label) : 'Goal'} changed${e.cost !== '' && e.cost != null ? ' to ' + inr(e.cost) : ''}${e.startAge !== '' && e.startAge != null ? ', from age ' + e.startAge : ''}${e.years !== '' && e.years != null ? ', over ' + e.years + ' yr' : ''}`,
      death: () => `Death of ${esc(p.name || 'Parent ' + ((+e.parent || 0) + 1))} at age ${e.age}` }[e.type] || (() => e.type))();
  }
  function whatIfHTML(c, s0, cp) {
    const eq = chosenEq(c), A = fam.a, a0 = Math.max(0, MT2.monthsBetween(c.dob, c.startDate)) / 12;
    const ed = c.whatIf.map((e, i) => {
      const f = (lbl, key, val, w) => `<label class="f ${w || ''}"><span>${lbl}</span><input class="in" data-p="c.whatIf.${i}.${key}" data-kind="${key === 'amount' || key === 'cost' || key === 'payout' ? 'amt' : 'num'}" value="${key === 'amount' || key === 'cost' || key === 'payout' ? (val === '' || val == null ? '' : num(val)) : (val ?? '')}"></label>`;
      let body = '', note = '';
      if (e.type === 'pause') body = f("From child's age", 'age', e.age) + f('For months', 'months', e.months);
      if (e.type === 'reduce') body = f("From child's age", 'age', e.age) + f('For months', 'months', e.months) + f('Reduced SIP (₹/month)', 'amount', e.amount);
      if (e.type === 'skipStep') body = f("From child's age", 'age', e.age) + f('Step-ups skipped (years)', 'years', e.years);
      if (e.type === 'fall') body = f("At child's age", 'age', e.age) + f('Fall in the equity part %', 'pct', e.pct);
      if (e.type === 'lump' || e.type === 'withdraw') body = f("At child's age", 'age', e.age) + f('Amount (₹)', 'amount', e.amount);
      if (e.type === 'goal') {
        const g = c.goals.find(x => x.id === e.gid) || c.goals[0];
        body = `<label class="f"><span>Goal</span><select class="in" data-p="c.whatIf.${i}.gid" data-kind="text">${c.goals.map(gx => `<option value="${gx.id}" ${gx.id === e.gid ? 'selected' : ''}>${esc(gx.label)}</option>`).join('')}</select></label>` + f(`New cost today (₹${g.perYear ? ' a year' : ', total'}; blank = same)`, 'cost', e.cost) + f(`New start age (blank = ${g.startAge})`, 'startAge', e.startAge) + f(`New number of years (blank = ${g.years})`, 'years', e.years);
        const sa = e.startAge === '' || e.startAge == null ? null : +e.startAge;
        if (sa != null && sa < a0) note = `<div class="warn">${esc(g.label)} at age ${sa} is before the SIP starts (age ${ageLbl(a0)}), so it drops out of the plan.</div>`;
        else if (sa != null && sa < g.startAge) note = `<div class="warn">${esc(g.label)} now starts at <b>age ${sa}</b> (it was ${g.startAge}). The plan has much less money by then, and the later goals no longer have to pay for it. If you meant <b>${sa} years</b>, put that in "New number of years" and leave the start age blank.</div>`;
      }
      if (e.type === 'death') body = `<label class="f"><span>Parent</span><select class="in" data-p="c.whatIf.${i}.parent" data-kind="num">${fam.parents.map((p, j) => `<option value="${j}" ${+e.parent === j ? 'selected' : ''}>${esc(p.name || 'Parent ' + (j + 1))}</option>`).join('')}</select></label>` + f("At child's age", 'age', e.age) + f('Claim paid in (₹, blank = sum assured)', 'payout', e.payout);
      const on = e.on !== false;
      return `<div class="wi ${on ? '' : 'off'}"><label class="wih"><input type="checkbox" data-p="c.whatIf.${i}.on" data-kind="bool" ${on ? 'checked' : ''}> <b>${WI_TYPES[e.type]}</b><span class="mut">${on ? '' : ' · switched off'}</span></label><div class="row">${body}</div>${on ? note : ''}<button class="x" data-delwi="${i}" title="Remove">✕</button></div>`;
    }).join('');
    let res = '';
    const act = c.whatIf.filter(e => e.on !== false);
    if (c.whatIf.length && !act.length) res = '<div class="hint">Every event is switched off. Tick one to see its effect.</div>';
    if (act.length) {
      const w = MT2.whatIf(c, fam, eq, s0, act, cp.per);
      const stf = f => f >= 0.9999 ? '<span class="ok">✓</span>' : `<span class="part">${pct(f)}</span>`;
      const Ls = w.scen.L.list;
      const rows = w.scen.goals.map((s) => {
        const g = w.base.goals.find(b => b.gid === s.gid) || { frac: 1 }, L1 = Ls.filter(l => l.gid === s.gid && l.paid), pays = paysOf(w.scen, s.gid);
        const short = s.need - s.paid;
        return `<tr><td>${esc(s.label)}</td><td>${s.ages.length > 1 ? s.ages[0] + '–' + s.ages[s.ages.length - 1] : s.ages[0]}</td><td class="n">${xn(inr(s.need), costThenX(L1, esc(s.label)))}</td><td class="n">${stf(g.frac)}</td><td class="n">${xn(stf(s.frac), paidListX(pays, esc(s.label) + ': what if'))}</td><td class="n">${short > 0.5 ? xn(inr(short), `<h5>Shortfall: ${esc(s.label)}</h5>${tbl([['Cost then', inr(s.need)], ['− paid', inr(s.paid)], ['= shortfall', inr(short), 't']])}<div class="mut">Goals are paid in date order; this one came after the money ran out.</div>`) : '—'}</td></tr>`;
      }).join('');
      const seedR = c.seed.on ? `<tr class="seedr"><td>✨ ${esc(c.seed.name)}</td><td>${c.seed.age}</td><td class="n">${inr(w.scen.seedTarget)}</td><td class="n">${inr(w.base.seedVal)}</td><td class="n">${inr(w.scen.seedVal)}</td><td class="n">${w.scen.seedTarget - w.scen.seedVal > 0.5 ? inr(w.scen.seedTarget - w.scen.seedVal) : '—'}</td></tr>` : '';
      const fx_ = w.fix; let fixes = '';

      else {
        const opts = [];
        const early = w.scen.goals.filter(g => g.paid < g.need - 0.5 && Math.max(...g.ages) < w.restartAge);
        if (fx_.raise) opts.push(`Raise the SIP by <b>${fx_.raise.pct.toFixed(1)}%</b> from age ${w.restartAge.toFixed(1)}: ${inr(fx_.raise.sipBefore)} → <b>${inr(Math.ceil(fx_.raise.sipThen / 100) * 100)}</b>/month${c.sip.type === 'stepup' ? ', with the step-ups continuing' : ''}.`);
        if (fx_.extend) opts.push(`Continue the SIP till age <b>${fx_.extend.endAge}</b> (instead of ${c.sip.endAge})${fx_.extend.mandate ? ' — needs the child\'s own mandate after 18' : ''}.`);
        else opts.push(`Extending the SIP up to age ${c.seed.age} is not enough on its own.`);
        if (fx_.lump) opts.push(`Add a lump sum of <b>${inr(fx_.lump.amount)}</b> at age ${w.restartAge.toFixed(1)}.`);
        opts.push('Or trim a goal by the shortfall shown above.');
        fixes = (early.length ? `<div class="warn">${early.map(g => esc(g.label)).join(', ')} falls due before age ${w.restartAge.toFixed(1)}, when catching up would start, so none of the options below can reach it. Only money added before it is due, or moving the goal, helps.</div>` : '') +
          `<div class="hint"><b>Ways to catch up</b> (any one):</div><ol class="notes">${opts.map(o => `<li>${o}</li>`).join('')}</ol>`;
      }
      // each event on its own, then all together
      let each = '';
      if (act.length > 1) {
        const line = (lbl, sc) => { const short = sc.goals.filter(g => g.paid < g.need - 0.5); const sGap = sc.seedTarget - sc.seedVal;
          return `<tr><td>${lbl}</td><td>${short.length ? short.map(g => `${esc(g.label)} <span class="part">${pct(g.frac)}</span>`).join(', ') : '<span class="ok">All funded ✓</span>'}</td>${c.seed.on ? `<td class="n">${inr(sc.seedVal)}${sGap > 0.5 ? ` <span class="part">(${pct(sc.seedVal / sc.seedTarget)})</span>` : ' <span class="ok">✓</span>'}</td>` : ''}</tr>`; };
        each = `<h4>Each event on its own, then all together</h4><table class="rt sm"><tr><th>Event</th><th>Goals not fully funded</th>${c.seed.on ? `<th class="n">${esc(c.seed.name)} at ${c.seed.age}</th>` : ''}</tr>
          ${act.map(e => line(evLabel(e, c), MT2.whatIf(c, fam, eq, s0, [e], cp.per, true).scen)).join('')}
          ${line('<b>All together</b>', w.scen).replace('<tr>', '<tr class="tot">')}</table>`;
      }
      res = `<table class="rt"><tr><th>Goal</th><th>Age</th><th class="n">Cost then</th><th class="n">Funded: plan</th><th class="n">Funded: what if</th><th class="n">Shortfall</th></tr>${rows}${seedR}</table>${fixes}${each}`;
    }
    return `<section class="card"><h3>4 · What if… <small>on ${inr(s0)}/month at the ${eq}% case; events combine</small></h3>
      <div class="chips">${Object.entries(WI_TYPES).map(([k, v]) => `<button class="chip" data-addwi="${k}">+ ${v}</button>`).join('')}</div>${ed}${res || '<div class="hint">Add one or more events to see their effect and the ways to catch up.</div>'}
      <div class="hint">Tick or untick an event to switch it on or off. Events that are on are applied together; with two or more, each one's effect on its own is shown too. Market fall hits the equity part only. Death of a parent: the claim (sum assured incl. existing cover set aside) is invested and ${fam.coverMode === 'full' ? 'the SIP stops' : "the other parent's share of the SIP continues"}.</div></section>`;
  }

  function crossHTML(c, req, s0, cp) {
    const A = fam.a, cs = window.__xcase || c.caseSel, eq = cs === 'low' ? A.eqLow : A.eqHigh;
    const B = MT2.requiredSipB(c, fam, eq), L = MT2.liabilities(c, A), md = MT2.mRate(A.debt), W = Math.round(A.safeYears * 12);
    const rateNote = `<div class="mut">Monthly rates are the yearly rates converted exactly, so ${eq}% is a true ${eq}% a year: ${(MT2.mRate(eq) * 100).toFixed(4)}% a month. (${eq}% ÷ 12 = ${(eq / 12).toFixed(4)}% a month would compound to ${((Math.pow(1 + eq / 1200, 12) - 1) * 100).toFixed(2)}% a year.)</div>`;
    const rows = L.list.map(l => { const p = MT2.pvOf(l, 0, eq, A);
      const thenX = `<h5>${esc(l.label)}${l.paid ? '' : ' (target)'}, age ${l.age}: cost then</h5><div class="eq">${inr(l.today)} × ${pw(l.infl, l.k)} = <b>${inr(l.need)}</b></div><div class="mut">Grows at ${l.infl}% a year for ${yrs(l.k)} years (${l.k} months from the SIP start).</div>`;
      const pvX = `<h5>${esc(l.label)}${l.paid ? '' : ' (target)'}, age ${l.age}: value today</h5><div class="eq">${inr(l.need)} ÷ ${pw(A.debt, p.dm)} ÷ ${pw(eq, p.em)} = <b>${inr(p.pv)}</b></div>
        <div>${tbl([['Cost then', inr(l.need)], [`÷ ${p.dm} months in debt at ${A.debt}% (the last ${A.safeYears} years)`, inr(l.need / p.fD)], [`÷ ${p.em} months in equity at ${eq}% (before that)`, inr(p.pv), 't']])}</div>${rateNote}`;
      return `<tr><td>${esc(l.label)}${l.paid ? '' : ' (target)'}</td><td>${l.age}</td><td class="n">${l.k}</td><td class="n">${inr(l.today)}</td><td class="n">${l.infl}%</td><td class="n">${xn(inr(l.need), thenX)}</td><td class="n">${p.dm}</td><td class="n">${p.em}</td><td class="n">${xn(inr(p.pv), pvX)}</td></tr>`; }).join('');
    const d = (a, b) => { const x = Math.abs(a - b); return x < 1 ? '<span class="ok">match</span>' : `<span class="no">${inr(x)}</span>`; };
    const sim = MT2.simulate(c, fam, { eq, s0 });
    // year by year
    const yr = {};
    let prevClose = 0;
    sim.rows.forEach(r => { const a = Math.floor(r.age + 1e-9);
      if (!yr[a]) yr[a] = { a, open: prevClose, sip: 0, add: 0, paid: 0, pays: [], sips: [], eq: 0, debt: 0, close: 0, k: 0, gE: 0, gD: 0, m: 0 };
      const y = yr[a]; y.sip += r.sip; y.add += r.add; y.paid += r.paid; y.pays.push(...r.pays); y.sips.push(r.sip); y.eq = r.eqEnd; y.debt = r.dEnd; y.close = r.close; y.k = r.k; y.gE += r.eqEnd - r.eqIn; y.gD += r.dEnd - r.debtIn; y.m++; prevClose = r.close; });
    const grp = arr => { const out = []; arr.forEach(v => { const l = out[out.length - 1]; if (l && Math.abs(l.v - v) < 0.005) l.n++; else out.push({ v, n: 1 }); }); return out; };
    const yrows = Object.values(yr).map(y => {
      const g = y.open + y.sip + y.add - y.paid, growth = y.close - g;
      const sipX = `<h5>SIP paid in during age ${y.a}</h5>${tbl(grp(y.sips).map(s => [`${s.n} month${s.n > 1 ? 's' : ''} × ${inr(s.v)}`, inr(s.v * s.n)]).concat([['Total', inr(y.sip), 't']]))}`;
      const debtList = L.list.map(l => ({ l, m: l.k - y.k - 1 })).filter(x => x.m >= 0 && x.m < W);
      const debtX = `<h5>In debt at the end of age ${y.a}</h5>${debtList.length ? `<div>Money for every goal due in the next ${A.safeYears} years, each discounted at ${A.debt}%:</div>${tbl(debtList.map(x => [`${esc(x.l.label)}${x.l.paid ? '' : ' (kept)'}, age ${x.l.age}: ${inr(x.l.need)} ÷ ${pw(A.debt, x.m)}`, inr(x.l.need / Math.pow(1 + md, x.m))]).concat([['Total in debt', inr(y.debt), 't']]))}` : `<div>Nothing is due in the next ${A.safeYears} years, so all the money stays in equity.</div>`}`;
      const eqX = `<h5>In equity at the end of age ${y.a}</h5>${tbl([['Total at year end', inr(y.close)], ['− in debt', inr(y.debt)], ['= in equity', inr(y.eq), 't']])}<div class="mut">Everything not needed for goals in the next ${A.safeYears} years stays in equity.</div>`;
      const totX = `<h5>Total at the end of age ${y.a}</h5>${tbl([['Start of the year', inr(y.open)], ['+ SIP paid in', inr(y.sip)]].concat(y.add ? [[y.add > 0 ? '+ lump sum' : '− withdrawal', inr(Math.abs(y.add))]] : []).concat(y.paid ? [['− goals paid', inr(y.paid)]] : []).concat([['+ growth (see below)', inr(growth)], ['= total at year end', inr(y.close), 't']]))}
        <h5 style="margin-top:10px">How the growth is worked out</h5>${tbl([[`Equity part: grows ${(MT2.mRate(eq) * 100).toFixed(4)}% every month (= ${eq}% a year), ${y.m} months`, inr(y.gE)], [`Debt part: grows ${(MT2.mRate(A.debt) * 100).toFixed(4)}% every month (= ${A.debt}% a year), ${y.m} months`, inr(y.gD)], ['= growth', inr(y.gE + y.gD), 't']])}
        <div class="mut">Month by month: this month's SIP is added, goals due are paid, then the equity part × ${fx(eq)}<sup>1/12</sup> and the debt part × ${fx(A.debt)}<sup>1/12</sup>. The growth of all ${y.m} months is added up. The debt part holds the money for goals due in the next ${A.safeYears} years.</div>`;
      const addX = `<h5>${y.add > 0 ? 'Lump sum' : 'Withdrawal'} during age ${y.a}</h5><div class="eq">${inr(Math.abs(y.add))}</div><div class="mut">${y.a === Math.floor(sim.rows[0].age) && c.sip.lumpsum ? 'Lump sum at the SIP start.' : 'From the what-if events (not applied here) or the start lump sum.'}</div>`;
      return `<tr><td>${y.a}</td><td class="n">${xn(inr(y.sip), sipX)}</td><td class="n">${y.add ? xn(inr(y.add), addX, true) : '—'}</td><td class="n">${y.paid ? xn(inr(y.paid), paidListX(y.pays, `Goals paid during age ${y.a}`), true) : '—'}</td><td class="n">${xn(inr(y.eq), eqX)}</td><td class="n">${xn(inr(y.debt), debtX)}</td><td class="n">${xn(inr(y.close), totX)}</td></tr>`;
    }).join('');
    const cpA = MT2.coverA(c, fam).need, cpB = MT2.coverB(c, fam).need, pk = cp.path.peakAll;
    const pkA = MT2.claimNeededA(c, fam, s0, null, pk.k, 0);
    return `<section class="card"><h3>5 · Check the math <small>two independent methods + Excel</small></h3>
      <table class="rt"><tr><th></th><th class="n">Method A: month-by-month simulation</th><th class="n">Method B: present-value formula</th><th class="n">Difference</th></tr>
      ${['low', 'high'].map(k => `<tr><td>Required SIP (${c.sip.type === 'stepup' ? 'step-up' : 'fixed'}), equity ${req[k].eq}%</td><td class="n">${inr(req[k].cur.exact)} → ${inr(req[k].cur.rounded)}</td><td class="n">${inr(req[k].curB.exact)} → ${inr(req[k].curB.rounded)}</td><td class="n">${d(req[k].cur.exact, req[k].curB.exact)}</td></tr>`).join('')}
      <tr><td>Life cover needed now (${A.eqLow}% case)</td><td class="n">${inr(cpA)}</td><td class="n">${inr(cpB)}</td><td class="n">${d(cpA, cpB)}</td></tr>
      <tr><td>Life cover to buy (highest need, at age ${ageLbl(pk.age)})</td><td class="n">${inr(pkA)}<br><small>smallest claim at that age that keeps every goal funded</small></td><td class="n">${inr(pk.all)}<br><small>value then of goals − money held</small></td><td class="n">${d(pkA, pk.all)}</td></tr></table>
      <ul class="notes"><li><b>Method A</b> runs the plan month by month: SIP in → money for goals due within ${A.safeYears} years is kept in debt (each discounted at ${A.debt}%) → goals paid → equity grows at the equity rate, debt at ${A.debt}%. The required SIP is the smallest SIP that pays every goal in full${c.seed.on ? ' and leaves the ' + esc(c.seed.name) + ' target' : ''}.</li>
      <li><b>Method B</b>: Required SIP = (value today of every goal${c.seed.on ? ' + seed' : ''} − lump sum) ÷ (value today of ₹1 of first-year SIP, with step-ups). Value today = cost then ÷ (1 + debt rate)^(years in debt) ÷ (1 + equity rate)^(years in equity).</li>
      <li>Monthly rate = (1 + yearly rate)^(1/12) − 1, so ${eq}% is exactly ${eq}% a year (not ${eq}% ÷ 12).</li></ul>
      <div class="seg"><span>Working shown for</span><button class="sg ${cs === 'low' ? 'on' : ''}" data-xcase="low">Equity ${A.eqLow}%</button><button class="sg ${cs === 'high' ? 'on' : ''}" data-xcase="high">Equity ${A.eqHigh}%</button></div>
      <table class="rt sm"><tr><th>Payment</th><th>Age</th><th class="n">Month k</th><th class="n">Cost today</th><th class="n">Infl.</th><th class="n">Cost then</th><th class="n">Months in debt</th><th class="n">Months in equity</th><th class="n">Value today</th></tr>${rows}
      <tr class="tot"><td colspan="8">Total value today of all payments</td><td class="n">${inr(B.pvL)}</td></tr>
      <tr class="tot"><td colspan="8">Value today of ₹1 of first-year SIP (sum of each month's SIP factor ÷ (1 + equity monthly)^k)</td><td class="n">${B.pvS.toFixed(4)}</td></tr>
      <tr class="tot"><td colspan="8">Required SIP = (${inr(B.pvL)} − ${inr(c.sip.lumpsum || 0)}) ÷ ${B.pvS.toFixed(4)}</td><td class="n">${inr(B.exact)}</td></tr></table>
      <h4>Year by year at ${inr(s0)}/month, equity ${eq}%</h4>
      <div class="scroll"><table class="rt sm"><tr><th>Age</th><th class="n">SIP paid in</th><th class="n">Lump sum / withdrawal</th><th class="n">Goals paid</th><th class="n">In equity*</th><th class="n">In debt*</th><th class="n">Total at year end</th></tr>${yrows}</table></div>
      <div class="hint">*At the end of each year of age: in equity + in debt = total. Hover over <b>Goals paid</b> to see which goals; click any number for its working.</div>
      <div class="xrow"><div>The Excel file recomputes every number above with live formulas (Check → Inputs → Goals → Month by month → Cover by age). Change the SIP or the equity return in Inputs and it recalculates.</div><button class="btn" id="xlBtn">⬇ Excel check (${eq}% case)</button></div></section>`;
  }

  // ---------- events ----------
  function setPath(path, val) {
    const parts = path.split('.'); let o = parts[0] === 'fam' ? fam : child();
    for (let i = 1; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = val;
  }
  let tmr = null; const later = (fn, ms = 250) => { clearTimeout(tmr); tmr = setTimeout(fn, ms); };
  const STRUCT = /(dob|startDate|product|perYear|earns|\.on$|sip\.type|sip\.mode|caseSel|coverMode|endAge|eqLow|eqHigh|infl$)/;
  function onInput(e) {
    const el = e.target; if (!el.dataset || !el.dataset.p) return;
    const k = el.dataset.kind, p = el.dataset.p;
    let v;
    if (k === 'bool') v = el.checked;
    else if (k === 'boolsel') v = el.value === '1';
    else if (k === 'text') v = el.value;
    else if (k === 'date') { v = isoOf(el.value); el.classList.toggle('bad', !v && el.value.trim() !== '' && (e.type === 'change' || el.value.replace(/\D/g, '').length === 8)); if (!v) { if (el.value.trim() === '' && (p.startsWith('fam.parents') || p === 'c.current.date')) v = ''; else return; } }
    else if (k === 'amt') v = el.value.trim() === '' && /whatIf/.test(p) ? '' : parseAmt(el.value);
    else { if (el.value.trim() === '' && /whatIf/.test(p)) v = ''; else { v = parseFloat(el.value); if (!isFinite(v)) return; } }
    if (p.startsWith('c.')) setPath(p.replace(/^c\./, 'c.'), v); else setPath(p, v);
    if (p === 'c.sip.amount' || p === 'c.sip.mode') { /* nothing extra */ }
    save();
    if (e.type === 'change' && (k === 'bool' || k === 'boolsel' || k === 'date' || STRUCT.test(p))) { renderInputs(); results(); }
    else later(results);
  }
  // ---- date mask: type 27011998 -> 27/01/1998 (slashes added automatically) ----
  const fmtDate = d => { d = d.slice(0, 8); return d.length > 4 ? `${d.slice(0, 2)}/${d.slice(2, 4)}/${d.slice(4)}` : d.length > 2 ? `${d.slice(0, 2)}/${d.slice(2)}` : d; };
  function maskDate(el, e) {
    const pos = el.selectionStart == null ? el.value.length : el.selectionStart;
    let digits = el.value.replace(/\D/g, ''), before = el.value.slice(0, pos).replace(/\D/g, '').length;
    // backspace on a "/" also removes the digit before it
    if (e.inputType === 'deleteContentBackward' && digits === el.dataset.prev && before > 0) { digits = digits.slice(0, before - 1) + digits.slice(before); before--; }
    digits = digits.slice(0, 8);
    const out = fmtDate(digits);
    let caret = 0, seen = 0; while (caret < out.length && seen < Math.min(before, digits.length)) { if (/\d/.test(out[caret])) seen++; caret++; }
    el.value = out; el.dataset.prev = digits;
    try { el.setSelectionRange(caret, caret); } catch (_) { }
  }
  document.addEventListener('focusin', e => { const el = e.target; if (el.dataset && el.dataset.kind === 'date') el.dataset.prev = el.value.replace(/\D/g, ''); });
  document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.kind === 'date') maskDate(e.target, e); }, true);
  document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.kind && e.target.dataset.kind !== 'bool' && e.target.tagName !== 'SELECT') onInput(e); });
  document.addEventListener('change', onInput);
  document.addEventListener('focusout', e => { const el = e.target; if (el.classList && el.classList.contains('amt') && el.value.trim() !== '') el.value = num(parseAmt(el.value)); });
  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.set) { setPath(t.dataset.set, t.dataset.val === '' ? null : t.dataset.val); if (t.dataset.set === 'c.sip.mode' && t.dataset.val === 'custom' && !child().sip.amount) child().sip.amount = chosenSip(Object.assign({}, child(), { sip: Object.assign({}, child().sip, { mode: 'required' }) })); save(); renderInputs(); results(); return; }
    if (t.dataset.child) { ci = +t.dataset.child; window.__xcase = null; renderInputs(); results(); return; }
    if (t.id === 'addChild') { const c0 = child(); const n = MT2.defaultChild(new Date().toISOString().slice(0, 10), new Date().toISOString().slice(0, 10)); fam.children.push(n); ci = fam.children.length - 1; void c0; save(); renderInputs(); results(); return; }
    if (t.id === 'delChild') { if (fam.children.length > 1 && confirm('Remove this child from the family?')) { fam.children.splice(ci, 1); ci = 0; save(); renderInputs(); results(); } return; }
    if (t.id === 'addGoal') { child().goals.push({ id: 'g' + Date.now().toString(36), label: 'New goal', on: true, cost: 500000, perYear: false, startAge: 20, years: 1, infl: 7, custom: true }); save(); renderInputs(); results(); return; }
    if (t.dataset.delgoal) { child().goals.splice(+t.dataset.delgoal, 1); save(); renderInputs(); results(); return; }
    if (t.id === 'plantGoals') { const c = child(); c.goals = MT2.GOALS().map(g => Object.assign(g, { on: !!g.edu })); c.seed.on = false; save(); renderInputs(); results(); return; }
    if (t.id === 'treeGoals') { const c = child(); c.goals = MT2.GOALS(); c.seed.on = true; save(); renderInputs(); results(); return; }
    if (t.dataset.addwi) { const c = child(), a0 = Math.ceil(Math.max(0, MT2.monthsBetween(c.dob, c.startDate)) / 12), ty = t.dataset.addwi;
      const d = { pause: { age: Math.max(a0, 8), months: 12 }, reduce: { age: Math.max(a0, 8), months: 24, amount: 10000 }, skipStep: { age: Math.max(a0, 6), years: 3 }, fall: { age: Math.max(a0, 12), pct: 30 }, lump: { age: Math.max(a0, 3), amount: 200000 }, withdraw: { age: Math.max(a0, 10), amount: 500000 }, goal: { gid: (c.goals[2] || c.goals[0]).id, cost: '', startAge: '', years: '' }, death: { parent: 0, age: Math.max(a0, 5), payout: '' } }[ty];
      c.whatIf.push(Object.assign({ type: ty }, d)); save(); results(); return; }
    if (t.dataset.delwi) { child().whatIf.splice(+t.dataset.delwi, 1); save(); results(); return; }
    if (t.dataset.xcase) { window.__xcase = t.dataset.xcase; results(); return; }
    if (t.id === 'xlBtn') { excel(); return; }
    if (t.id === 'newFam') { if (confirm('Start a new family? The current one stays saved in this browser.')) { save(); fam = MT2.defaultFamily(); ci = 0; save(); refreshFamList(); renderInputs(); results(); } return; }
    if (t.id === 'expFam') { const b = new Blob([JSON.stringify(fam, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `MoneyTree_${(fam.name || 'family').replace(/\W+/g, '_')}.json`; a.click(); return; }
    if (t.id === 'impFam') { $('impFile').click(); return; }
  });
  $('impFile').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; try { const j = JSON.parse(await f.text()); if (!j.children || !j.parents) throw 0; fam = j; ci = 0; save(); refreshFamList(); renderInputs(); results(); } catch (_) { alert('That file is not a Money Tree family file.'); } e.target.value = ''; });
  $('famName').addEventListener('input', e => { fam.name = e.target.value; save(); later(refreshFamList, 400); });
  $('famList').addEventListener('change', e => { const id = e.target.value; if (store.families[id]) { save(); fam = store.families[id]; ci = 0; save(); renderInputs(); results(); } });
  function refreshFamList() { const ids = Object.keys(store.families); $('famList').innerHTML = ids.map(id => `<option value="${id}" ${id === fam.id ? 'selected' : ''}>${esc(store.families[id].name || 'Unnamed family')} (${store.families[id].children.length})</option>`).join(''); }

  function excel() {
    if (!window.XLSX) { alert('The Excel library did not load (needs internet).'); return; }
    const c = child(), cs = window.__xcase || c.caseSel, eq = cs === 'low' ? fam.a.eqLow : fam.a.eqHigh;
    const s0 = window.__last.s0, B = MT2.requiredSipB(c, fam, eq), rq = MT2.requiredSipA(c, fam, eq);
    const sim = MT2.simulate(c, fam, { eq, s0 });
    const c0 = Object.assign({}, c, { current: { value: 0, date: '' } });
    const cov0 = MT2.coverB(c0, fam).need, cpl = window.__last.cp;
    const coverEndK = Math.round(cpl.endAge * 12) - Math.max(0, MT2.monthsBetween(c.dob, c.startDate));
    const coverPeak = MT2.coverPath(c0, fam, s0, coverEndK).peakAll.all;
    const tool = { coverPeak, coverEndK, pvL: B.pvL, pvS: B.pvS, reqB: B.exact, reqRounded: rq.rounded, due: sim.goals.reduce((s, g) => s + g.need, 0), paid: sim.goals.reduce((s, g) => s + g.paid, 0), seedVal: sim.seedVal, seedTarget: sim.seedTarget, ok: sim.ok, coverStart: cov0 };
    const wb = buildCheckWorkbook(XLSX, c, fam, eq, s0, tool);
    XLSX.writeFile(wb, `MoneyTree_check_${(c.name || 'child').replace(/\W+/g, '_')}_${eq}pc.xlsx`);
  }

  save(); refreshFamList(); renderInputs(); results();
})();
</script>
</body></html>
