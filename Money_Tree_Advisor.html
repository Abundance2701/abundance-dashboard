<header><h1>🌳 Money Tree <small>Advisor view · not for clients</small></h1>
<select id="famList" title="Saved families"></select><input id="famName" placeholder="Family name">
<span class="sp"></span>
<button class="hbtn" id="newFam">New family</button><button class="hbtn" id="expFam">Export file</button><button class="hbtn" id="impFam">Import file</button><input type="file" id="impFile" accept=".json" hidden>
</header>
<div class="wrap">
<div class="side">
  <div class="card"><h3>Family &amp; parents</h3><div id="pParents"></div></div>
  <div class="card"><h3>Child</h3><div class="chips" id="childTabs"></div><div id="pChild"></div><button class="lnk" id="delChild">Remove this child</button></div>
  <div class="card"><h3>Goals</h3><div id="pGoals"></div></div>
  <div class="card"><h3>SIP</h3><div id="pSip"></div></div>
  <div class="card"><h3>Assumptions</h3><div id="pAssume"></div></div>
  <div class="card"><h3>Money already invested</h3><div id="pNow"></div></div>
</div>
<main id="out"></main>
</div>

<script>// ===== Money Tree advisor engine v2 (pure functions) =====
// Model: two buckets. Every month: SIP in -> rebalance so the DEBT bucket holds exactly the money for
// goals due within the next `safeYears` (each discounted at the debt rate) -> pay goals due this month
// -> grow equity at the equity rate and debt at the debt rate. Monthly rates = (1+annual)^(1/12)-1.
// Method A = this month-by-month simulation. Method B = closed-form present values.
const MT2 = (() => {
  const GOALS = () => ([
    { id: 'puc', label: 'PUC (11th & 12th)', on: true, cost: 150000, perYear: true, startAge: 16, years: 2, infl: 10, edu: true },
    { id: 'grad', label: 'Graduation', on: true, cost: 300000, perYear: true, startAge: 18, years: 4, infl: 10, edu: true },
    { id: 'pg', label: 'Post-graduation', on: true, cost: 1500000, perYear: false, startAge: 22, years: 2, infl: 10, edu: true },
    { id: 'car', label: 'First car', on: true, cost: 1000000, perYear: false, startAge: 24, years: 1, infl: 7 },
    { id: 'wedding', label: 'Wedding', on: true, cost: 1500000, perYear: false, startAge: 27, years: 1, infl: 7 }
  ]);
  function defaultChild(dobISO, startISO) {
    return {
      id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      name: '', dob: dobISO, startDate: startISO, product: null, // null = auto (tree if child <= 5 at start)
      goals: GOALS(),
      seed: { on: true, name: 'Golden Seed', targetToday: 500000, age: 27 },
      sip: { type: 'stepup', stepUp: 5, endAge: 18, mode: 'required', amount: 0, lumpsum: 0 },
      caseSel: 'low',
      current: { value: 0, date: '' },
      whatIf: []
    };
  }
  function defaultFamily() {
    const t = new Date(), iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    return {
      id: 'f' + Date.now().toString(36), name: '',
      parents: [{ name: '', dob: '', earns: true, share: 100, existing: 0 }, { name: '', dob: '', earns: false, share: 0, existing: 0 }],
      coverMode: 'proportional',
      a: { eqLow: 10, eqHigh: 12, debt: 5.5, safeYears: 2, infl: 7 },
      children: [defaultChild(iso(t), iso(t))]
    };
  }

  function monthsBetween(d1, d2) {
    const a = new Date(d1 + 'T00:00:00'), b = new Date(d2 + 'T00:00:00');
    let m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
    if (b.getDate() < a.getDate()) m -= 1;
    return m;
  }
  const mRate = p => Math.pow(1 + p / 100, 1 / 12) - 1;
  const productOf = c => c.product || (Math.max(0, monthsBetween(c.dob, c.startDate)) <= 60 ? 'tree' : 'plant');

  // ---- the liabilities: every goal payment (paid) + the Golden Seed target (kept, not paid) ----
  // k = months after the SIP start date; need = cost today x (1+inflation)^(k/12)
  function liabilities(child, A, goalsOverride) {
    const a0m = Math.max(0, monthsBetween(child.dob, child.startDate));
    const K = child.seed.age * 12 - a0m;
    const out = [];
    (goalsOverride || child.goals).forEach(g => {
      if (!g.on) return;
      const years = Math.max(1, Math.round(g.years || 1));
      const per = g.perYear ? g.cost : g.cost / years;
      for (let y = 0; y < years; y++) {
        const age = g.startAge + y, k = age * 12 - a0m;
        if (k < 0 || age > child.seed.age) continue;
        out.push({ gid: g.id, label: g.label, age, k, today: per, infl: g.infl, need: per * Math.pow(1 + g.infl / 100, k / 12), paid: true });
      }
    });
    if (child.seed.on && child.seed.targetToday > 0) out.push({ gid: 'seed', label: child.seed.name || 'Golden Seed', age: child.seed.age, k: K, today: child.seed.targetToday, infl: A.infl, need: child.seed.targetToday * Math.pow(1 + A.infl / 100, K / 12), paid: false });
    return { list: out.sort((x, y) => x.k - y.k || (x.paid ? -1 : 1)), a0m, K };
  }

  // ---- money flows per month: SIP, lump sums/withdrawals, market falls ----
  function flows(child, fam, eq, s0, mods) {
    const a0m = Math.max(0, monthsBetween(child.dob, child.startDate)), K = child.seed.age * 12 - a0m;
    const sp = child.sip, endAge = mods && mods.endAge != null ? mods.endAge : sp.endAge;
    const step = sp.type === 'stepup' ? (sp.stepUp || 0) / 100 : 0;
    const sip = new Array(K + 1).fill(0), add = new Array(K + 1).fill(0), fall = new Array(K + 1).fill(0);
    const ev = (mods && mods.events) || [];
    const kOf = age => Math.round(age * 12) - a0m;
    for (let k = 0; k <= K; k++) {
      if (a0m + k >= endAge * 12) continue;
      let yrs = Math.floor(k / 12);
      ev.filter(e => e.type === 'skipStep').forEach(e => { const k1 = kOf(e.age); if (k >= k1) yrs -= Math.min(Math.round(e.years || 1), Math.floor((k - k1) / 12) + 1); });
      let amt = s0 * Math.pow(1 + step, Math.max(0, yrs));
      ev.forEach(e => {
        const k1 = kOf(e.age);
        if (e.type === 'pause' && k >= k1 && k < k1 + (e.months || 0)) amt = 0;
        if (e.type === 'reduce' && k >= k1 && k < k1 + (e.months || 0)) amt = Math.min(amt, e.amount || 0);
        if (e.type === 'death' && k >= k1) amt *= e.keep; // share of SIP that continues
      });
      if (mods && mods.multFrom != null && k >= mods.multFrom) amt *= mods.mult;
      sip[k] = amt;
    }
    add[0] += sp.lumpsum || 0;
    ev.forEach(e => {
      const k1 = kOf(e.age); if (k1 < 0 || k1 > K) return;
      if (e.type === 'lump') add[k1] += e.amount || 0;
      if (e.type === 'withdraw') add[k1] -= e.amount || 0;
      if (e.type === 'death') add[k1] += e.payout || 0;
      if (e.type === 'fall') fall[k1] = Math.min(1, (e.pct || 0) / 100);
    });
    if (mods && mods.lumpAt != null && mods.lumpAt <= K) add[mods.lumpAt] += mods.lump;
    return { sip, add, fall, a0m, K };
  }

  // ---- Method A: month-by-month simulation ----
  // opts: { eq, s0, mods, goals (override), fromK, startBal }
  function simulate(child, fam, o) {
    const A = fam.a, me = mRate(o.eq), md = mRate(A.debt), W = Math.round(A.safeYears * 12);
    const L = liabilities(child, A, o.goals), F = flows(child, fam, o.eq, o.s0, o.mods);
    const fromK = o.fromK || 0, K = L.K;
    let eqB = 0, dB = 0, total = o.startBal || 0;
    const paidBy = {}, rows = [];
    L.list.forEach(l => { if (l.paid) paidBy[l.gid] = paidBy[l.gid] || { need: 0, paid: 0, label: l.label, ages: [] }; });
    let seedVal = 0, minCash = 0;
    for (let k = fromK; k <= K; k++) {
      const sip = F.sip[k], add = F.add[k] - (k === 0 && o.noLump ? (child.sip.lumpsum || 0) : 0);
      // a market fall hits the equity part of the money at the start of that month
      if (F.fall[k]) { const loss = eqB * F.fall[k]; eqB -= loss; total -= loss; }
      total += sip + add;
      if (total < 0) { minCash = Math.min(minCash, total); total = 0; }
      let target = 0;
      L.list.forEach(l => { const d = l.k - k; if (d >= 0 && d <= W) target += l.need / Math.pow(1 + md, d); });
      dB = Math.min(total, target); eqB = total - dB;
      let due = 0, paid = 0; const pays = [];
      L.list.forEach(l => {
        if (l.k !== k || !l.paid) return;
        const p = Math.max(0, Math.min(total, l.need));
        total -= p; due += l.need; paid += p;
        const r = paidBy[l.gid]; r.need += l.need; r.paid += p; r.ages.push(l.age);
        pays.push({ gid: l.gid, label: l.label, age: l.age, need: l.need, paid: p });
      });
      dB = Math.max(0, dB - paid); eqB = total - dB;
      if (eqB < 0) { dB += eqB; eqB = 0; }
      const row = { k, age: (F.a0m + k) / 12, sip, add, target, debtIn: dB, eqIn: eqB, due, paid, pays };
      if (k === K) { seedVal = total; row.close = total; row.eqEnd = eqB; row.dEnd = dB; rows.push(row); break; }
      eqB *= 1 + me; dB *= 1 + md; total = eqB + dB;
      row.close = total; row.eqEnd = eqB; row.dEnd = dB; rows.push(row);
    }
    const seedL = L.list.find(l => l.gid === 'seed');
    const goals = Object.entries(paidBy).map(([gid, r]) => ({ gid, label: r.label, ages: r.ages, need: r.need, paid: r.paid, frac: r.need > 0 ? r.paid / r.need : 1 }));
    const allPaid = goals.every(g => g.paid >= g.need - 0.5);
    const seedOk = !seedL || seedVal >= seedL.need - 0.5;
    return { rows, goals, seedVal, seedTarget: seedL ? seedL.need : 0, allPaid, seedOk, ok: allPaid && seedOk, L, F };
  }

  const bisect = (lo, hi, okFn, it = 60) => { for (let i = 0; i < it; i++) { const m = (lo + hi) / 2; okFn(m) ? (hi = m) : (lo = m); } return hi; };

  // required SIP, Method A (exact, then rounded up to the next ₹100)
  function requiredSipA(child, fam, eq) {
    const ok = s => simulate(child, fam, { eq, s0: s }).ok;
    if (ok(0)) return { exact: 0, rounded: 0 };
    if (!ok(5e7)) return { exact: NaN, rounded: NaN };
    const x = bisect(0, 5e7, ok);
    return { exact: x, rounded: Math.ceil(x / 100) * 100 };
  }
  // present value at month k0 of one liability, along the plan's own path:
  // the last `safeYears` before it at the debt rate, everything before that at the equity rate
  function pvOf(l, k0, eq, A) {
    const me = mRate(eq), md = mRate(A.debt), W = Math.round(A.safeYears * 12), d = l.k - k0;
    const dm = Math.min(W, d), em = Math.max(0, d - W);
    return { d, dm, em, pv: l.need / Math.pow(1 + md, dm) / Math.pow(1 + me, em), fD: Math.pow(1 + md, dm), fE: Math.pow(1 + me, em) };
  }
  // required SIP, Method B: (PV of all goals + seed - lump sum) / PV of ₹1 of first-year SIP (with step-ups)
  function requiredSipB(child, fam, eq) {
    const L = liabilities(child, fam.a), me = mRate(eq);
    const pvL = L.list.reduce((s, l) => s + pvOf(l, 0, eq, fam.a).pv, 0);
    const F = flows(child, fam, eq, 1, null);
    let pvS = 0; F.sip.forEach((g, k) => { pvS += g / Math.pow(1 + me, k); });

  }

  // valuation point: today's value + date (money already invested), else the start (lump sum)
  function valuation(child) {
    const a0m = Math.max(0, monthsBetween(child.dob, child.startDate)), K = child.seed.age * 12 - a0m;
    if (child.current && child.current.value > 0 && child.current.date) {
      const k0 = Math.max(0, Math.min(K, monthsBetween(child.startDate, child.current.date)));
      return { k0, value: child.current.value, date: child.current.date };
    }
    return { k0: 0, value: child.sip.lumpsum || 0, date: child.startDate };
  }
  // life cover needed (always at the low equity case): PV of remaining goals + seed - money already invested
  function coverB(child, fam) {
    const eq = fam.a.eqLow, V = valuation(child), L = liabilities(child, fam.a);
    const rows = L.list.filter(l => l.k >= V.k0).map(l => Object.assign({}, l, pvOf(l, V.k0, eq, fam.a)));
    const pv = rows.reduce((s, r) => s + r.pv, 0);
    return { need: Math.max(0, pv - V.value), pv, rows, V };
  }
  function coverA(child, fam) {
    const eq = fam.a.eqLow, V = valuation(child);
    const ok = x => simulate(child, fam, { eq, s0: 0, fromK: V.k0, startBal: V.value + x, noLump: true }).ok;
    if (ok(0)) return { need: 0 };
    return { need: bisect(0, 5e9, ok) };
  }

  // Life cover need month by month along the plan (low equity case, at the SIP actually used).
  // need(k) = value at k of every goal still to come - money the plan holds at the start of month k
  //           - (share of the SIP that continues after this parent's death) x value at k of the SIPs still to come
  function coverPath(child, fam, s0, endK) {
    const A = fam.a, eq = A.eqLow, me = mRate(eq), V = valuation(child), L = liabilities(child, A);
    const hasCur = !!(child.current && child.current.value > 0 && child.current.date);
    const sim = simulate(child, fam, hasCur ? { eq, s0, fromK: V.k0, startBal: V.value, noLump: true } : { eq, s0 });
    const K = L.K, sipArr = sim.F.sip;
    const pvSip = new Array(K + 2).fill(0);
    for (let k = K; k >= 0; k--) pvSip[k] = (sipArr[k] || 0) + pvSip[k + 1] / (1 + me);
    const earners = fam.parents.map((p, i) => ({ p, i })).filter(x => x.p.earns);
    const shareSum = earners.reduce((s, x) => s + (+x.p.share || 0), 0) || 1;
    const keep = fam.parents.map(p => !p.earns ? null : fam.coverMode === 'full' ? 0 : 1 - (+p.share || 0) / shareSum);
    const last = Math.min(K, endK == null ? K : endK), pts = [];
    for (let k = V.k0; k <= last; k++) {
      const corpus = k === V.k0 ? V.value : sim.rows[k - V.k0 - 1].close;
      const pv = L.list.filter(l => l.k >= k).reduce((s, l) => s + pvOf(l, k, eq, A).pv, 0);
      const all = Math.max(0, pv - corpus);
      pts.push({ k, age: (L.a0m + k) / 12, pv, corpus, pvSip: pvSip[k], all, per: keep.map(kp => kp == null ? null : Math.max(0, pv - corpus - kp * pvSip[k])) });
    }
    const peakOf = f => pts.reduce((b, x) => f(x) > f(b) ? x : b, pts[0]);
    const peakAll = peakOf(x => x.all);
    const peakPer = keep.map((kp, i) => kp == null ? null : peakOf(x => x.per[i]));
    return { pts, peakAll, peakPer, keep, now: pts[0], V };
  }
  // Method A check of a peak: the smallest claim, paid on that parent's death at that month, that keeps every goal funded
  function claimNeededA(child, fam, s0, pi, k, keep) {
    const age = (Math.max(0, monthsBetween(child.dob, child.startDate)) + k) / 12;
    const V = valuation(child), hasCur = !!(child.current && child.current.value > 0 && child.current.date);
    const ok = x => simulate(child, fam, Object.assign({ eq: fam.a.eqLow, s0, mods: { events: [{ type: 'death', age, keep, payout: x }] } }, hasCur ? { fromK: V.k0, startBal: V.value, noLump: true } : {})).ok;
    if (ok(0)) return 0;
    return bisect(0, 5e9, ok);
  }

  // per-parent cover, policy term, premium paying term
  function coverPlan(child, fam, chosenSip) {
    const B = coverB(child, fam), A = coverA(child, fam), V = B.V;
    const a0m = Math.max(0, monthsBetween(child.dob, child.startDate));
    const reqLow = requiredSipA(child, fam, fam.a.eqLow).rounded;
    const fullyFundedLow = chosenSip >= reqLow - 0.5;
    const L = liabilities(child, fam.a);
    const lastAge = L.list.length ? Math.max(...L.list.map(l => l.age)) : child.seed.age;
    const endAge = fullyFundedLow ? Math.min(child.sip.endAge, lastAge) : lastAge;
    const childAgeAtV = (a0m + V.k0) / 12;
    const term = Math.max(1, Math.ceil(endAge - childAgeAtV - 1e-9));
    const earners = fam.parents.filter(p => p.earns);
    const shareSum = earners.reduce((s, p) => s + (+p.share || 0), 0) || 1;
    const path = coverPath(child, fam, chosenSip, Math.round(endAge * 12) - a0m);
    const per = fam.parents.map((p, i) => {
      if (!p.earns) return null;
      const part = fam.coverMode === 'full' ? 1 : (+p.share || 0) / shareSum;
      const pk = path.peakPer[i], need = pk.per[i], needNow = path.now.per[i];
      const gap = Math.max(0, need - (+p.existing || 0));
      const sa = gap > 0 ? Math.ceil(gap / 500000) * 500000 : 0;
      const ageNow = p.dob ? monthsBetween(p.dob, V.date) / 12 : null;
      return { name: p.name, part, keep: path.keep[i], need, needNow, peakK: pk.k, peakAge: pk.age, existing: +p.existing || 0, gap, sa, ageNow, ageEnd: ageNow != null ? ageNow + term : null };
    });
    return { B, A, term, endAge, fullyFundedLow, reqLow, per, ppt: term, path };
  }

  // ---- What if: apply events, compare, and find ways to catch up ----
  function whatIf(child, fam, eq, s0, events, coverPer, noFix) {
    const a0m = Math.max(0, monthsBetween(child.dob, child.startDate));
    const kOf = age => Math.round(age * 12) - a0m;
    let goals = child.goals;
    const evs = [];
    events.forEach(e => {
      if (e.type === 'goal') { goals = goals.map(g => g.id === e.gid ? Object.assign({}, g, { cost: e.cost != null && e.cost !== '' ? +e.cost : g.cost, startAge: e.startAge != null && e.startAge !== '' ? +e.startAge : g.startAge, years: e.years != null && e.years !== '' ? +e.years : g.years }) : g); return; }
      if (e.type === 'death') {
        const pi = +e.parent || 0, p = fam.parents[pi] || {};
        const shareSum = fam.parents.filter(x => x.earns).reduce((s, x) => s + (+x.share || 0), 0) || 1;
        const part = p.earns ? (+p.share || 0) / shareSum : 0;
        const keep = fam.coverMode === 'full' ? 0 : 1 - part;
        const payout = e.payout != null && e.payout !== '' ? +e.payout : ((coverPer && coverPer[pi]) ? coverPer[pi].existing + coverPer[pi].sa : 0);
        evs.push(Object.assign({}, e, { keep, payout })); return;
      }
      evs.push(e);
    });
    const base = simulate(child, fam, { eq, s0 });
    const mods = { events: evs };
    const scen = simulate(child, fam, { eq, s0, mods, goals });
    // restart point: after the last pause / reduction, else the latest event
    let kR = 0;
    evs.forEach(e => { const k = kOf(e.age); kR = Math.max(kR, e.type === 'pause' || e.type === 'reduce' ? k + (e.months || 0) : k); });
    events.filter(e => e.type === 'goal').forEach(() => { kR = Math.max(kR, 0); });
    const K = scen.L.K; kR = Math.max(0, Math.min(K, kR));
    const fix = {};
    if (!scen.ok && !noFix) {
      const sipLeft = scen.F.sip.slice(kR).some(v => v > 0);
      if (sipLeft) {
        const okM = m => simulate(child, fam, { eq, s0, mods: Object.assign({}, mods, { multFrom: kR, mult: m }), goals }).ok;
        if (okM(20)) { const m = bisect(1, 20, okM); fix.raise = { pct: (m - 1) * 100, from: kR, sipThen: scen.F.sip[kR] * m, sipBefore: scen.F.sip[kR] }; }
      }
      for (let ea = child.sip.endAge + 1; ea <= child.seed.age; ea++) {
        if (simulate(child, fam, { eq, s0, mods: Object.assign({}, mods, { endAge: ea }), goals }).ok) { fix.extend = { endAge: ea, mandate: ea > 18 }; break; }
      }
      const okL = x => simulate(child, fam, { eq, s0, mods: Object.assign({}, mods, { lumpAt: kR, lump: x }), goals }).ok;
      if (okL(5e9)) fix.lump = { amount: Math.ceil(bisect(0, 5e9, okL) / 1000) * 1000, at: kR };
    }
    return { base, scen, kR, restartAge: (a0m + kR) / 12, fix, goalsUsed: goals };
  }

  return { defaultFamily, defaultChild, GOALS, monthsBetween, mRate, productOf, liabilities, flows, simulate, requiredSipA, requiredSipB, pvOf, coverA, coverB, coverPath, claimNeededA, coverPlan, valuation, whatIf };
})();
if (typeof module !== 'undefined') module.exports = MT2;
</script>
<script>// ===== Excel cross-check builder: every number recomputed with live formulas =====
// Uses xlsx-js-style (SheetJS + cell styles): Indian number format, Calibri 10, neat bordered tables.
function buildCheckWorkbook(XLSX, child, fam, eq, s0, tool) {
  const A = fam.a, L = MT2.liabilities(child, A), a0m = L.a0m, K = L.K;
  const wb = XLSX.utils.book_new();
  // ---- formats & styles ----
  const INR = '[>=10000000]##\\,##\\,##\\,##0;[>=100000]##\\,##\\,##0;##,##0';
  const FMT = { inr: INR, int: '0', p: '0.0#', fac: '0.0000', rate: '0.0000%', txt: '@' };
  const line = { style: 'thin', color: { rgb: 'DFE6EA' } };
  const base = { font: { name: 'Calibri', sz: 10, color: { rgb: '39293E' } }, border: { top: line, bottom: line, left: line, right: line }, alignment: { vertical: 'center' } };
  const S = {
    head: { font: { name: 'Calibri', sz: 10, bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '005826' } }, border: base.border, alignment: { vertical: 'center', horizontal: 'center', wrapText: true } },
    title: { font: { name: 'Calibri', sz: 12, bold: true, color: { rgb: '005826' } } },
    note: { font: { name: 'Calibri', sz: 9, italic: true, color: { rgb: '6B6472' } }, alignment: { wrapText: true, vertical: 'top' } },
    tot: { fill: { fgColor: { rgb: 'F3F8F5' } }, font: { name: 'Calibri', sz: 10, bold: true, color: { rgb: '39293E' } } },
    input: { fill: { fgColor: { rgb: 'FFF6DC' } } }
  };
  const put = (ws, ref, v, fmt, extra) => {
    const cell = typeof v === 'object' && v !== null ? v : { t: typeof v === 'number' ? 'n' : 's', v };
    const st = JSON.parse(JSON.stringify(base));

    if (extra) Object.keys(extra).forEach(k => { st[k] = Object.assign({}, st[k] || {}, extra[k]); });
    cell.s = st; ws[ref] = cell;
  };
  const head = (ws, r, arr) => arr.forEach((h, i) => { const ref = XLSX.utils.encode_cell({ r, c: i }); ws[ref] = { t: 's', v: h, s: S.head }; });
  const text = (ws, ref, v, st) => { ws[ref] = { t: 's', v, s: st }; };
  const F = f => ({ t: 'n', f });
  const FS = f => ({ t: 's', f });
  const fin = (ws, ref, cols, hRow, rows) => { ws['!ref'] = ref; ws['!cols'] = cols.map(w => ({ wch: w })); if (hRow != null) ws['!rows'] = Object.assign([], { [hRow]: { hpt: rows || 30 } }); };

  // --- Inputs ---
  const inRows = [
    ['Child age at SIP start (months)', a0m, 'int'], ['Golden Seed age (years)', child.seed.age, 'int'], ['Equity return % (this case)', eq, 'p'],
    ['Debt return %', A.debt, 'p'], ['Years before each goal moved to debt', A.safeYears, 'p'],
    ['Monthly equity rate', F('(1+B4/100)^(1/12)-1'), 'rate'], ['Monthly debt rate', F('(1+B5/100)^(1/12)-1'), 'rate'], ['Debt window (months)', F('B6*12'), 'int'],
    ['First-year monthly SIP (₹) - edit to test', s0, 'inr', true], ['Step-up % a year (0 = fixed)', child.sip.type === 'stepup' ? child.sip.stepUp : 0, 'p'],
    ['SIP continues till age', child.sip.endAge, 'int'], ['Lump sum at start (₹)', child.sip.lumpsum || 0, 'inr'], ['General inflation % (Golden Seed)', A.infl, 'p'],
    ['Last month (k) = Golden Seed month', F('B3*12-B2'), 'int'], ['Equity return % for life cover (low case)', A.eqLow, 'p'], ['Monthly equity rate, cover case', F('(1+B16/100)^(1/12)-1'), 'rate']

  fin(wsI, 'A1:D' + (inRows.length + 1), [40, 14, 2, 90]);
  // --- Goals (liabilities) ---

    put(wsG, 'H' + r, F(`MIN(Inputs!$B$9,E${r})`), 'int'); put(wsG, 'I' + r, F(`MAX(0,E${r}-Inputs!$B$9)`), 'int');

  head(wsS, 0, sh);
  const gE = `Goals!$E$2:$E$${gN}`, gF = `Goals!$F$2:$F$${gN}`, gG = `Goals!$G$2:$G$${gN}`;
  for (let k = 0; k <= K; k++) {

    put(wsS, 'D' + r, F(`IF(Inputs!$B$2+A${r}<Inputs!$B$12*12,(1+Inputs!$B$11/100)^INT(A${r}/12),0)`), 'fac');

    put(wsS, 'F' + r, k === 0 ? F('Inputs!$B$13') : 0, 'inr'); put(wsS, 'G' + r, k === 0 ? 0 : F(`O${r - 1}`), 'inr');

    put(wsS, 'I' + r, F(`SUMPRODUCT((${gE}-A${r}>=0)*(${gE}-A${r}<=Inputs!$B$9)*${gF}/(1+Inputs!$B$8)^(${gE}-A${r}))`), 'inr');
    put(wsS, 'J' + r, F(`MIN(H${r},I${r})`), 'inr'); put(wsS, 'K' + r, F(`SUMPRODUCT((${gE}=A${r})*${gG}*${gF})`), 'inr');
    put(wsS, 'L' + r, F(`MIN(H${r},K${r})`), 'inr'); put(wsS, 'M' + r, F(`MAX(0,J${r}-L${r})`), 'inr'); put(wsS, 'N' + r, F(`H${r}-L${r}-M${r}`), 'inr');
    put(wsS, 'O' + r, k === K ? F(`H${r}-L${r}`) : F(`N${r}*(1+Inputs!$B$7)+M${r}*(1+Inputs!$B$8)`), 'inr');
  }
  const sN = K + 2;
  fin(wsS, 'A1:O' + sN, [8, 9, 11, 10, 10, 11, 13, 13, 13, 13, 12, 12, 13, 14, 14], 0, 30);

  const vh = ['Month k', 'Child age', 'Value then of goals still to come (₹)', 'Money held at start of month (₹)', 'Value then of SIPs still to come (₹)', 'Cover needed if the SIP stops (₹)'].concat(keeps.map(x => `Cover needed: ${x.name} (other parent keeps ${Math.round(x.keep * 100)}% of SIP) (₹)`));

  const W = 'Inputs!$B$9', sA = `'Month by month'!$A$2:$A$${sN}`, sC = `'Month by month'!$C$2:$C$${sN}`;

    put(wsV, 'F' + r, F(`MAX(0,C${r}-D${r})`), 'inr');

  }

    null,
    ['Life cover', null, null, 'sec'],
    ['Life cover needed at the start (cover case = low equity return)', F(`Goals!K${gT}-Inputs!B13`), tool.coverStart, 'inr'],
    ['Life cover to buy = highest need in any month, if the SIP stops', F(`MAX('Cover by age'!F2:F${vN})`), coverOk ? tool.coverPeak : 'Download the ' + A.eqLow + '% case', coverOk ? 'inr' : 'txt'],
  ];
  cRows.forEach((r, i) => {
    const R = i + 2;
    if (!r) return;
    if (r[3] === 'sec') { text(wsC, 'A' + R, r[0], S.title); return; }

<script>// ===== Money Tree advisor view: UI =====

  const num = n => Math.round(n).toLocaleString('en-IN');

  const dmy = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
  const isoOf = s => { const m = String(s || '').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); if (!m) return null; const d = +m[1], mo = +m[2], y = +m[3]; const dt = new Date(y, mo - 1, d); if (dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null; return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`; };
  const parseAmt = s => { const v = parseFloat(String(s).replace(/[₹,\s]/g, '')); return isFinite(v) ? v : 0; };
  const ageTxt = months => `${Math.floor(months / 12)}y ${months % 12}m`;

  const xn = (txt, html, hov) => { XP.push(html); return `<span class="xn${hov ? ' hv' : ''}" data-x="${XP.length - 1}" tabindex="0">${txt}</span>`; };
  const tbl = rows => `<table class="pt2">${rows.map(r => `<tr class="${r[2] || ''}"><td>${r[0]}</td><td class="n">${r[1]}</td></tr>`).join('')}</table>`;
  const pop = document.createElement('div'); pop.className = 'pop'; pop.hidden = true; document.body.appendChild(pop);
  let popFor = null, popHover = false;
  function showPop(el, hover) {
    const h = XP[+el.dataset.x]; if (h == null) return;
    pop.innerHTML = h + (hover ? '' : '<button class="pop-x" title="Close">✕</button>');
    pop.hidden = false; popFor = el; popHover = hover;
    const r = el.getBoundingClientRect(), w = pop.offsetWidth, hh = pop.offsetHeight;
    const x = Math.min(window.innerWidth - w - 8, Math.max(8, r.left));
    let y = r.bottom + 6; if (y + hh > window.innerHeight - 8) y = Math.max(8, r.top - hh - 6);
    pop.style.left = x + 'px'; pop.style.top = y + 'px';
  }
  function hidePop() { pop.hidden = true; popFor = null; }
  document.addEventListener('click', e => {
    const el = e.target.closest('.xn');
    if (el) { if (popFor === el && !popHover) hidePop(); else showPop(el, false); return; }
    if (!e.target.closest('.pop') || e.target.closest('.pop-x')) hidePop();
  });
  document.addEventListener('mouseover', e => { const el = e.target.closest('.xn.hv'); if (el && (pop.hidden || popHover)) showPop(el, true); });
  document.addEventListener('mouseout', e => { const el = e.target.closest('.xn.hv'); if (el && popHover && !el.contains(e.relatedTarget)) hidePop(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePop(); if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('xn')) showPop(e.target, false); });
  window.addEventListener('scroll', () => { if (!pop.hidden) hidePop(); }, true);
  window.addEventListener('resize', () => { if (!pop.hidden) hidePop(); });

      <li>Monthly rate = (1 + yearly rate)^(1/12) − 1, so ${eq}% is exactly ${eq}% a year (not ${eq}% ÷ 12).</li></ul>
      <div class="seg"><span>Working shown for</span><button class="sg ${cs === 'low' ? 'on' : ''}" data-xcase="low">Equity ${A.eqLow}%</button><button class="sg ${cs === 'high' ? 'on' : ''}" data-xcase="high">Equity ${A.eqHigh}%</button></div>
      <table class="rt sm"><tr><th>Payment</th><th>Age</th><th class="n">Month k</th><th class="n">Cost today</th><th class="n">Infl.</th><th class="n">Cost then</th><th class="n">Months in debt</th><th class="n">Months in equity</th><th class="n">Value today</th></tr>${rows}
      <tr class="tot"><td colspan="8">Total value today of all payments</td><td class="n">${inr(B.pvL)}</td></tr>
      <tr class="tot"><td colspan="8">Value today of ₹1 of first-year SIP (sum of each month's SIP factor ÷ (1 + equity monthly)^k)</td><td class="n">${B.pvS.toFixed(4)}</td></tr>
      <tr class="tot"><td colspan="8">Required SIP = (${inr(B.pvL)} − ${inr(c.sip.lumpsum || 0)}) ÷ ${B.pvS.toFixed(4)}</td><td class="n">${inr(B.exact)}</td></tr></table>
      <h4>Year by year at ${inr(s0)}/month, equity ${eq}%</h4>
      <div class="scroll"><table class="rt sm"><tr><th>Age</th><th class="n">SIP paid in</th><th class="n">Lump sum / withdrawal</th><th class="n">Goals paid</th><th class="n">In equity*</th><th class="n">In debt*</th><th class="n">Total at year end</th></tr>${yrows}</table></div>
      <div class="hint">*At the end of each year of age: in equity + in debt = total. Hover over <b>Goals paid</b> to see which goals; click any number for its working.</div>
      <div class="xrow"><div>The Excel file recomputes every number above with live formulas (Check → Inputs → Goals → Month by month → Cover by age). Change the SIP or the equity return in Inputs and it recalculates.</div><button class="btn" id="xlBtn">⬇ Excel check (${eq}% case)</button></div></section>`;
  }

  // ---------- events ----------
  function setPath(path, val) {
    const parts = path.split('.'); let o = parts[0] === 'fam' ? fam : child();
    for (let i = 1; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = val;
  }
  let tmr = null; const later = (fn, ms = 250) => { clearTimeout(tmr); tmr = setTimeout(fn, ms); };
  const STRUCT = /(dob|startDate|product|perYear|earns|\.on$|sip\.type|sip\.mode|caseSel|coverMode|endAge|eqLow|eqHigh|infl$)/;
  function onInput(e) {
    const el = e.target; if (!el.dataset || !el.dataset.p) return;
    const k = el.dataset.kind, p = el.dataset.p;
    let v;
    if (k === 'bool') v = el.checked;
    else if (k === 'boolsel') v = el.value === '1';
    else if (k === 'text') v = el.value;
    else if (k === 'date') { v = isoOf(el.value); el.classList.toggle('bad', !v && el.value.trim() !== '' && (e.type === 'change' || el.value.replace(/\D/g, '').length === 8)); if (!v) { if (el.value.trim() === '' && (p.startsWith('fam.parents') || p === 'c.current.date')) v = ''; else return; } }
    else if (k === 'amt') v = el.value.trim() === '' && /whatIf/.test(p) ? '' : parseAmt(el.value);
    else { if (el.value.trim() === '' && /whatIf/.test(p)) v = ''; else { v = parseFloat(el.value); if (!isFinite(v)) return; } }
    if (p.startsWith('c.')) setPath(p.replace(/^c\./, 'c.'), v); else setPath(p, v);
    if (p === 'c.sip.amount' || p === 'c.sip.mode') { /* nothing extra */ }
    save();
    if (e.type === 'change' && (k === 'bool' || k === 'boolsel' || k === 'date' || STRUCT.test(p))) { renderInputs(); results(); }
    else later(results);
  }
  // ---- date mask: type 27011998 -> 27/01/1998 (slashes added automatically) ----
  const fmtDate = d => { d = d.slice(0, 8); return d.length > 4 ? `${d.slice(0, 2)}/${d.slice(2, 4)}/${d.slice(4)}` : d.length > 2 ? `${d.slice(0, 2)}/${d.slice(2)}` : d; };
  function maskDate(el, e) {
    const pos = el.selectionStart == null ? el.value.length : el.selectionStart;
    let digits = el.value.replace(/\D/g, ''), before = el.value.slice(0, pos).replace(/\D/g, '').length;
    // backspace on a "/" also removes the digit before it
    if (e.inputType === 'deleteContentBackward' && digits === el.dataset.prev && before > 0) { digits = digits.slice(0, before - 1) + digits.slice(before); before--; }
    digits = digits.slice(0, 8);
    const out = fmtDate(digits);
    let caret = 0, seen = 0; while (caret < out.length && seen < Math.min(before, digits.length)) { if (/\d/.test(out[caret])) seen++; caret++; }
    el.value = out; el.dataset.prev = digits;
    try { el.setSelectionRange(caret, caret); } catch (_) { }
  }
  document.addEventListener('focusin', e => { const el = e.target; if (el.dataset && el.dataset.kind === 'date') el.dataset.prev = el.value.replace(/\D/g, ''); });
  document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.kind === 'date') maskDate(e.target, e); }, true);
  document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.kind && e.target.dataset.kind !== 'bool' && e.target.tagName !== 'SELECT') onInput(e); });
  document.addEventListener('change', onInput);
  document.addEventListener('focusout', e => { const el = e.target; if (el.classList && el.classList.contains('amt') && el.value.trim() !== '') el.value = num(parseAmt(el.value)); });
  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.set) { setPath(t.dataset.set, t.dataset.val === '' ? null : t.dataset.val); if (t.dataset.set === 'c.sip.mode' && t.dataset.val === 'custom' && !child().sip.amount) child().sip.amount = chosenSip(Object.assign({}, child(), { sip: Object.assign({}, child().sip, { mode: 'required' }) })); save(); renderInputs(); results(); return; }
    if (t.dataset.child) { ci = +t.dataset.child; window.__xcase = null; renderInputs(); results(); return; }
    if (t.id === 'addChild') { const c0 = child(); const d0 = new Date(), td = `${d0.getFullYear()}-${String(d0.getMonth() + 1).padStart(2, '0')}-${String(d0.getDate()).padStart(2, '0')}`; const n = MT2.defaultChild(td, td); fam.children.push(n); ci = fam.children.length - 1; void c0; save(); renderInputs(); results(); return; }
    if (t.id === 'delChild') { if (fam.children.length > 1 && confirm('Remove this child from the family?')) { fam.children.splice(ci, 1); ci = 0; save(); renderInputs(); results(); } return; }
    if (t.id === 'addGoal') { child().goals.push({ id: 'g' + Date.now().toString(36), label: 'New goal', on: true, cost: 500000, perYear: false, startAge: 20, years: 1, infl: 7, custom: true }); save(); renderInputs(); results(); return; }
    if (t.dataset.delgoal) { child().goals.splice(+t.dataset.delgoal, 1); save(); renderInputs(); results(); return; }
    if (t.id === 'plantGoals') { const c = child(); c.goals = MT2.GOALS().map(g => Object.assign(g, { on: !!g.edu })); c.seed.on = false; save(); renderInputs(); results(); return; }
    if (t.id === 'treeGoals') { const c = child(); c.goals = MT2.GOALS(); c.seed.on = true; save(); renderInputs(); results(); return; }
    if (t.dataset.addwi) { const c = child(), a0 = Math.ceil(Math.max(0, MT2.monthsBetween(c.dob, c.startDate)) / 12), ty = t.dataset.addwi;
      const d = { pause: { age: Math.max(a0, 8), months: 12 }, reduce: { age: Math.max(a0, 8), months: 24, amount: 10000 }, skipStep: { age: Math.max(a0, 6), years: 3 }, fall: { age: Math.max(a0, 12), pct: 30 }, lump: { age: Math.max(a0, 3), amount: 200000 }, withdraw: { age: Math.max(a0, 10), amount: 500000 }, goal: { gid: (c.goals[2] || c.goals[0]).id, cost: '', startAge: '', years: '' }, death: { parent: 0, age: Math.max(a0, 5), payout: '' } }[ty];
      c.whatIf.push(Object.assign({ type: ty }, d)); save(); results(); return; }
    if (t.dataset.delwi) { child().whatIf.splice(+t.dataset.delwi, 1); save(); results(); return; }
    if (t.dataset.xcase) { window.__xcase = t.dataset.xcase; results(); return; }
    if (t.id === 'xlBtn') { excel(); return; }
    if (t.id === 'propBtn') { proposalPdf(); return; }
    if (t.id === 'newFam') { if (confirm('Start a new family? The current one stays saved in this browser.')) { save(); fam = MT2.defaultFamily(); ci = 0; save(); refreshFamList(); renderInputs(); results(); } return; }
    if (t.id === 'expFam') { const b = new Blob([JSON.stringify(fam, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `MoneyTree_${(fam.name || 'family').replace(/\W+/g, '_')}.json`; a.click(); return; }
    if (t.id === 'impFam') { $('impFile').click(); return; }
  });
  $('impFile').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; try { const j = JSON.parse(await f.text()); if (!j.children || !j.parents) throw 0; fam = j; ci = 0; save(); refreshFamList(); renderInputs(); results(); } catch (_) { alert('That file is not a Money Tree family file.'); } e.target.value = ''; });
  $('famName').addEventListener('input', e => { fam.name = e.target.value; save(); later(refreshFamList, 400); });
  $('famList').addEventListener('change', e => { const id = e.target.value; if (store.families[id]) { save(); fam = store.families[id]; ci = 0; save(); renderInputs(); results(); } });
  function refreshFamList() { const ids = Object.keys(store.families); $('famList').innerHTML = ids.map(id => `<option value="${id}" ${id === fam.id ? 'selected' : ''}>${esc(store.families[id].name || 'Unnamed family')} (${store.families[id].children.length})</option>`).join(''); }

  function excel() {
    if (!window.XLSX) { alert('The Excel library did not load (needs internet).'); return; }
    const c = child(), cs = window.__xcase || c.caseSel, eq = cs === 'low' ? fam.a.eqLow : fam.a.eqHigh;
    const s0 = window.__last.s0, B = MT2.requiredSipB(c, fam, eq), rq = MT2.requiredSipA(c, fam, eq);
    const sim = MT2.simulate(c, fam, { eq, s0 });
    const c0 = Object.assign({}, c, { current: { value: 0, date: '' } });
    const cov0 = MT2.coverB(c0, fam).need, cpl = window.__last.cp;
    const coverEndK = Math.round(cpl.endAge * 12) - Math.max(0, MT2.monthsBetween(c.dob, c.startDate));
    const coverPeak = MT2.coverPath(c0, fam, s0, coverEndK).peakAll.all;
    const tool = { coverPeak, coverEndK, pvL: B.pvL, pvS: B.pvS, reqB: B.exact, reqRounded: rq.rounded, due: sim.goals.reduce((s, g) => s + g.need, 0), paid: sim.goals.reduce((s, g) => s + g.paid, 0), seedVal: sim.seedVal, seedTarget: sim.seedTarget, ok: sim.ok, coverStart: cov0 };
    const wb = buildCheckWorkbook(XLSX, c, fam, eq, s0, tool);
    XLSX.writeFile(wb, `MoneyTree_check_${(c.name || 'child').replace(/\W+/g, '_')}_${eq}pc.xlsx`);
  }

  save(); refreshFamList(); renderInputs(); results();
})();
</script>
