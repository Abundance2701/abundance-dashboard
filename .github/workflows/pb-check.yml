name: Profit-booking alerts
# Manual run only. The regular schedule moved to cron-job.org on 06/11/2026 ("Abundance alerts":
# every 15 min 08:00–16:45 IST Mon–Fri, 09:10 IST Sat–Sun) because GitHub's scheduler ran hours late or
# skipped runs. Use "Run workflow" here to check the alert rules at once. All logic and secrets live in
# Vercel (api/pb-check); the reply holds counts only, never client names.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s -m 60 "https://abundance-dashboard-beta.vercel.app/api/pb-check" ; echo
