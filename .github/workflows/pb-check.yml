name: Profit-booking alerts
# The main schedule is cron-job.org ("Abundance alerts", Mon–Fri, job time zone
# Asia/Kolkata; 8:15, 2:45, 2:50, 3:45, 3:50 IST). This workflow is a BACKUP: it runs the check twice on weekdays (about 8:37 AM and 3:52 PM IST;
# GitHub may run it late) so alerts still go out, if late, when cron-job.org stops or is misconfigured.
# Alerts are never sent twice (api/pb-check remembers what it sent). The job fails (and GitHub emails the repo
# owner) when the check answers with an error. "Run workflow" runs it at once. The reply holds counts only.
on:
  schedule:
    - cron: '7 3 * * 1-5'
    - cron: '22 10 * * 1-5'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -m 90 -o out.json -w '%{http_code}' "https://abundance-dashboard-beta.vercel.app/api/pb-check?backup=1&t=$(date +%s)"); cat out.json; echo
          [ "$code" = "200" ] || { echo "pb-check answered HTTP $code"; exit 1; }
