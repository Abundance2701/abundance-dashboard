name: Profit-booking alerts
# Every 15 minutes in market hours (and once a day on weekends for date reminders), ask the
# dashboard to check the profit-booking rules. All logic and secrets live in Vercel (api/pb-check);
# this job only knocks on the door, and the reply holds counts only, never client names.
on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'   # 08:30–16:15 IST, Mon–Fri
    - cron: '40 3 * * 0,6'        # 09:10 IST, Sat–Sun
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s -m 60 "https://abundance-dashboard-beta.vercel.app/api/pb-check" ; echo
