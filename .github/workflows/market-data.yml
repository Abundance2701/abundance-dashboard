name: Market data
on:
  schedule:
    - cron: '50 2 * * 1-6'    # 08:20 IST, before the morning read
    - cron: '20 10 * * 1-5'   # 15:50 IST, after the close
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: market-data, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/market_data.py && python scripts/build_pulse.py
      - name: Commit if changed
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/indices.json data/official.json market-pulse.json archive
          git diff --cached --quiet && echo "no change" || (git commit -m "Market data $(date -u +%F)" && git push)
