  let gname = null, mode = 'sip', ov = {}, rov = {};
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fld = (id, l, v, money) => `<label for="${id}">${l}<input id="${id}" ${money ? `type="text" inputmode="decimal" class="money" data-raw="${v}" value="${FP.inrx(v)}"` : `type="number" step="any" value="${+(+v).toFixed(4)}"`}></label>`;
  const verdict = (got, want) => { const d = got - want, p = want ? Math.abs(d) / want : 0; return `<span class="${p < .005 ? 'ok' : 'no'}">${p < .005 ? '✓ Matches' : '✗ Does not match'}</span> · difference ${FP.inrx(d)} (${FP.pct(p, 2)})`; };

  /* Goal: grow the investment one month at a time */
  const simGoal = (v, md) => {
    const i = Math.pow(1 + v.r / 100, 1 / 12) - 1; let bal = md === 'lump' ? v.amt : 0, cost = v.cost; const rows = [];
    for (let m = 0; m < v.n; m++) {
      const y = Math.floor(m / 12), sip = m >= (v.k ?? v.n) ? 0 : md === 'sip' ? v.amt : md === 'step' ? v.amt * Math.pow(1 + v.g / 100, y) : 0;
      const row = rows[y] = rows[y] || { y: y + 1, sip, open: bal, inv: 0, gr: 0 };
      bal += sip; row.inv += sip; const g = bal * i; bal += g; row.gr += g; row.close = bal; cost *= Math.pow(1 + v.infl / 100, 1 / 12);
    }
    return { bal, rows, cost };
  };
  /* Retirement: withdraw at the start of each month, expense rising with inflation, rest of corpus grows */
  const simRet = v => {
    const i = Math.pow(1 + v.r / 100, 1 / 12) - 1, f = Math.pow(1 + v.infl / 100, 1 / 12); let bal = v.corpus, w = v.need, out = null; const rows = [];
    for (let m = 0; m < v.N; m++) {
      const y = Math.floor(m / 12), row = rows[y] = rows[y] || { y: v.start + y, age: v.age != null ? v.age + y : '—', open: bal, wd: 0, gr: 0 };
      bal -= w; row.wd += w; if (bal < -1 && out == null) out = m; const g = Math.max(bal, 0) * i; bal += g; row.gr += g; row.close = bal; w *= f;
    }
    return { bal, rows, out };
  };

  FP.renderVerify = () => {
    const box = $('#verify'); if (!box) return;
    const goals = FP.calc.goals(FP.d, FP.st).filter(g => g.on && !g.due);
    if (!goals.length) { box.innerHTML = '<p class="hint">No future goals to check.</p>'; return; }
    if (!goals.find(g => g.name === gname)) { gname = goals[0].name; ov = {}; }
    const g = goals.find(x => x.name === gname), R = goals.find(x => x.ret);
    const toolAmt = { sip: g.sip, step: g.step, lump: g.lump }[mode];
    const v = { cost: g.amt, infl: g.infl * 100, n: g.n, k: g.k ?? g.n, r: g.r * 100, g: FP.rate('stepUp') * 100, amt: toolAmt, ...ov };
    const isFixed = g.ret || g.members; // target is a corpus, not today's cost × inflation
    box.innerHTML = `<p class="hint">These checks grow the money one month at a time, the way a bank statement would, instead of using PMT/PV. If the tool's formulas are right, the result lands on the goal. Change any input to test your own numbers; the plan itself is not affected.</p>
      <h3 style="margin-top:14px">Goal check</h3>
      <div class="vf"><label for="vfGoal">Goal<select id="vfGoal">${goals.map(x => `<option${x.name === gname ? ' selected' : ''}>${FP.esc(x.name)}</option>`).join('')}</select></label>
        <label>Method<span class="segbtn">${[['sip', 'SIP'], ['step', 'Step-up SIP'], ['lump', 'Lumpsum']].map(([k, l]) => `<button data-md="${k}" aria-pressed="${k === mode}">${l}</button>`).join('')}</span></label></div>
      <div class="vf">${isFixed ? '' : fld('vf_cost', "Today's cost", v.cost, 1) + fld('vf_infl', 'Inflation %', v.infl)}${fld('vf_n', 'Months', v.n)}${fld('vf_r', 'Return % a year', v.r)}${mode === 'step' ? fld('vf_g', 'Step-up % a year', v.g) : ''}${fld('vf_amt', mode === 'lump' ? 'Lumpsum invested today' : mode === 'step' ? 'First-year SIP / month' : 'SIP / month', v.amt, 1)}</div>
      <div id="vfOut"></div>
      ${R ? `<h3 style="margin-top:22px">Retirement corpus check</h3><p class="hint">Starts with the corpus, takes out each month's expense at the start of the month, raises the expense with inflation every month, and grows what's left.</p>
        <div class="vf">${fld('vr_corpus', 'Corpus at retirement', rov.corpus ?? R.fv, 1)}${fld('vr_need', 'Monthly need at retirement', rov.need ?? R.ret.mAt, 1)}${fld('vr_infl', 'Inflation %', rov.infl ?? FP.rate('infl') * 100)}${fld('vr_r', 'Return % after retirement', rov.r ?? FP.rate('rPost') * 100)}${fld('vr_N', 'Months in retirement', rov.N ?? R.ret.N)}</div><div id="vrOut"></div>` : ''}`;
    const out = () => {
      const vv = { ...v, ...ov }, s = simGoal(vv, mode), want = isFixed ? g.fv : s.cost, i = `(1+${+vv.r.toFixed(4)}%)^(1/12)-1`;
      $('#vfOut').innerHTML = `<p>After ${vv.n} months the investment grows to <b>${FP.inrx(s.bal)}</b>. The goal needs <b>${FP.inrx(want)}</b>${isFixed ? '' : ` (today's cost grown month by month at ${+vv.infl.toFixed(2)}%)`}. ${verdict(s.bal, want)}</p>
        <div class="xl">Same check in Excel:
Future cost   = ${isFixed ? FP.inrx(want).replace(/[₹,]/g, '') + '  (taken from the tool)' : `${Math.round(vv.cost)}*(1+${+vv.infl.toFixed(4)}%)^(${vv.n}/12)`}
SIP           = ${vv.k < vv.n ? `PMT(${i}, ${vv.k}, 0, -${Math.round(want)}/(1+${i})^(${vv.n}-${vv.k}), 1)   SIP stops at retirement after ${vv.k} months` : `PMT(${i}, ${vv.n}, 0, -${Math.round(want)}, 1)`}
Lumpsum today = PV(${i}, ${vv.n}, 0, -${Math.round(want)})
Step-up SIP   = no single Excel function; build the table below in Excel and Goal Seek the first-year SIP</div>
        <div class="tbl scrolly"><table><thead><tr><th>Year</th><th class="n">SIP / month</th><th class="n">Opening</th><th class="n">Invested</th><th class="n">Growth</th><th class="n">Closing</th></tr></thead><tbody>
        ${s.rows.map(r => `<tr><td>${r.y}</td><td class="n">${FP.inrx(r.sip)}</td><td class="n">${FP.inrx(r.open)}</td><td class="n">${FP.inrx(r.inv)}</td><td class="n">${FP.inrx(r.gr)}</td><td class="n">${FP.inrx(r.close)}</td></tr>`).join('')}</tbody></table></div>`;
    };
    const rout = () => {
      if (!R) return; const rv = { corpus: R.fv, need: R.ret.mAt, infl: FP.rate('infl') * 100, r: FP.rate('rPost') * 100, N: R.ret.N, ...rov, start: R.year, age: R.ret.age }, s = simRet(rv);
      const endTxt = s.out != null ? `<span class="no">Money runs out in ${MON[(R.mon - 1 + s.out) % 12]} ${R.year + Math.floor((R.mon - 1 + s.out) / 12)}</span>, before the plan's end.` : s.bal > rv.need ? `<span class="ok">Lasts the full ${rv.N / 12} years</span>, with ${FP.inrx(s.bal)} left at the end.` : `<span class="ok">✓ Lasts exactly the full ${rv.N / 12} years</span> and ends at about ₹0 (${FP.inrx(s.bal)}).`;
      $('#vrOut').innerHTML = `<p>${endTxt}</p><div class="xl">Same corpus in Excel:
Corpus = PV(((1+${+rv.r.toFixed(4)}%)/(1+${+rv.infl.toFixed(4)}%))^(1/12)-1, ${rv.N}, -${Math.round(rv.need)}, 0, 1)</div>
        <div class="tbl scrolly"><table><thead><tr><th>Year</th><th>Age</th><th class="n">Opening</th><th class="n">Taken out</th><th class="n">Growth</th><th class="n">Closing</th></tr></thead><tbody>
        ${s.rows.map(r => `<tr><td>${r.y}</td><td>${r.age}</td><td class="n">${FP.inrx(r.open)}</td><td class="n">${FP.inrx(r.wd)}</td><td class="n">${FP.inrx(r.gr)}</td><td class="n" style="${r.close < 0 ? 'color:var(--bad)' : ''}">${FP.inrx(r.close)}</td></tr>`).join('')}</tbody></table></div>`;
    };
    out(); rout();
    $('#vfGoal').onchange = e => { gname = e.target.value; ov = {}; FP.renderVerify(); };
    box.querySelectorAll('[data-md]').forEach(b => b.onclick = () => { mode = b.dataset.md; delete ov.amt; FP.renderVerify(); });
    box.querySelectorAll('[id^="vf_"]').forEach(x => x.onchange = () => { ov[x.id.slice(3)] = FP.num(x.value); out(); });
    box.querySelectorAll('[id^="vr_"]').forEach(x => x.onchange = () => { rov[x.id.slice(3)] = FP.num(x.value); rout(); });
  };
})();

</script>
<script data-src="goal-modal.js">
/* Goal editor pop-up: open from any goal name, add new goals, live PV / FV preview. Edits go into Client data → Goals. */
(() => {
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  let dr = null, sure = false;
  const clone = o => JSON.parse(JSON.stringify(o));
  const inflDef = t => t === 'education' ? FP.rate('inflEdu') : t === 'marriage' ? FP.rate('inflMarriage') : t === 'emergency' ? 0 : FP.rate('infl');
  /* run the real calculation on a draft copy, without saving anything */
  const withSt = (tmp, fn) => { const keep = FP.st; FP.st = tmp; try { return fn(); } finally { FP.st = keep; } };

  FP.openGoal = name => {
    if (!name) return;
    const find = comb => withSt({ ...FP.st, combineGrad: comb }, () => FP.calc.goals(FP.d, FP.st)).find(x => x.name === name);
    const g = find(FP.st.combineGrad) || find(false); if (!g) return;
    sure = false;
    if (g.type === 'retirement') { const o = FP.d.other; dr = { mode: 'ret', name, retireYear: FP.d.retireYear, retireMonthly: o.retireMonthly, rentContinues: o.rentContinues, interestContinues: o.interestContinues, otherContinues: o.otherContinues, lifeExp: FP.st.assm.lifeExp ?? '', retEq: FP.st.assm.retEq ?? '', infl: g.o.infl ?? null, month: g.o.month ?? null, include: g.on }; }
    else if (g.members) dr = { mode: 'grad', name, members: g.members.map(m => m.name), include: g.on };
    else { const r = FP.d.goals[g.idx]; dr = { mode: 'goal', idx: g.idx, origName: r.name, name: r.name, pri: r.pri, amt: r.amt, efAuto: FP.efAuto(FP.d, FP.st, r), efMonths: FP.efMonths(FP.st, r), year: r.year, note: r.note || '', month: g.o.month ?? null, infl: g.o.infl ?? null, repeat: g.o.repeat ?? null, include: g.on }; }
    show();
  };
  FP.newGoal = () => { sure = false; dr = { mode: 'new', name: '', pri: 'High', amt: 0, year: null, note: '', month: null, infl: null, repeat: null, include: true }; show(); setTimeout(() => $('#gm_name')?.focus(), 30); };
  FP.closeModal = () => { $('#modal').hidden = true; dr = null; };

  const preview = () => {
    if (dr.mode === 'grad') return withSt(FP.st, () => FP.calc.goals(FP.d, FP.st).find(x => x.name === dr.name));
    if (dr.mode === 'ret') {
      const d = { ...FP.d, retireYear: dr.retireYear, other: { ...FP.d.other, retireMonthly: dr.retireMonthly, rentContinues: dr.rentContinues, interestContinues: dr.interestContinues, otherContinues: dr.otherContinues } };
      const st = { ...FP.st, assm: { ...FP.st.assm, lifeExp: dr.lifeExp, retEq: dr.retEq }, goals: { ...FP.st.goals, Retirement: { infl: dr.infl, month: dr.month, include: true } } };
      return withSt(st, () => FP.calc.goals(d, st).find(x => x.type === 'retirement'));
    }
    const nm = dr.name || 'New goal', row = { name: nm, pri: dr.pri, amt: dr.amt, year: dr.year, note: dr.note, type: FP.gtype(nm), grp: 'Added' }, gl = FP.d.goals.slice();
    let idx = dr.idx; if (dr.mode === 'goal') gl[idx] = row; else { gl.push(row); idx = gl.length - 1; }
    const st = { ...FP.st, combineGrad: false, goals: { ...FP.st.goals, [nm]: { month: dr.month, infl: dr.infl, repeat: dr.repeat, include: true, efAuto: dr.efAuto !== false, efMonths: dr.efMonths ?? 6 } } };
    return withSt(st, () => FP.calc.goals({ ...FP.d, goals: gl }, st).find(x => x.idx === idx));
  };
  const rowP = (l, v, big) => `<div class="r"><span>${l}</span><b class="${big ? 'big' : ''}">${v}</b></div>`;
  const renderPrev = () => {
    const g = preview(), box = $('#gmPrev'); if (!box) return;
    if (!g) { box.innerHTML = '<p class="hint">Enter an amount to see the numbers.</p>'; return; }
    const due = g.type === 'emergency' ? 'Now' : g.due ? 'Due now' : `${MON[g.mon - 1]} ${g.year}`;
    if (g.ret) { box.innerHTML = `<h3>Live preview</h3>${rowP('Retire in', `${MON[g.mon - 1]} ${g.year} · ${g.n} months`)}${rowP('Expense today', FP.inr(g.ret.today) + '/mo')}${rowP('Less income that continues', FP.inr(g.ret.contIncome) + '/mo')}
      ${rowP('Need at retirement', FP.inr(g.ret.mAt) + '/mo')}${rowP('Inflation used', FP.pct(g.infl, 1))}${rowP('Return after retirement', FP.pct(FP.rate('rPost'), 2))}${rowP('Corpus lasts', `${g.ret.N / 12} yrs, till ${g.ret.endYear}`)}${rowP('Corpus needed (FV)', FP.inr(g.fv), 1)}${rowP('Value needed today (PV)', FP.inr(g.lump))}`; return; }
    box.innerHTML = `<h3>Live preview</h3>${rowP('Due', `${due}${g.n > 0 ? ` · ${g.n} months` : ''}`)}${rowP("Today's cost (PV)", FP.inr(g.amt))}${rowP('Inflation used', FP.pct(g.infl, 1))}${rowP('Future cost (FV)', FP.inr(g.fv), 1)}
      ${g.due ? rowP('Needed', 'Now, from existing savings') : rowP('Invest in', `${g.bk} · ${FP.pct(g.r, 1)}`) + rowP('Value needed today', FP.inr(g.lump)) + rowP('Or SIP / month', FP.inr(g.sip)) + rowP(`Or step-up SIP from`, FP.inr(g.step))}
      ${g.members ? `<p class="hint" style="margin-top:8px">Combines ${g.members.length} years. Edit each year below.</p>` : ''}`;
  };

  const show = () => {
    const isNew = dr.mode === 'new', t = dr.mode === 'goal' || isNew ? FP.gtype(dr.name || '') : dr.mode;
    const sel = (id, opts, v) => `<select id="${id}">${opts.map(([val, l]) => `<option value="${val}"${String(val) === String(v ?? '') ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
    const monthOpts = [['', `Default (${t === 'education' ? 'Jun' : 'Mar'})`], ...MON.map((m, i) => [i + 1, m])];
    let form;
    if (dr.mode === 'ret') form = `<label>Target retirement year<input id="gm_retireYear" type="number" value="${dr.retireYear ?? ''}" placeholder="e.g. 2040"></label>
      <label>Or retirement age<input id="gm_retAge" type="number" value="${dr.retireYear && FP.d.self?.dob ? dr.retireYear - FP.d.self.dob.getFullYear() : ''}" placeholder="${FP.d.self?.dob ? 'e.g. 60' : 'needs date of birth'}"></label>
      <label>Due month${sel('gm_month', monthOpts, dr.month)}</label>
      <label class="full">Monthly expense wanted, in today's ₹<input id="gm_retireMonthly" class="money" type="text" inputmode="decimal" data-raw="${dr.retireMonthly || 0}" value="${FP.inrx(dr.retireMonthly || 0)}"></label>
      <label>Rent continues after retirement${sel('gm_rentContinues', [['Yes', 'Yes'], ['No', 'No'], ['—', '—']], dr.rentContinues)}</label>
      <label>Interest income continues${sel('gm_interestContinues', [['Yes', 'Yes'], ['No', 'No'], ['—', '—']], dr.interestContinues)}</label>
      <label>Other income continues${sel('gm_otherContinues', [['Yes', 'Yes'], ['No', 'No'], ['—', '—']], dr.otherContinues)}</label>
      <label>Inflation %<input id="gm_infl" type="number" step="0.1" value="${dr.infl ?? ''}" placeholder="${+(FP.rate('infl') * 100).toFixed(1)}"></label>
      <label>Life expectancy<input id="gm_lifeExp" type="number" value="${dr.lifeExp}" placeholder="${FP.DEF.lifeExp}"></label>
      <label>Retirement mix: equity %<input id="gm_retEq" type="number" value="${dr.retEq}" placeholder="${FP.DEF.retEq}"></label>
      <label class="chk full"><input type="checkbox" id="gm_include" ${dr.include ? 'checked' : ''}> Include in the plan</label>`;
    else if (dr.mode === 'grad') form = `<p class="full hint">This goal combines the graduation years below into the amount needed when college starts. Click a year to change its cost or year.</p>
      <div class="full" style="display:flex;flex-direction:column;gap:6px">${dr.members.map(m => `<button class="glink" data-goal="${FP.esc(m)}">${FP.esc(m)}</button>`).join('')}</div>
      <label class="chk full"><input type="checkbox" id="gm_include" ${dr.include ? 'checked' : ''}> Include in the plan</label>
      <label class="chk full"><input type="checkbox" id="gm_split"> Plan each graduation year as a separate goal instead</label>`;
    else form = `<label class="full">Goal name<input id="gm_name" type="text" value="${FP.esc(dr.name)}" placeholder="e.g. Car, Marriage - Kavya"></label>
      <label>Priority${sel('gm_pri', [['High', 'High'], ['Medium', 'Medium'], ['Low', 'Low']], dr.pri)}</label>
      ${t === 'emergency' ? `<label class="chk full"><input type="checkbox" id="gm_efAuto" ${dr.efAuto !== false ? 'checked' : ''}> Work out from spending (household + EMIs + premiums, savings left out)</label>
        ${dr.efAuto !== false ? `<label>Months of spending<input id="gm_efMonths" type="number" value="${dr.efMonths ?? 6}"></label><label>Spending per month<input type="text" disabled value="${FP.inr(FP.calc.cf(FP.d, FP.st).t.spend)}"></label>` : `<label>Amount (₹)<input id="gm_amt" class="money" type="text" inputmode="decimal" data-raw="${dr.amt || 0}" value="${FP.inrx(dr.amt || 0)}"></label>`}`
      : `<label>Today's cost (₹)<input id="gm_amt" class="money" type="text" inputmode="decimal" data-raw="${dr.amt || 0}" value="${FP.inrx(dr.amt || 0)}"></label>`}
      ${t === 'emergency' ? '' : `<label>Target year<input id="gm_year" type="number" value="${dr.year ?? ''}" placeholder="e.g. 2030"></label><label>Due month${sel('gm_month', monthOpts, dr.month)}</label>`}
      <label>Inflation %<input id="gm_infl" type="number" step="0.1" value="${dr.infl ?? ''}" placeholder="${+(inflDef(t) * 100).toFixed(1)}"></label>
      ${t === 'emergency' ? '' : `<label>Repeats every year until<input id="gm_repeat" type="number" value="${dr.repeat ?? ''}" placeholder="One-time"></label>`}
      <label class="full">Comment<textarea id="gm_note" rows="2">${FP.esc(dr.note)}</textarea></label>
      <label class="chk full"><input type="checkbox" id="gm_include" ${dr.include ? 'checked' : ''}> Include in the plan</label>`;
    $('#mbox').innerHTML = `<header><h2 id="mTitle">${isNew ? 'Add a goal' : FP.esc(dr.name)}</h2><button class="x" id="gmX" aria-label="Close">✕</button></header>
      <div class="mgrid"><div class="mform">${form}</div><div class="mprev" id="gmPrev"></div></div>
      <div class="mfoot"><span>${dr.mode === 'goal' ? '<button class="bt del" id="gmDel">Delete goal</button>' : ''}</span><span style="display:flex;gap:10px"><button class="bt" id="gmCancel">Cancel</button><button class="bt pri" id="gmSave">${isNew ? 'Add goal' : 'Save'}</button></span></div>`;
    $('#modal').hidden = false; renderPrev();
    $('#mbox').querySelectorAll('[id^="gm_"]').forEach(x => { const k = x.id.slice(3), upd = () => {
      dr[k] = x.type === 'checkbox' ? x.checked : x.classList.contains('money') ? FP.num(x.value) : x.type === 'number' || k === 'month' ? (x.value === '' ? null : +x.value) : x.value;
      renderPrev(); if (k === 'name') { $('#mTitle').textContent = dr.name || 'Add a goal'; } };
      x.addEventListener('input', upd); x.addEventListener('change', upd); if (k === 'efAuto') x.addEventListener('change', show);
      if (k === 'retAge' || k === 'retireYear') x.addEventListener('change', () => { const sy = FP.d.self?.dob?.getFullYear(); if (!sy) return; if (k === 'retAge' && dr.retAge) { dr.retireYear = sy + Math.round(dr.retAge); $('#gm_retireYear').value = dr.retireYear; } else if (k === 'retireYear' && dr.retireYear) $('#gm_retAge').value = dr.retireYear - sy; renderPrev(); }); });
    $('#gmX').onclick = $('#gmCancel').onclick = FP.closeModal;
    $('#gmSave').onclick = save;
    $('#gmDel')?.addEventListener('click', e => { if (!sure) { sure = true; e.target.textContent = 'Click again to delete'; return; } FP.set(s => { ensure(s); s.ed.goals.splice(dr.idx, 1); }); FP.closeModal(); });
  };
  const ensure = s => { s.ed = s.ed || {}; if (!s.ed.goals) s.ed.goals = FP.base.goals.map((r, i) => ({ ...clone(r), _o: i })); s.goals = s.goals || {}; };
  const save = () => {
    if ((dr.mode === 'new' || dr.mode === 'goal') && !dr.name.trim()) { $('#gm_name').focus(); $('#gm_name').style.borderColor = 'var(--bad)'; return; }
    FP.set(s => {
      ensure(s);
      if (dr.mode === 'ret') {
        s.ed.retireYear = dr.retireYear; s.ed.other = { ...FP.d.other, retireMonthly: dr.retireMonthly, rentContinues: dr.rentContinues, interestContinues: dr.interestContinues, otherContinues: dr.otherContinues };
        s.assm.lifeExp = dr.lifeExp === null ? '' : dr.lifeExp; s.assm.retEq = dr.retEq === null ? '' : dr.retEq; s.goals.Retirement = { ...(s.goals.Retirement || {}), infl: dr.infl, month: dr.month, include: dr.include };
      } else if (dr.mode === 'grad') {
        s.goals[dr.name] = { ...(s.goals[dr.name] || {}), include: dr.include }; if (dr.split) s.combineGrad = false;
      } else {
        const name = dr.name.trim(), row = { name, pri: dr.pri, amt: dr.amt, year: dr.year, note: dr.note, type: FP.gtype(name) };
        if (dr.mode === 'goal') Object.assign(s.ed.goals[dr.idx], row); else s.ed.goals.push({ ...row, grp: 'Added' });
        if (dr.origName && dr.origName !== name) { delete s.goals[dr.origName]; ['order', 'g3order', 'g5order'].forEach(o => { if (s[o]) s[o] = s[o].map(n => n === dr.origName ? name : n); }); if (s.alNot?.[dr.origName]) { s.alNot = { ...s.alNot, [name]: s.alNot[dr.origName] }; delete s.alNot[dr.origName]; } if (s.al) Object.keys(s.al).forEach(k => { s.al[k] = Array.isArray(s.al[k]) ? s.al[k].map(x => x === dr.origName ? name : x) : s.al[k] === dr.origName ? name : s.al[k]; }); }
        s.goals[name] = { ...(s.goals[name] || {}), month: dr.month, infl: dr.infl, repeat: dr.repeat, include: dr.include, ...(row.type === 'emergency' ? { efAuto: dr.efAuto !== false, efMonths: dr.efMonths ?? 6 } : {}) };
      }
    });
    FP.closeModal();
  };
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-goal]'); if (g) { e.preventDefault(); FP.openGoal(g.dataset.goal); return; }
    if (e.target.closest('[data-addgoal]')) { e.preventDefault(); FP.newGoal(); return; }
    if (e.target.id === 'modal') FP.closeModal();
  });
  FP.goalBtn = (x, ed) => `<button class="glink" data-goal="${FP.esc(x.name)}" title="Edit this goal">${FP.esc(x.name)}</button>${ed && FP.isAdded(x) ? '<span class="newtag" title="Goal added in the tool, not in the Excel">added</span>' : ''}`;
  FP.isAdded = x => !!(FP.st.ed?.goals && x.idx != null && FP.d.goals[x.idx] && FP.d.goals[x.idx]._o == null);
})();

</script>
<script data-src="s6-income.js">
/* Section 6 — Target Monthly Income, and scenarios you build yourself.
   A scenario = changes on top of the plan: SIP type, monthly capacity, per-goal priority / cost / year / how it's funded / % funded,
   and money coming in later (asset sale, bonus) with a date. Sections 3–5 are re-run unchanged on the changed copy. */
(() => {
  FP.ICON.income = '<path d="M4 17l5-5 4 4 7-7M14 9h6v6"/>';
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const HOW = { both: 'Lumpsum + SIP', lump: 'Lumpsum only', sip: 'SIP only', none: 'Leave unfunded' };
  const clone = o => JSON.parse(JSON.stringify(o));
  const run = (d, st) => { const k = FP.st; FP.st = st; try { return { S: FP.calc.sip(d, st), R: FP.calc.retire(d) }; } finally { FP.st = k; } };
  /* Money kept for spending = what isn't available to invest (never less than actual spending) */
  const keepOf = S => Math.max(S.cf.inc - S.avail, S.cf.spend);
  const target = S => keepOf(S) + S.req;
  const sum = S => ({ gap: S.short, t: target(S), sip: S.req, avail: S.avail, now: S.nowShort, ok: S.goals.filter(g => g.funded > .995).length, n: S.goals.length });

  FP.scenApply = (d, st, sc) => {
    const G = sc.goals || {}, ro = G.Retirement || {};
    const dd = { ...d, goals: d.goals.map(g => { const o = G[g.name]; return o ? { ...g, pri: o.pri ?? g.pri, amt: o.amt ?? g.amt, year: o.year ?? g.year } : g; }) };
    if (ro.year != null) dd.retireYear = ro.year;
    if (ro.amt != null) dd.other = { ...d.other, retireMonthly: ro.amt };
    const fund = {}; Object.entries(G).forEach(([n, o]) => { if ((o.how && o.how !== 'both') || (o.pct != null && o.pct !== 100)) fund[n] = { how: o.how, pct: o.pct }; });
    const goals = { ...(st.goals || {}) }; if (ro.pri) goals.Retirement = { ...(goals.Retirement || {}), pri: ro.pri };
    const ss = { ...st, sipMode: sc.sipMode || st.sipMode, fund, goals, inflows: [...(st.inflows || []), ...(sc.inflows || [])].filter(x => +x.amt > 0) };   /* plan's own money-coming-later plus the scenario's */
    if (sc.avail != null) ss.sipAvail = sc.avail;
    return [dd, ss];
  };
  FP.scenRun = (d, st, sc) => run(...(sc ? FP.scenApply(d, st, sc) : [d, st]));
  /* for the client PDF: the same 'what changes' list and totals as the comparison table */
  FP.scenNotes = (d, st, sc) => notes(d, st, sc, FP.calc.goals(d, st).filter(g => g.on)); FP.scenSum = S => sum(S);

  /* Money that is outside the plan today and could be brought in: kept-aside investments and gold jewellery */
  const sources = (d, st) => { const A = FP.calc.alloc(d, st); return [...A.assets.filter(a => a.to === 'none' && a.use === 'Investable' && a.free > 0).map(a => [a.label, a.free, 'kept aside']), ...FP.calc.nw(d, st).rows.filter(r => r.use === 'Personal' && r.cls === 'Gold').map(r => [r.label, r.m, 'personal'])]; };

  /* Starting scenarios, saved only once you edit any of them */
  const presets = (d, st) => {
    const out = [], y0 = FP.planDate().getFullYear(), R = FP.calc.retire(d), mode = st.sipMode === 'flat' ? 'flat' : 'step';
    out.push({ id: 'p1', name: mode === 'step' ? 'Flat SIP' : 'Step-up SIP', sipMode: mode === 'step' ? 'flat' : 'step', goals: {}, inflows: [], note: '' });
    const low = d.goals.filter(g => g.pri === 'Low' && g.year && g.type !== 'emergency');
    if (low.length) out.push({ id: 'p2', name: 'Move low-priority goals', goals: Object.fromEntries(low.map(g => [g.name, { year: g.year + 2, amt: Math.round(g.amt * .8) }])), inflows: [], note: 'Low-priority goals 2 years later and 20% smaller.' });
    if (R) out.push({ id: 'p3', name: 'Retire 2 years later', goals: { Retirement: { year: R.ry + 2 } }, inflows: [], note: '' });
    const src = sources(d, st).filter(x => x[2] === 'kept aside');
    if (src.length) out.push({ id: 'p4', name: 'Sell kept-aside assets', goals: {}, inflows: src.map(([l, v]) => ({ src: l, amt: v, month: 3, year: y0 + 3, to: 'pool' })), note: "Assumes each is sold in 3 years for today's value. Change the year and expected price." });
    return out;
  };

  /* Plain-English list of what a scenario changes, overall and per goal */
  const notes = (d, st, sc, plan) => {
    const out = [], per = {}, P = Object.fromEntries(plan.map(g => [g.name, g]));
    if (sc.sipMode && sc.sipMode !== (st.sipMode === 'flat' ? 'flat' : 'step')) out.push(sc.sipMode === 'flat' ? 'Flat SIP' : `Step-up SIP (${FP.pct(FP.rate('stepUp'), 1)} a year)`);
    if (sc.avail != null) out.push(`Can invest ${FP.inr(sc.avail)} a month`);
    Object.entries(sc.goals || {}).forEach(([n, o]) => {
      const g = P[n]; if (!g) return; const p = [], a0 = n === 'Retirement' ? d.other.retireMonthly : g.amt;
      if (o.pri && o.pri !== g.pri) p.push(`priority ${g.pri} → ${o.pri}`);
      if (o.year != null && o.year !== g.year) p.push(`${g.year ?? '—'} → ${o.year}`);
      if (o.amt != null && Math.abs(o.amt - a0) > 1) p.push(`${FP.short(a0)} → ${FP.short(o.amt)}${n === 'Retirement' ? ' a month' : ''}`);
      if (o.how && o.how !== 'both') p.push(HOW[o.how].toLowerCase());
      if (o.pct != null && o.pct !== 100 && o.how !== 'none') p.push(`fund ${o.pct}%`);
      if (p.length) { per[n] = p.join(', '); out.push(`${n}: ${per[n]}`); }
    });
    (sc.inflows || []).filter(x => +x.amt > 0).forEach(x => { const to = x.to && x.to !== 'pool' ? x.to : 'shared pool'; out.push(`${x.src || 'Money in'}: ${FP.short(+x.amt)} in ${MON[(x.month || 1) - 1]} ${x.year} → ${to}`); if (to !== 'shared pool') per[to] = (per[to] ? per[to] + '; ' : '') + `gets ${x.src || 'money in'}`; });
    if (sc.note) out.push('Note: ' + sc.note);
    return { out, per };
  };

  /* Year by year: income growing with salary vs spending (inflation, loans closing) + goal SIPs (step-up, ending as goals fall due) */
  FP.calc.proj = (d, S, R) => {
    const g = FP.rate('salaryInc'), inf = FP.rate('infl'), s = FP.rate('stepUp'), y0 = FP.planDate().getFullYear();
    const N = Math.max(1, Math.min(15, R ? R.ry - y0 : 15)), extra = keepOf(S) - S.cf.spend;
    return Array.from({ length: N + 1 }, (_, y) => {
      const emi = Math.max(S.cf.emi - d.loans.filter(l => l.closeYear && l.closeYear < y0 + y).reduce((a, l) => a + l.emi, 0), 0);
      const sip = S.future.reduce((a, x) => a + (y * 12 < (x.k ?? x.n) ? x.req * (S.step ? Math.pow(1 + s, y) : 1) : 0), 0);
      return { y: y0 + y, inc: S.cf.inc * Math.pow(1 + g, y), spend: S.cf.living * Math.pow(1 + inf, y) + S.cf.ins + emi + extra, sip };
    });
  };

  /* Progress ring: green = fully funded, amber = partly, red = not funded */
  const fbar = p => { const f = Math.max(0, Math.min(1, p || 0)), c = f > .995 ? '#1E7A46' : f > .005 ? '#C98A0B' : '#B42318', a = 2 * Math.PI * 8;
    return `<span class="ring"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8" fill="none" stroke="#e3e9ec" stroke-width="3.5"/>${f > .005 ? `<circle cx="11" cy="11" r="8" fill="none" stroke="${c}" stroke-width="3.5" stroke-dasharray="${(a * f).toFixed(1)} ${a.toFixed(1)}" transform="rotate(-90 11 11)"/>` : ''}</svg><b style="color:${c}">${f > .995 ? '100%' : FP.pct(f, 0)}</b></span>`; };
  const pts = (a, b) => { const x = Math.round((b - a) * 100); return x ? `<span class="${x > 0 ? 'up' : 'down'}">${x > 0 ? '+' : '−'}${Math.abs(x)} pts</span>` : '<span class="hint">same</span>'; };
  const diff = (a, b, lowGood, fmt = FP.inr) => { const x = b - a; if (Math.abs(x) < 1) return '<span class="hint">same</span>'; const good = lowGood ? x < 0 : x > 0; return `<span class="${good ? 'up' : 'down'}">${x > 0 ? '+' : '−'}${fmt(Math.abs(x))}</span>`; };
  const T = () => FP.trace;

  FP.sec.income = {
    get kref() { return { 'Target monthly income': T().row('income', 0, 'TOTAL', 'Per month'), 'Current take-home': T().kpi('cashflow', 'Monthly income'), 'Extra income needed': T().kpi('income', 'Target monthly income'), 'Spare each month': T().kpi('income', 'Target monthly income'), 'Due now, not covered': T().row('lumpsum', 0, 'TOTAL', 'Still to build') }; },
    ref(w) {
      const t = T();
      if (w.t === 0 && w.c === 'Per month') return { living: t.surplus('living'), emi: t.surplus('emi'), ins: t.surplus('ins'), keep: t.surplus(), sip: t.kpi('sip', 'Monthly SIP needed'), TOTAL: t.kpi('cashflow', 'Spending') }[w.r] || null;
      if (w.t === 1 && w.c === 'As planned') return w.tr.classList.contains('gl') ? t.any(t.row('sip', 0, w.r, 'On track'), t.row('lumpsum', 0, w.r, 'Covered')) : { sip: t.kpi('sip', 'Monthly SIP needed'), avail: t.surplus(), gap: t.row('sip', 0, 'TOTAL', 'Shortfall'), target: t.kpi('income', 'Target monthly income') }[w.r] || null;
      return null;
    },
    checks(d, st) {
      const { S } = run(d, st), x = target(S) - S.cf.inc;
      return x > S.cf.inc * .25 ? [{ msg: `Funding every goal needs ${FP.inr(x)} more take-home a month (${FP.pct(x / S.cf.inc, 0)} above today). Review goal amounts and priorities with the client.` }] : [];
    },
    render(el, d, st) {
      const P = run(d, st), S = P.S, cf = S.cf, tgt = target(S), ext = tgt - cf.inc, keep = keepOf(S), sp = FP.pct(FP.rate('stepUp'), 1);
      const proj = FP.calc.proj(d, S, P.R), cross = proj.find(p => p.spend + p.sip > p.inc + 1);
      const plan = FP.calc.goals(d, st).filter(g => g.on), list = st.scen ?? presets(d, st);
      const res = list.map(sc => ({ sc, ...FP.scenRun(d, st, sc), nt: notes(d, st, sc, plan) })).map(r => ({ ...r, m: sum(r.S) })), pm = sum(S);
      const X = res.find(r => r.sc.id === st.scSel) || res[0];
      const gapTxt = g => g > 1 ? `<span style="color:var(--brown)">${FP.inr(g)}</span>` : '<span style="color:var(--good)">None</span>';
      const card = (r, base) => `<div class="scard${!base && !r.sc.cmp ? ' noprint' : ''}${!base && r.sc.cmp ? ' on' : ''}" role="button" tabindex="0" ${base ? '' : `data-pick="${r.sc.id}" aria-pressed="${r === X}"`}>
          <span class="t">${base ? '' : `<input type="checkbox" class="sctick noprint" data-scpdf="${r.sc.id}" ${r.sc.cmp ? 'checked' : ''} title="Show in the comparison and the PDF" aria-label="Compare ${FP.esc(r.sc.name)}">`}${base ? 'As planned' : FP.esc(r.sc.name)}</span><span class="m">Monthly gap</span><span class="g">${gapTxt(r.m.gap)}</span>
          <span class="m">Target ${FP.inr(r.m.t)} · ${r.m.ok} of ${r.m.n} goals funded</span>
          ${base ? '<span class="m">The plan in Sections 1–5</span>' : `<ul>${r.nt.out.slice(0, 3).map(x => `<li>${FP.esc(x)}</li>`).join('')}${r.nt.out.length > 3 ? `<li>+${r.nt.out.length - 3} more</li>` : ''}${r.nt.out.length ? '' : '<li>No changes yet</li>'}</ul>
          <span class="acts noprint"><button class="link" data-sced="${r.sc.id}">Edit</button><button class="link" data-scdup="${r.sc.id}">Copy</button><button class="link" data-scdel="${r.sc.id}">Delete</button></span>`}</div>`;
      const G = FP.goalOrder(st, S.goals), CR = res.filter(r => r.sc.cmp), cls = r => (r === X ? 'colsel' : '');
      el.innerHTML = `
      <div class="kpis">${FP.kpi('Target monthly income', FP.inr(tgt), 'Take-home needed this year to fund every goal', 1)}
        ${FP.kpi('Current take-home', FP.inr(cf.inc), 'All sources, per month')}
        ${ext > 1 ? FP.kpi('Extra income needed', FP.inr(ext), `${FP.pct(ext / cf.inc, 0)} more than today`) : FP.kpi('Spare each month', FP.inr(-ext), 'Income is enough for every goal')}
        ${S.nowShort > 1 ? FP.kpi('Due now, not covered', FP.short(S.nowShort), S.nowGap.map(g => `${FP.esc(g.name)} ${FP.short(g.gap)}`).join(' · ') + '. Can\'t wait for a SIP: pay from savings, bonus or move the goal.') : ''}</div>
      <div class="callout">${ext > 1 ? `To fund every goal on time, monthly take-home needs to be <b>${FP.inr(tgt)}</b>, which is <b>${FP.inr(ext)}</b> more than today. Try scenarios below to find a plan that fits.` : `Today's take-home of <b>${FP.inr(cf.inc)}</b> already covers every goal, with <b>${FP.inr(-ext)}</b> a month to spare.`}${S.step ? ` The SIP part rises ${sp} a year with the step-up.` : ''}</div>
      <div class="grid2">
        <div><h3>How the target is built</h3><div class="tbl"><table><thead><tr><th data-nosort>Item</th><th class="n" data-nosort>Per month</th><th class="n" data-nosort>Share</th></tr></thead><tbody>
          ${[['living', 'Household & lifestyle', cf.living], ['emi', 'Loan EMIs', cf.emi], ['ins', 'Insurance premiums', cf.ins], ['keep', 'Kept aside, not for goals', keep - cf.spend], ['sip', `SIP needed for goals (${S.step ? 'step-up' : 'flat'})`, S.req]].filter(r => r[2] > 0.5)
            .map(([k, l, v]) => `<tr data-k="${k}"><td>${l}</td><td class="n">${FP.inr(v)}</td><td class="n">${FP.pct(v / tgt, 0)}</td></tr>`).join('')}
          <tr class="tot"><td>Target monthly income</td><td class="n">${FP.inr(tgt)}</td><td class="n">100%</td></tr></tbody></table></div>
          <p class="hint">Spending is from Section 2; SIP needed is from Section 5. Current SIPs are not added again: they are part of the SIP needed.</p></div>
        <div><h3>Will income keep up?</h3><div class="chartbox"><canvas id="incProj" role="img" aria-label="Projected income against spending plus goal SIPs, year by year"></canvas></div>
          ${FP.legend(['Spending', 'Goal SIPs', 'Projected take-home'], null, ['#A3502F', '#1E7A46', '#D99A1A'])}
          <p class="hint">Income grows ${FP.pct(FP.rate('salaryInc'), 1)} a year, household costs ${FP.pct(FP.rate('infl'), 1)}; EMIs stop when loans close; each goal's SIP stops when the goal is due.${cross ? ` <b>Need is above income in ${cross.y}.</b>` : ' Income stays above the need in every year shown.'}</p></div>
      </div>
      <div><div class="secbar"><h3>Scenarios</h3><span class="hint noprint">Tick a card to compare it below and include it in the PDF. Click a card to highlight it.</span></div>
        <div class="sccards">${card({ m: pm }, 1)}${res.map(r => card(r)).join('')}<button class="scard new noprint" data-scnew>+ New scenario</button></div></div>
      ${!CR.length && res.length ? '<p class="hint noprint">Tick "Compare" on one or more scenario cards to see them side by side here.</p>' : ''}${CR.length ? `<div><h3>Scenarios compared</h3>
        <div class="tbl"><table class="sccmp"><thead><tr><th data-nosort>Measure</th><th class="n colbase" data-nosort data-h="As planned">As planned<span class="note">The plan</span></th>${CR.map(r => `<th class="n${r === X ? ' colsel' : ''}${r.sc.hide ? ' noprint' : ''}" data-nosort data-h="${FP.esc(r.sc.name)}" data-pick="${r.sc.id}" title="Highlight this scenario">${FP.esc(r.sc.name)}${r === X ? '<span class="note">★ Highlighted</span>' : ''}</th>`).join('')}</tr></thead><tbody>
          <tr data-k="chg" class="chg"><td>What changes</td><td class="colbase"><span class="hint">Goals and SIPs as in Sections 3–5</span></td>${CR.map(r => `<td class="${cls(r)}">${r.nt.out.length ? `<ul>${r.nt.out.map(x => `<li>${FP.esc(x)}</li>`).join('')}</ul>` : '<span class="hint">No changes yet</span>'}</td>`).join('')}</tr>
          ${[['sip', 'SIP needed / month', 'sip', 1], ['avail', 'Can invest / month', 'avail', 0], ['gap', '<b>Monthly gap</b>', 'gap', 1], ['target', 'Target monthly income', 't', 1], ['now', 'Due now, not covered', 'now', 1]].map(([k, l, f, low]) =>
            `<tr data-k="${k}"><td>${l}</td><td class="n colbase">${k === 'gap' ? `<b>${gapTxt(pm[f])}</b>` : FP.inr(pm[f])}</td>${CR.map(r => `<td class="n ${cls(r)}">${k === 'gap' ? `<b>${gapTxt(r.m[f])}</b>` : FP.inr(r.m[f])}<span class="note">${Math.abs(r.m[f] - pm[f]) >= 1 ? diff(pm[f], r.m[f], low) + ' vs plan' : '&nbsp;'}</span></td>`).join('')}</tr>`).join('')}
          <tr data-k="ok"><td>Goals fully funded</td><td class="n colbase">${pm.ok} of ${pm.n}</td>${CR.map(r => `<td class="n ${cls(r)}">${r.m.ok} of ${r.m.n}</td>`).join('')}</tr>
          <tr class="grp"><td colspan="${CR.length + 2}">How much of each goal is funded</td></tr>
          ${G.map(g => `<tr class="gl" data-k="${FP.esc(g.name)}"><td>${FP.esc(g.name)}<span class="note">${g.pri} priority</span></td><td class="n colbase">${fbar(g.funded)}</td>${CR.map(r => { const x = Object.fromEntries(r.S.goals.map(z => [z.name, z]))[g.name]; return `<td class="n ${cls(r)}">${x ? fbar(x.funded) : '—'}${r.nt.per[g.name] ? `<span class="note">${FP.esc(r.nt.per[g.name])}</span>` : ''}</td>`; }).join('')}</tr>`).join('')}
        </tbody></table></div>
        <p class="hint">Funded = share of the goal reached by existing investments, money coming in later and the SIP that fits within what can be invested.</p></div>` : ''}
      <details class="noprint"><summary><b>How it's calculated (Excel formulas)</b></summary><div class="xl">Kept for spending   = MAX(take-home − can invest, household + EMIs + premiums)
Target income       = kept for spending + SIP needed (Section 5)
Extra needed        = MAX(target income − take-home, 0)
Monthly gap         = MAX(SIP needed − can invest, 0)            (Section 5 shortfall)
Money in later      = covers MIN(amount × (1+r)^(months from arrival to due date), goal's remaining gap), r set by the months left after it arrives
                      only goals due in or after the month it arrives; shared pool goes in Section 4 order
Fund %              = only that share of the goal is planned; "Leave unfunded" = 0%
Funded (goal)       = (covered by investments + still to build × share covered later) ÷ full value needed today
Income in year y    = take-home × (1 + income growth)^y
Need in year y      = household × (1 + inflation)^y + premiums + EMIs of loans still running + Σ goal SIP × (1 + step-up)^y</div></details>`;
      const pick = id => FP.set(s => s.scSel = id);
      el.querySelectorAll('[data-scpdf]').forEach(x => x.onchange = () => save(s => { const c = s.scen.find(z => z.id === x.dataset.scpdf); if (c) c.cmp = x.checked; }));
      el.querySelectorAll('[data-pick]').forEach(c => { c.onclick = e => { if (!e.target.closest('button,label,input')) pick(c.dataset.pick); }; c.onkeydown = e => { if (e.key === 'Enter') pick(c.dataset.pick); }; });
      const save = fn => FP.set(s => { s.scen = clone(list); fn(s); });

      el.querySelectorAll('[data-scdup]').forEach(b => b.onclick = () => { const c = clone(list.find(x => x.id === b.dataset.scdup)); c.id = 's' + Date.now(); c.name += ' (copy)'; save(s => { s.scen.push(c); s.scSel = c.id; }); });
      el.querySelectorAll('[data-scdel]').forEach(b => b.onclick = () => { if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Sure?'; return; } save(s => { s.scen = s.scen.filter(x => x.id !== b.dataset.scdel); }); });
      el.querySelector('[data-scnew]').onclick = () => openEd(null);
      const ax = { grid: { color: '#e8eef1' }, ticks: { callback: v => FP.short(v) } };
      FP.chart('incProj', { type: 'bar', data: { labels: proj.map(p => p.y), datasets: [
        { type: 'line', label: 'Projected take-home', data: proj.map(p => p.inc), borderColor: '#D99A1A', backgroundColor: '#D99A1A', borderWidth: 2.5, pointRadius: 2, order: 0 },
        { label: 'Spending', data: proj.map(p => p.spend), backgroundColor: '#A3502F', stack: 'n', order: 1 },
        { label: 'Goal SIPs', data: proj.map(p => p.sip), backgroundColor: '#1E7A46', stack: 'n', order: 1 }] },
        options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { mode: 'index', callbacks: { label: c => `${c.dataset.label}: ${FP.inr(c.raw)} / month` } } }, scales: { x: { stacked: true, grid: { display: false } }, y: { ...ax, stacked: true } } } });

      /* ---------- Scenario editor (pop-up) ---------- */
      function openEd(sc) {
        const isNew = !sc, dr = sc ? clone(sc) : { id: 's' + Date.now(), name: 'New scenario', goals: {}, inflows: [], note: '' };
        const srcs = sources(d, st), y0 = FP.planDate().getFullYear();
        const sel = (attr, opts, v) => `<select ${attr}>${opts.map(([a, l]) => `<option value="${FP.esc(a)}"${String(a) === String(v ?? '') ? ' selected' : ''}>${FP.esc(l)}</option>`).join('')}</select>`;
        const PRI = [['High', 'High'], ['Medium', 'Medium'], ['Low', 'Low']];

<script data-src="s7-insurance.js">
/* Section 7 — Life & Health Cover: life cover by two methods (income replacement / HLV and needs-based), health cover vs family size,

(() => {
  FP.ICON.insurance = '<path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>';
  const DEF = { cons: 25, disc: 8, healthPer: 5e5, healthMin: 1e6, pa: 5, ci: 3 };
  const up = (v, step = 5e5) => v > 0 ? Math.ceil(v / step) * step : 0;
  const pm = x => x.y > 0 ? x.y / 12 : x.m;
  FP.calc.ins = (d, st) => {
    const o = { ...DEF, ...(st.ins || {}) }, y0 = FP.planDate().getFullYear(), g = FP.rate('salaryInc'), i = o.disc / 100, inf = FP.rate('infl');
    const cf = FP.calc.cf(d, st).t, A = FP.calc.alloc(d, st), R = FP.calc.retire(d);
    /* All goal gaps, retirement included: living cost is covered until the retirement date, the retirement corpus after it */
    const goalGap = A.goals.reduce((s, x) => s + x.gap, 0);
    const spare = A.assets.reduce((s, a) => s + (a.to === 'none' ? 0 : Math.max(a.free - a.used, 0)), 0);
    const loans = FP.calc.nw(d, st).liabs, kids = d.children.length;
    const earnedOf = w => d.inflows.filter(x => new RegExp(`\\(${w}\\)`, 'i').test(x.label) && /salary|business|professional|other income/i.test(x.label)).reduce((s, x) => s + pm(x), 0) * 12;
    const totalEarned = earnedOf('Self') + earnedOf('Spouse');
    const people = [['Self', d.self, R?.ry], ['Spouse', d.spouse, o.spRetire || (d.spouse?.dob ? d.spouse.dob.getFullYear() + 60 : R?.ry)]].filter(p => p[1]).map(([w, p, ry]) => {
      const E = earnedOf(w), N = Math.max((o['ry' + w] || ry || y0) - y0, 0), share = totalEarned ? E / totalEarned : 0;
      const live = x => !x.maturity || x.maturity >= y0, paid = x => /stop/i.test(x.mode);   /* premiums stopped = paid-up: reduced cover, not counted unless ticked */
      const pols = d.life.filter(x => new RegExp(w, 'i').test(x.insured) && live(x) && (o.paidUp || !paid(x))), paidUp = d.life.filter(x => new RegExp(w, 'i').test(x.insured) && live(x) && paid(x) && !o.paidUp);
      const have = pols.reduce((s, x) => s + x.sa, 0);
      /* HLV: present value of the income this person brings home, less their own spending, until they retire */
      let hlv = 0; for (let t = 0; t < N; t++) hlv += E * (1 - o.cons / 100) * Math.pow(1 + g, t) / Math.pow(1 + i, t + 1);
      /* Needs: loans + goals still to build + family's living cost (their share) until they would have retired − investments not used by any goal */
      const rr = (1 + i) / (1 + inf) - 1, yrs = o['yrs' + w] ?? N, liv = cf.living * 12 * share, livPV = yrs > 0 ? liv * (rr ? (1 - Math.pow(1 + rr, -yrs)) / rr * (1 + rr) : yrs) : 0;
      const needs = E ? Math.max(loans * share + goalGap * share + livPV - spare * share, 0) : 0;

      .concat(d.life.filter(x => /stop/i.test(x.mode)).map(x => ({ ...x, why: 'Premiums stopped: check paid-up value and whether cover still runs' })));
    const earners = people.filter(p => p.E > 0);

        <div class="xl">HLV           = Σ income × (1 − own spending %) × (1 + ${sp})^t ÷ (1 + ${o.disc}%)^(t+1),  t = 0 … working years − 1
Needs         = share × (loans + goals still to build − unused investments) + PV(real rate, years, −share × living cost/yr, 0, 1)
                real rate = (1 + ${o.disc}%) ÷ (1 + inflation) − 1
Recommended   = MAX(HLV, Needs), rounded up to ₹5 L
Health        = MAX(minimum floater, per person × family members)</div></details>`;
      el.querySelectorAll('[data-iob]').forEach(x => x.onchange = () => FP.set(s => { s.ins = { ...(s.ins || {}), [x.dataset.iob]: x.checked }; }));
      el.querySelectorAll('[data-io]').forEach(x => x.onchange = () => FP.set(s => { s.ins = { ...(s.ins || {}), [x.dataset.io]: x.classList.contains('money') ? FP.num(x.value) : +x.value }; }));
      const L = [...life.filter(p => p.E).map(p => 'Life · ' + p.first), 'Health'], held = [...life.filter(p => p.E).map(p => Math.min(p.have, p.rec)), Math.min(C.hCover, C.hRec)], add = [...life.filter(p => p.E).map(p => p.gap), C.hGap];
      FP.chart('insBar', { type: 'bar', data: { labels: L, datasets: [{ label: 'Cover held', data: held, backgroundColor: '#1E7A46', borderRadius: 4, barThickness: 22 }, { label: 'Cover to add', data: add, backgroundColor: '#A3502F', borderRadius: 4, barThickness: 22 }] },
        options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${FP.short(c.raw)}` } } }, scales: { x: { stacked: true, grid: { color: '#e8eef1' }, ticks: { callback: v => FP.short(v) } }, y: { stacked: true, grid: { display: false } } } } });
    }
  };
})();
</script>
<script data-src="s8-allocation.js">
/* Section 8 — Asset Allocation: target mix from the risk profile, made goal-aware (money for goals due within 3 years stays in debt),
   compared with today's investments, the moves to rebalance, and where new SIPs go. Settings in st.aa. */
(() => {
  FP.ICON.allocation = '<path d="M12 3v9h9"/><path d="M21 12a9 9 0 1 1-9-9"/>';
  const PROFILES = { 'Conservative': [20, 70, 10], 'Moderately Conservative': [35, 55, 10], 'Balanced': [50, 40, 10], 'Moderately Aggressive': [65, 25, 10], 'Aggressive': [80, 10, 10] };
  const CL = ['Equity', 'Debt', 'Gold'], COL = { Equity: '#1E7A46', Debt: '#2F86BC', Gold: '#D99A1A' };
  const prof = s => Object.keys(PROFILES).find(k => k.toLowerCase() === String(s || '').trim().toLowerCase()) || 'Balanced';

  FP.calc.aa = (d, st) => {
    const a = st.aa || {}, risk = a.risk || prof(d.other.risk), mix = a.mix?.[risk] || PROFILES[risk];
    const nw = FP.calc.nw(d, st), A = FP.calc.alloc(d, st), S = FP.calc.sip(d, st);
    const fin = nw.rows.filter(r => r.use === 'Investable' && ['Equity', 'Debt', 'Cash', 'Gold'].includes(r.cls));
    const cur = { Equity: 0, Debt: 0, Gold: 0 }; fin.forEach(r => cur[r.cls === 'Cash' ? 'Debt' : r.cls] += r.m);
    const total = CL.reduce((s, k) => s + cur[k], 0);
    /* Investments funding goals due within 3 years (and the emergency fund) belong in debt whatever the risk profile */
    /* A retirement corpus lasts decades, so near retirement it follows the post-retirement mix instead of going fully to debt */
    const short = Math.min(A.goals.filter(g => g.n < 36 && g.type !== 'retirement').reduce((s, g) => s + g.got, 0), total), ret = Math.min(A.goals.filter(g => g.n < 36 && g.type === 'retirement').reduce((s, g) => s + g.got, 0), total - short), long = total - short - ret, re = FP.pctOf('retEq') / 100;
    const tgt = { Equity: long * mix[0] / 100 + ret * re, Debt: short + long * mix[1] / 100 + ret * (1 - re), Gold: long * mix[2] / 100 };
    const move = Object.fromEntries(CL.map(k => [k, tgt[k] - cur[k]]));
    const sip = { Debt: 0, Hybrid: 0, Equity: 0 }; S.future.forEach(g => sip[g.bk === 'Retirement mix' ? 'Hybrid' : g.bk] += g.alloc);
    const other = nw.rows.filter(r => r.use === 'Investable' && !['Equity', 'Debt', 'Cash', 'Gold'].includes(r.cls)).reduce((s, r) => s + r.m, 0);
    return { risk, mix, cur, tgt, move, total, short, ret, re, long, sip, sipTotal: S.alloc, other };
  };

  FP.sec.allocation = {
    render(el, d, st) {
      const C = FP.calc.aa(d, st), pc = v => C.total ? v / C.total : 0, big = CL.filter(k => Math.abs(C.move[k]) >= 1000);
      el.innerHTML = `
      <div class="kpis">${FP.kpi('Risk profile', C.risk, `Long-term money: ${C.mix[0]}% equity · ${C.mix[1]}% debt · ${C.mix[2]}% gold`, 1)}
        ${FP.kpi('Investments considered', FP.short(C.total), 'Equity, debt, cash and gold you can invest')}
        ${FP.kpi('Kept in debt for near goals', FP.short(C.short), 'Goals due within 3 years and the emergency fund')}${C.ret ? FP.kpi('Retirement corpus', FP.short(C.ret), `Retiring within 3 years: kept ${Math.round(C.re * 100)}% equity · ${100 - Math.round(C.re * 100)}% debt for the years after`) : ''}
        ${FP.kpi('To move', big.length ? FP.short(big.filter(k => C.move[k] > 0).reduce((s, k) => s + C.move[k], 0)) : 'Nothing', big.length ? 'To bring the mix in line' : 'Mix matches the target')}</div>
      <div class="noprint" style="display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end">
        <label class="switch">Risk profile <select id="aaRisk">${Object.keys(PROFILES).map(k => `<option${k === C.risk ? ' selected' : ''}>${k}</option>`).join('')}</select></label>
        ${CL.map((k, i) => `<label class="switch">${k} % <input data-mx="${i}" type="number" min="0" max="100" value="${C.mix[i]}" style="width:64px;border:1px solid var(--line);border-radius:6px;padding:4px 6px"></label>`).join('')}
        <span class="hint">${d.other.risk ? `From the client's data: ${FP.esc(d.other.risk)}.` : ''} Change the mix for this profile if needed.</span></div>
      <div class="grid2">
        <div><h3>Today vs target</h3><div class="chartbox" style="height:200px"><canvas id="aaBar" role="img" aria-label="Current and target share of equity, debt and gold"></canvas></div>
          ${FP.legend(CL, null, CL.map(k => COL[k]))}</div>
        <div><h3>What to move</h3><div class="tbl"><table><thead><tr><th data-nosort>Asset class</th><th class="n" data-nosort>Today</th><th class="n" data-nosort>Target</th><th class="n" data-nosort>Move</th></tr></thead><tbody>
          ${CL.map(k => `<tr data-k="${k}"><td><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${COL[k]};margin-right:7px"></i>${k}</td><td class="n">${FP.short(C.cur[k])}<span class="note">${FP.pct(pc(C.cur[k]), 0)}</span></td><td class="n">${FP.short(C.tgt[k])}<span class="note">${FP.pct(pc(C.tgt[k]), 0)}</span></td>
            <td class="n">${Math.abs(C.move[k]) < 1000 ? '<span class="hint">Fine</span>' : `<b class="${C.move[k] > 0 ? 'up' : 'down'}">${C.move[k] > 0 ? 'Add ' : 'Reduce '}${FP.short(Math.abs(C.move[k]))}</b>`}</td></tr>`).join('')}
          <tr class="tot"><td>Total</td><td class="n">${FP.short(C.total)}</td><td class="n">${FP.short(C.total)}</td><td></td></tr></tbody></table></div>
          <p class="hint">Rebalance gradually and mind exit loads and capital-gains tax. Use new SIPs to fill the gap where possible instead of selling.${C.other ? ` Property and other assets (${FP.short(C.other)}) are left out.` : ''}</p></div>
      </div>
      <div><h3>Where the new SIPs go</h3><div class="tbl"><table><thead><tr><th data-nosort>Fund type</th><th class="n" data-nosort>SIP / month</th><th class="n" data-nosort>Share</th><th data-nosort>Used for</th></tr></thead><tbody>
        ${['Equity', 'Hybrid', 'Debt'].filter(k => C.sip[k] > 0).map(k => `<tr data-k="${k}"><td>${k} funds</td><td class="n">${FP.inr(C.sip[k])}</td><td class="n">${FP.pct(C.sipTotal ? C.sip[k] / C.sipTotal : 0, 0)}</td><td>${{ Equity: 'Goals 3+ years away', Hybrid: 'Goals 2–3 years away, and retirement once it is near', Debt: 'Goals under 2 years away' }[k]}</td></tr>`).join('') || '<tr><td colspan="4">No new SIP needed.</td></tr>'}
        <tr class="tot"><td>Total</td><td class="n">${FP.inr(C.sipTotal)}</td><td class="n">100%</td><td></td></tr></tbody></table></div>
        <p class="hint">As a goal comes within 3 years, its money moves step by step from equity to hybrid and then debt.</p></div>
      <details class="noprint"><summary><b>How it's calculated</b></summary><div class="xl">Near-goal money   = investments funding goals due within 36 months (Section 4), kept in debt
Retirement money  = if retiring within 36 months: retirement equity % in equity, rest in debt
Long-term money   = investments considered − near-goal money
Target equity     = long-term × equity %      Target gold = long-term × gold %
Target debt       = near-goal money + long-term × debt %   (cash counts as debt)
Move              = target − today; every change is shown (under ₹1,000 counts as none)</div></details>`;
      el.querySelector('#aaRisk').onchange = e => FP.set(s => { s.aa = { ...(s.aa || {}), risk: e.target.value }; });
      el.querySelectorAll('[data-mx]').forEach(x => x.onchange = () => FP.set(s => { const m = C.mix.slice(); m[+x.dataset.mx] = Math.max(0, +x.value || 0); s.aa = { ...(s.aa || {}), mix: { ...(s.aa?.mix || {}), [C.risk]: m } }; }));
      FP.chart('aaBar', { type: 'bar', data: { labels: ['Today', 'Target'], datasets: CL.map(k => ({ label: k, data: [pc(C.cur[k]) * 100, pc(C.tgt[k]) * 100], backgroundColor: COL[k], barThickness: 30 })) },
        options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.raw.toFixed(0)}%` } } }, scales: { x: { stacked: true, max: 100, ticks: { callback: v => v + '%' }, grid: { color: '#e8eef1' } }, y: { stacked: true, grid: { display: false } } } } });
    }
  };
})();
</script>
<script data-src="s9-action.js">
/* Section 9 — Action Steps: a to-do list built from Sections 1–8, plus your own steps, then the disclaimer.
   Tick (done) and hide are kept per client in st.act. Internal steps (data to confirm) are screen-only. */
(() => {
  FP.ICON.action = '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>';
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const WHEN = ['Now', 'This month', 'Within 3 months', 'Every year'];
  FP.calc.act = (d, st) => {
    const out = [], add = (id, when, area, text, sec, internal) => out.push({ id, when, area, text, sec, internal });
    const A = FP.calc.alloc(d, st), S = FP.calc.sip(d, st), I = FP.calc.ins(d, st), AA = FP.calc.aa(d, st);
    const ef = A.goals.find(g => g.type === 'emergency');
    if (ef && ef.gap > 1) add('ef', 'Now', 'Safety', `Build the emergency fund: add ${FP.inr(ef.gap)} to a liquid fund or sweep-in FD.`, 'lumpsum');
    const due = S.nowGap.filter(g => g.type !== 'emergency');
    if (due.length) add('due', 'Now', 'Goals', `Arrange ${FP.inr(due.reduce((s, g) => s + g.gap, 0))} for goals due now (${due.map(g => `${g.name} ${FP.short(g.gap)}`).join(', ')}) from savings or bonus, or move them later.`, 'sip');
    A.switches.forEach((x, k) => add('sw' + k, 'This month', 'Investments', `Move ${FP.inr(x.v)} of ${x.l} to a debt or liquid fund: it is funding ${x.g}, due in ${x.n} months.`, 'lumpsum'));
    S.future.filter(g => g.alloc > 1).forEach(g => add('sip:' + g.name, 'This month', 'SIP', `SIP of ${FP.inr(g.alloc)} a month in ${g.bk === 'Retirement mix' ? `a ${FP.pctOf('retEq')}:${100 - FP.pctOf('retEq')} equity–debt mix` : g.bk.toLowerCase() + ' funds'} for ${g.name} (${MON[g.mon - 1]} ${g.year})${S.step ? `, stepping up ${FP.pct(FP.rate('stepUp'), 0)} every year` : ''}.`, 'sip'));
    if (S.alloc > S.cf.sav + 1) add('sipnew', 'This month', 'SIP', `Current SIPs of ${FP.inr(S.cf.sav)} count towards these; start new SIPs of ${FP.inr(S.alloc - S.cf.sav)} a month.`, 'sip');
    if (S.short > 1) add('gap', 'Within 3 months', 'Goals', `The plan is short by ${FP.inr(S.short)} a month. Agree which goals to move, shrink or fund partly (see Section 6 scenarios), or plan for higher income.`, 'income');
    I.people.filter(p => p.gap > 0).forEach(p => add('life:' + p.w, 'This month', 'Protection', `Buy term insurance of ${FP.short(p.gap)} for ${p.first}, to reach ${FP.short(p.rec)} of life cover.`, 'insurance'));
    if (I.hGap > 0) add('health', 'This month', 'Protection', `Add ${FP.short(I.hGap)} of health cover, ideally as a super top-up on the family floater.`, 'insurance');
    if (I.parents) add('parents', 'Within 3 months', 'Protection', 'Take a separate health policy for parents.', 'insurance');
    if (I.earners.length && !I.pa) add('pa', 'Within 3 months', 'Protection', `Take personal accident cover of about ${FP.short(I.paRec)}.`, 'insurance');
    if (I.earners.length && !I.ci) add('ci', 'Within 3 months', 'Protection', `Consider critical illness cover of about ${FP.short(I.ciRec)}.`, 'insurance');
    I.review.forEach((x, k) => add('pol' + k, 'Within 3 months', 'Protection', `Review ${x.company} (${x.insured}): ${x.why.toLowerCase()}.`, 'insurance'));
    ['Equity', 'Debt', 'Gold'].filter(k => Math.abs(AA.move[k]) >= 1000).forEach(k => add('aa:' + k, 'Within 3 months', 'Investments', `${AA.move[k] > 0 ? 'Increase' : 'Reduce'} ${k.toLowerCase()} by ${FP.short(Math.abs(AA.move[k]))} to match the ${AA.risk.toLowerCase()} mix.`, 'allocation'));
    d.loans.filter(l => l.rate > .09 && l.out > 0).forEach((l, k) => add('loan' + k, 'Within 3 months', 'Loans', `Consider prepaying ${l.desc} (${FP.pct(l.rate, 2)}), costlier than what safe investments earn.`, 'networth'));
    add('nom', 'Within 3 months', 'Estate', 'Check nominations on every bank account, investment and policy.', 'action');
    add('will', 'Within 3 months', 'Estate', 'Write or update a Will.', 'action');
    const pd = FP.planDate(), nx = new Date(pd.getFullYear() + 1, pd.getMonth(), 1);
    add('review', 'Every year', 'Review', `Review this plan once a year (next: ${FP.dmy(nx)}) or after any big change.`, 'action');
    const nChk = FP.PLAN.reduce((n, p) => n + (p.id === 'action' ? 0 : (FP.sec[p.id]?.checks?.(d, st) || []).filter(c => !(st.dismiss || {})[FP.checkKey({ ...c, sec: p.title })]).length), 0);
    if (nChk) add('chk', 'Now', 'Data', `Confirm ${nChk} data points with the client (see Data checks).`, null, true);
    (st.act?.custom || []).forEach(c => out.push({ ...c, area: 'Added', custom: true }));
    return out;
  };

  FP.sec.action = {
    render(el, d, st) {
      const a = st.act || {}, done = a.done || {}, hide = a.hide || {}, all = FP.calc.act(d, st), L = all.filter(x => !hide[x.id]), nHid = all.length - L.length;
      const secNo = id => FP.PLAN.find(p => p.id === id)?.no;
      el.innerHTML = `
      <div class="kpis">${FP.kpi('Steps', `${L.filter(x => !x.internal).length}`, `${L.filter(x => done[x.id] && !x.internal).length} done`, 1)}${WHEN.slice(0, 3).map(w => FP.kpi(w, String(L.filter(x => x.when === w && !x.internal).length), 'steps')).join('')}</div>
      ${WHEN.map(w => { const R = L.filter(x => x.when === w); return R.length ? `<div><h3>${w}</h3><div class="tbl"><table class="acts"><thead><tr><th class="w1" data-nosort>Done</th><th data-nosort>What to do</th><th class="w1" data-nosort>Area</th><th class="w1 noprint" data-nosort></th></tr></thead><tbody>
        ${R.map(x => `<tr class="${done[x.id] ? 'done' : ''}${x.internal ? ' noprint' : ''}" data-k="${FP.esc(x.id)}"><td class="c"><input type="checkbox" data-done="${FP.esc(x.id)}" ${done[x.id] ? 'checked' : ''} aria-label="Done"></td>
          <td>${FP.esc(x.text)}${x.internal ? '<span class="note">Internal, not printed</span>' : ''}</td><td style="white-space:nowrap">${x.area}${x.sec && secNo(x.sec) && x.sec !== 'action' ? `<span class="note noprint"><a href="#${x.sec}">Section&nbsp;${secNo(x.sec)}</a></span>` : ''}</td>
          <td class="noprint"><button class="link" data-hide="${FP.esc(x.id)}" title="${x.custom ? 'Delete step' : 'Hide step'}" style="text-decoration:none">✕</button></td></tr>`).join('')}</tbody></table></div></div>` : ''; }).join('')}
      <div class="noprint" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
        <select id="acWhen">${WHEN.map(w => `<option>${w}</option>`).join('')}</select>
        <input id="acText" type="text" placeholder="Add your own step, e.g. Close the old ULIP after Mar 2027" style="flex:1;min-width:240px;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:15px var(--fb)">
        <button class="bt" id="acAdd">Add step</button>${nHid ? `<button class="link" id="acShow">Show ${nHid} hidden</button>` : ''}</div>
      <div class="disc"><h3>Important</h3>
        <p>This plan is based on the information you shared with us and on assumed returns and inflation, which are not guaranteed. Actual results will differ. Figures are rounded. Please review the plan at least once a year, or whenever your income, family or goals change.</p>
        ${a.amfi ? '<p><b>Mutual Fund investments are subject to market risks, read all scheme related documents carefully.</b></p>' : ''}
        <p class="noprint"><label class="switch"><input type="checkbox" id="acAmfi" ${a.amfi ? 'checked' : ''}> Add the AMFI mutual fund disclaimer line</label></p></div>`;
      const upd = fn => FP.set(s => { s.act = { done: {}, hide: {}, custom: [], ...(s.act || {}) }; fn(s.act); });
      el.querySelectorAll('[data-done]').forEach(c => c.onchange = () => upd(x => { x.done = { ...x.done, [c.dataset.done]: c.checked }; }));
      el.querySelectorAll('[data-hide]').forEach(b => b.onclick = () => upd(x => { const id = b.dataset.hide; if (x.custom.some(c => c.id === id)) x.custom = x.custom.filter(c => c.id !== id); else x.hide = { ...x.hide, [id]: true }; }));
      el.querySelector('#acAdd').onclick = () => { const t = el.querySelector('#acText').value.trim(); if (!t) return el.querySelector('#acText').focus(); upd(x => { x.custom = [...x.custom, { id: 'c' + Date.now(), when: el.querySelector('#acWhen').value, text: t }]; }); };
      el.querySelector('#acText').onkeydown = e => { if (e.key === 'Enter') el.querySelector('#acAdd').click(); };
      el.querySelector('#acShow')?.addEventListener('click', () => upd(x => { x.hide = {}; }));
      el.querySelector('#acAmfi').onchange = e => upd(x => { x.amfi = e.target.checked; });
    }
  };
})();
</script>
<script data-src="goals-bulk.js">
/* Edit goals — one grid to change priority, cost, year, due month, inflation, repeats and inclusion for every goal at once.
   Future cost and value needed today update as you type; nothing is saved until Save. */
(() => {
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  let rows = [], ret = null, sure = false;
  const clone = o => JSON.parse(JSON.stringify(o));
  const withSt = (tmp, fn) => { const k = FP.st; FP.st = tmp; try { return fn(); } finally { FP.st = k; } };

  FP.openGoalsGrid = () => {
    const d = FP.d, G = FP.st.goals || {}; sure = false;
    rows = d.goals.map((g, i) => { const o = G[g.name] || {}; return { i, name: g.name, pri: g.pri, amt: g.amt, year: g.year, note: g.note || '', month: o.month ?? null, infl: o.infl ?? null, repeat: o.repeat ?? null, include: o.include !== false, del: false }; });
    const o = G.Retirement || {};
    ret = d.other.retireMonthly || d.retireYear ? { pri: o.pri || 'High', retireYear: d.retireYear, retireMonthly: d.other.retireMonthly, month: o.month ?? null, infl: o.infl ?? null, include: o.include !== false } : null;
    $('#mbox').classList.add('wide'); show();
  };
  ['openGoal', 'newGoal'].forEach(n => { const f = FP[n]; FP[n] = (...a) => { $('#mbox').classList.remove('wide'); return f(...a); }; });

  /* Run the real Section 3 maths on the draft */
  const calc = () => {
    const live = rows.filter(r => !r.del), ov = { ...(FP.st.goals || {}) };
    live.forEach(r => ov[r.name || 'New goal'] = { ...(ov[r.name] || {}), month: r.month, infl: r.infl, repeat: r.repeat, include: true });
    if (ret) ov.Retirement = { ...(ov.Retirement || {}), pri: ret.pri, month: ret.month, infl: ret.infl, include: true };
    const dd = { ...FP.d, goals: live.map(r => ({ name: r.name || 'New goal', pri: r.pri, amt: r.amt, year: r.year, note: r.note, type: FP.gtype(r.name || '') })), ...(ret ? { retireYear: ret.retireYear, other: { ...FP.d.other, retireMonthly: ret.retireMonthly } } : {}) };
    const ss = { ...FP.st, combineGrad: false, goals: ov };
    const out = withSt(ss, () => FP.calc.goals(dd, ss));
    const m = new Map(out.filter(x => x.idx != null).map(x => [live[x.idx], x]));
    return { m, ret: out.find(x => x.type === 'retirement') };
  };
  const fill = () => {
    const { m, ret: R } = calc();
    rows.forEach((r, k) => { const g = m.get(r), tr = $(`#gg tr[data-r="${k}"]`); if (!tr) return; tr.querySelector('.fv').textContent = g ? FP.inr(g.fv) : '—'; tr.querySelector('.pv').textContent = g ? FP.inr(g.lump) : '—'; tr.querySelector('.du').textContent = g ? (g.type === 'emergency' ? 'Now' : g.due ? 'Due now' : `Due ${MON[g.mon - 1]} ${g.year}`) : ''; });
    const tr = $('#gg tr[data-r="ret"]'); if (tr) { tr.querySelector('.fv').textContent = R ? FP.inr(R.fv) : '—'; tr.querySelector('.pv').textContent = R ? FP.inr(R.lump) : '—'; tr.querySelector('.du').textContent = R ? `Due ${MON[R.mon - 1]} ${R.year}` : 'Needs year + expense'; }

<script data-src="tables.js">
/* Every data table (.tbl table): click a column header to sort A→Z, Z→A, then back to the original order.

(() => {
  const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  let mem = {}; try { mem = JSON.parse(localStorage.getItem('fp:sort')) || {}; } catch (e) { }
  const keep = () => { try { localStorage.setItem('fp:sort', JSON.stringify(mem)); } catch (e) { } };

  /* Heading of the block a table sits in (nearest h3 above it) */
  FP.tblHead = tb => {
    let n = tb.closest('.tbl') || tb;
    for (let up = 0; n && up < 4; up++, n = n.parentElement) {
      for (let s = n.previousElementSibling; s; s = s.previousElementSibling) {
        const h = s.matches('h3') ? s : s.querySelector?.('h3'); if (h) return (h.firstChild?.textContent || h.textContent).trim();
      }
    }
    return '';
  };
  /* Visible text of a cell without the small notes, chips and tags */
  FP.cellText = td => {
    if (!td) return '';
    const c = td.querySelector('input:not([type=checkbox]),select'); if (c) return c.classList.contains('money') ? String(c.dataset.raw ?? c.value) : c.value;
    const cb = td.querySelector('input[type=checkbox]'); if (cb) return cb.checked ? '1' : '0';
    const k = td.cloneNode(true); k.querySelectorAll('.note,.chip,.newtag,.was,.si').forEach(x => x.remove()); return k.textContent.trim();
  };
  const val = s => {
    const t = String(s).replace(/[₹,\s]/g, '').replace(/−/g, '-');
    if (/^(due)?now$|^needednow$/i.test(t)) return -1;
    const m = /^([a-z]{3})[a-z]*(\d{4})$/i.exec(t); if (m && MON[m[1].toLowerCase()]) return +m[2] * 12 + MON[m[1].toLowerCase()];
    const n = /^-?\d*\.?\d+/.exec(t); if (!n) return null;
    return parseFloat(n[0]) * (/Cr$/.test(t) ? 1e7 : /L$/.test(t) ? 1e5 : 1);
  };
  /* Column of a cell, counting colspans */
  FP.colOf = td => { let c = 0; for (let x = td.previousElementSibling; x; x = x.previousElementSibling) c += x.colSpan || 1; return c; };
  FP.cellAt = (tr, ci) => { let c = 0; for (const td of tr.cells) { if (c === ci) return td; c += td.colSpan || 1; if (c > ci) return null; } return null; };

  const keyOf = tb => { const box = tb.closest('section.sec,#editor,#verify,.mbox,[data-pane]'); const all = box ? [...box.querySelectorAll('.tbl table')] : []; return (box?.id || box?.dataset?.pane || 'page') + ':' + (FP.tblHead(tb) || all.indexOf(tb)); };

  const apply = tb => {
    const body = tb.tBodies[0]; if (!body) return;
    const s = mem[tb._key], rows = body._orig;
    const blocks = [], tail = []; let cur = { head: null, rows: [] };
    rows.forEach(r => { if (r.classList.contains('tot')) tail.push(r); else if (r.classList.contains('grp')) { blocks.push(cur); cur = { head: r, rows: [] }; } else cur.rows.push(r); });
    blocks.push(cur);
    if (s) {
      const all = blocks.flatMap(b => b.rows), txt = new Map(all.map(r => { const c = FP.cellAt(r, s.c); return [r, c?.dataset.sort != null ? c.dataset.sort : FP.cellText(c)]; }));
      const nums = new Map(all.map(r => [r, val(txt.get(r))])), filled = all.filter(r => txt.get(r) !== '');
      const numeric = filled.length && filled.filter(r => nums.get(r) != null).length >= filled.length / 2;
      const cmp = (a, b) => numeric ? (nums.get(a) ?? 0) - (nums.get(b) ?? 0) : txt.get(a).localeCompare(txt.get(b), 'en-IN', { numeric: true, sensitivity: 'base' });
      blocks.forEach(b => b.rows.sort((a, b2) => cmp(a, b2) * s.d));
    }
    body._sorting = true;
    blocks.forEach(b => { if (b.head) body.appendChild(b.head); b.rows.forEach(r => body.appendChild(r)); }); tail.forEach(r => body.appendChild(r));
    [...(tb.tHead?.rows[0]?.cells || [])].forEach((th, i) => { const on = s && s.c === i; if (on) th.setAttribute('aria-sort', s.d > 0 ? 'ascending' : 'descending'); else th.removeAttribute('aria-sort'); const si = th.querySelector('.si'); if (si) si.textContent = on ? (s.d > 0 ? '▲' : '▼') : '⇅'; });
  };

  FP.enhance = (root = document) => {
    root.querySelectorAll('.tbl table').forEach(tb => {
      const body = tb.tBodies[0]; if (!body || body._orig) return;
      body._orig = [...body.rows]; tb._key = keyOf(tb);
      [...(tb.tHead?.rows[0]?.cells || [])].forEach((th, i) => {
        const h = th.dataset.h || th.textContent.trim(); if (!h || th.colSpan > 1 || th.hasAttribute('data-nosort')) return;
        th.dataset.h = h; th.classList.add('sortable'); th.tabIndex = 0; th.title = 'Click to sort';
        th.insertAdjacentHTML('beforeend', '<span class="si" aria-hidden="true">⇅</span>');
        const go = () => { const s = mem[tb._key]; mem[tb._key] = !s || s.c !== i ? { c: i, d: 1 } : s.d > 0 ? { c: i, d: -1 } : undefined; if (!mem[tb._key]) delete mem[tb._key]; keep(); apply(tb); };
        th.onclick = e => { if (!e.target.closest('input,select,button')) go(); };
        th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
      });
      if (mem[tb._key]) apply(tb);
    });
    FP.markRefs?.(root);
    /* Number boxes accept Excel-style sums: type 2027+5 or =45000*12 and the result is entered */
    root.querySelectorAll('input[type=number]').forEach(x => { if (x._fx) return; x._fx = 1; x.type = 'text'; x.inputMode = 'decimal'; x.dataset.fx = 1; x.removeAttribute('step'); Object.defineProperty(x, 'type', { get: () => 'number', configurable: true }); });
    toc();
  };
  /* Sticky offsets follow the real top-bar height;  */
  const bar = document.querySelector('.topbar'), setTb = () => document.documentElement.style.setProperty('--tb', bar.offsetHeight + 'px');
  new ResizeObserver(setTb).observe(bar); setTb();
  /* Reorder rows by dragging the ⠿ handle. Click a handle to pick a row, Shift+click to pick a range, Ctrl+click to add one;
     dragging any picked row moves all picked rows together. apply(newKeyOrder) saves; canDrop(keys, targetRow) can refuse. */
  FP.dragRows = (tb, sel, keyOf, apply, canDrop = () => true) => {
    const rows = () => [...tb.querySelectorAll(sel)]; let picked = new Set(), last = null, drag = null;
    const paint = () => rows().forEach(r => r.classList.toggle('picked', picked.has(keyOf(r))));
    rows().forEach(tr => {
      const h = tr.querySelector('td.drag'); if (!h) return;
      h.onclick = e => { const k = keyOf(tr), R = rows();
        if (e.shiftKey && last != null) { const a = R.findIndex(r => keyOf(r) === last), b = R.indexOf(tr); R.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(r => picked.add(keyOf(r))); }
        else if (e.ctrlKey || e.metaKey) picked.has(k) ? picked.delete(k) : picked.add(k);
        else picked = picked.size === 1 && picked.has(k) ? new Set() : new Set([k]);
        last = k; paint(); };
      h.ondragstart = e => { const k = keyOf(tr); if (!picked.has(k)) { picked = new Set([k]); paint(); } drag = rows().map(keyOf).filter(x => picked.has(x)); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', k); };
      tr.ondragover = e => { if (drag && canDrop(drag, tr)) { e.preventDefault(); tr.classList.add('over'); } };
      tr.ondragleave = () => tr.classList.remove('over');
      tr.ondrop = e => { e.preventDefault(); e.stopPropagation(); tr.classList.remove('over'); if (!drag) return; const tgt = keyOf(tr), all = rows().map(keyOf);
        if (drag.includes(tgt)) { drag = null; return; } const rest = all.filter(x => !drag.includes(x)); let at = rest.indexOf(tgt); if (all.indexOf(drag[0]) < all.indexOf(tgt)) at++;
        rest.splice(at, 0, ...drag); drag = null; apply(rest); };
      tr.ondragend = () => { drag = null; tb.querySelectorAll('tr.over').forEach(r => r.classList.remove('over')); };
    });
  };
  const plain = t => /^-?\d*\.?\d*$/.test(t);
  document.addEventListener('input', e => { const x = e.target; if (x?.dataset?.fx && !plain(x.value.trim())) e.stopImmediatePropagation(); }, true);
  document.addEventListener('change', e => { const x = e.target; if (!x?.dataset?.fx) return; const t = x.value.trim(); if (t && !plain(t)) { const v = FP.num(t); x.value = isFinite(v) ? String(+v.toFixed(4)) : ''; } }, true);
  /* Hover shows the full text of anything cut short */
  document.addEventListener('mouseover', e => {
    const el = e.target.closest?.('input[type=text],input:not([type]),td,.note,li,.kpi .s'); if (!el || el.classList.contains('hasref')) return;
    const cut = el.scrollWidth > el.clientWidth + 1 || (!el.matches('input') && el.scrollHeight > el.clientHeight + 2);
    if (cut) { el.title = el.matches('input') ? el.value : el.innerText.trim(); el._tip = 1; } else if (el._tip) { el.removeAttribute('title'); el._tip = 0; }
  });
  /* Left panel: highlight the section on screen */
  function toc() { const lim = bar.offsetHeight + 40; let cur = null; document.querySelectorAll('#sections > section.sec').forEach(s => { if (s.getBoundingClientRect().top <= lim) cur = s.id; });
    cur = cur || document.querySelector('#sections > section.sec')?.id; document.querySelectorAll('#toc a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur)); }
  let tq = 0; addEventListener('scroll', () => { if (!tq) tq = requestAnimationFrame(() => { tq = 0; toc(); }); }, { passive: true });
  /* Re-run whenever any part of the page re-renders (sections, drawer, pop-ups) */
  let q = 0; new MutationObserver(() => { if (!q) q = requestAnimationFrame(() => { q = 0; FP.enhance(); }); }).observe(document.body, { childList: true, subtree: true });
})();

<script data-src="trace.js">
/* Trace a figure to where it comes from, like Excel's Ctrl+[.
   Click a figure with a small green corner → Ctrl+[ (or "Go to source") jumps to its source; Ctrl+] goes back.
   Alt+click jumps straight away. Sources can be another section's cell, Client data, a goal pop-up or Assumptions. */
(() => {
  const SEC = id => { const p = FP.PLAN.find(x => x.id === id); return p ? `${p.no}. ${p.title}` : ''; };
  const T = FP.trace = {
    row: (s, t, r, c) => ({ to: { s, t, r, c } }),
    kpi: (s, k) => ({ to: { s, kpi: k } }),
    sel: (sel, label) => ({ to: { sel, label } }),
    any: (...refs) => ({ to: refs.map(x => x.to) }),
    all: (...refs) => refs.length ? ({ to: { all: refs.map(x => x.to) } }) : null,
    /* Sources outside the page sections: open them and light up the exact field */
    data: (tab, list, i) => ({ act: () => { if (list && i != null) FP.editRow(list, i); else { FP.openData(tab); later(() => FP.hit(list ? $(`#editor [data-add="${list}"]`)?.previousElementSibling : $('#editor .tbl'))); } }, label: 'Client data › ' + tab + (list && i == null ? ' › ' + list : '') }),
    goal: (n, f = 'amt') => ({ act: () => { FP.openGoal(n); later(() => FP.hit($('#gm_' + f) || $('#gm_retireMonthly'))); }, label: 'Goal pop-up › ' + n }),
    surplus: (k = 'avail') => ({ act: () => FP.openSurplus(k), label: 'Client data › Cash flow › ' + ({ inc: 'Take-home income', spend: 'Spending', sav: 'Committed savings', surplus: 'Free surplus' }[k] || 'Can invest per month') }),
    asm: (k = 'infl') => ({ act: () => { if (FP.pane !== 'assmPanel') FP.openDrawer('assmPanel'); later(() => FP.hit($('#a_' + k))); }, label: 'Assumptions › ' + ({ infl: 'General inflation', inflEdu: 'Education inflation', inflMarriage: 'Marriage inflation', rDebt: 'Return under 2 yrs', rHybrid: 'Return 2–3 yrs', rEquity: 'Return 3+ yrs', retEq: 'Retirement mix' }[k] || k) })
  };
  const later = fn => setTimeout(fn, 120);
  /* Highlight that stays until the next click or Esc. A column header lights up its whole column. */
  FP.hit = el => {
    if (!el) return; unhit();
    const cells = el.matches('th') ? [el, ...[...el.closest('table').tBodies[0].rows].map(r => FP.cellAt(r, FP.colOf(el))).filter(Boolean)] : [el];
    cells.forEach(c => c.classList.add('trhit')); el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    setTimeout(() => cells.forEach(c => { c.classList.remove('trflash'); void c.offsetWidth; c.classList.add('trflash'); }), 350);
    if (el.matches('input,select')) setTimeout(() => el.focus({ preventScroll: true }), 400);
  };
  const unhit = () => document.querySelectorAll('.trhit,.trflash').forEach(x => x.classList.remove('trhit', 'trflash'));
  const rowKey = tr => tr.classList.contains('tot') ? 'TOTAL' : tr.dataset.k || tr.querySelector('[data-goal]')?.dataset.goal || (tr.cells[0]?.firstChild?.textContent || '').trim();
  const tables = s => [...(document.getElementById(s)?.querySelectorAll('.tbl table') || [])];
  const head = (tb, ci) => { const th = FP.cellAt(tb.tHead?.rows[0] || { cells: [] }, ci); return th?.dataset.h || th?.textContent.trim() || ''; };

  /* Where a cell sits: section, table no., row key, column name */
  const where = el => {
    const sec = el.closest('section.sec'); if (!sec) return null;
    if (el.matches('.kpi')) return { s: sec.id, kpi: el.querySelector('.l')?.textContent.trim() };
    const tb = el.closest('table'), tr = el.parentElement;
    return { s: sec.id, t: tables(sec.id).indexOf(tb), r: rowKey(tr), c: head(tb, FP.colOf(el)), tr, td: el };
  };
  const find = loc => {
    if (Array.isArray(loc)) { for (const l of loc) { const e = find(l); if (e) return e; } return null; }
    if (loc.all) { const es = loc.all.map(find).filter(Boolean); return es.length ? es : null; }
    if (loc.sel) return document.querySelector(loc.sel);
    const sec = document.getElementById(loc.s); if (!sec) return null;
    if (loc.kpi) return [...sec.querySelectorAll('.kpi')].find(k => k.querySelector('.l')?.textContent.trim() === loc.kpi) || null;
    const tb = tables(loc.s)[loc.t]; if (!tb) return null;
    const ci = [...(tb.tHead?.rows[0]?.cells || [])].findIndex(th => (th.dataset.h || th.textContent.trim()) === loc.c); if (ci < 0) return null;
    if (loc.r == null) return tb.tHead.rows[0].cells[ci];
