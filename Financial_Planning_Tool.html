  };
  const say = loc => {
    if (loc.all) return say(loc.all[0]) + (loc.all.length > 1 ? ` (and ${loc.all.length - 1} more)` : '');
    if (Array.isArray(loc)) loc = loc.find(l => find(l)) || loc[0];
    if (loc.sel) return loc.label; if (loc.kpi) return `${SEC(loc.s)} › ${loc.kpi}`;
    const tb = tables(loc.s)[loc.t]; return [SEC(loc.s), tb && FP.tblHead(tb), loc.r && loc.r !== 'TOTAL' ? loc.r : loc.r ? 'Total' : '', loc.c].filter(Boolean).join(' › ');
  };

  /* The links. Section modules can add their own with FP.sec.x.ref(where) and FP.sec.x.kref = {label: ref} */
  const KPI = {
    networth: { 'Net worth': T.kpi('networth', 'Total assets'), 'Total assets': T.row('networth', 0, 'TOTAL', 'Value'), 'Liabilities': T.data('Net worth', 'liabs'), 'Current financial resources': T.row('networth', 0, null, 'Use') },
    cashflow: { 'Monthly income': T.surplus('inc'), 'Spending': T.surplus('spend'), 'Already investing': T.surplus('sav'), 'Free surplus': T.surplus('surplus'), 'Monthly deficit': T.surplus('surplus') },
    goals: { 'Value needed today': T.row('goals', 0, 'TOTAL', 'Value needed today'), 'Future cost of goals': T.row('goals', 0, 'TOTAL', 'Future cost (FV)'), 'Current financial resources': T.kpi('networth', 'Current financial resources') },
    lumpsum: { 'Covered by existing investments': T.row('lumpsum', 0, 'TOTAL', 'Covered'), 'Still to build': T.row('lumpsum', 0, 'TOTAL', 'Still to build') },
    sip: { 'Monthly SIP needed': T.row('sip', 0, 'TOTAL', 'SIP needed'), 'Can invest now': T.surplus(), 'Monthly shortfall': T.row('sip', 0, 'TOTAL', 'Shortfall') }
  };
  const refOf = w => {
    if (!w) return null;
    if (w.kpi) return KPI[w.s]?.[w.kpi] || FP.sec[w.s]?.kref?.[w.kpi] || null;
    const { s, t, r, c } = w; if (r === 'TOTAL' && s !== 'income') return null;
    switch (`${s}:${t}:${c}`) {
      case 'networth:0:Value': { const i = FP.d.assets.findIndex(a => a.label === r); return i >= 0 ? T.data('Net worth', 'assets', i) : null; }
      case "goals:0:Today's cost (PV)": return T.goal(r);
      case 'goals:0:Inflation': { if (FP.st.goals?.[r]?.infl != null) return T.goal(r, 'infl'); const ty = FP.gtype(r); return T.asm(ty === 'education' ? 'inflEdu' : ty === 'marriage' ? 'inflMarriage' : 'infl'); }
      case 'goals:0:Invest in': case 'sip:0:Invest in': { const x = FP.cellText(w.td); return /debt/i.test(x) ? T.asm('rDebt') : /hybrid/i.test(x) ? T.asm('rHybrid') : /equity/i.test(x) ? T.asm('rEquity') : /retirement/i.test(x) ? T.asm('retEq') : null; }
      case 'goals:0:Future cost (FV)': return T.row('goals', 0, r, "Today's cost (PV)");
      case 'goals:0:Value needed today': return T.row('goals', 0, r, 'Future cost (FV)');
      case 'lumpsum:0:Needed today': return T.row('goals', 0, r, 'Value needed today');
      case 'lumpsum:0:Funded from': case 'lumpsum:0:Covered': { const row = c === 'Covered' ? [...w.tr.cells].find(x => FP.colOf(x) === FP.colOf(w.td) - 1) : w.td;
        const ls = [...(row?.querySelectorAll('.note') || [])].map(n => n.textContent).filter(t => !/^Later/.test(t)).map(t => t.slice(0, t.lastIndexOf(':')));
        return T.all(...ls.map(l => T.row('lumpsum', 1, l, 'Available'))); }
      case 'lumpsum:0:Still to build': return T.row('lumpsum', 0, r, 'Needed today');
      case 'lumpsum:1:Available': return T.row('networth', 0, r, 'Value');
      case 'sip:0:Still to build by due date': return T.row('lumpsum', 0, r, 'Still to build');
      case 'sip:0:SIP needed': return T.row('sip', 0, r, 'Still to build by due date');

  };
  const label = R => R.act ? R.label : say(R.to);

  FP.markRefs = root => {
    root.querySelectorAll('section.sec .tbl tbody td, section.sec .kpi').forEach(el => {
      if (el._refDone) return; el._refDone = 1;
      const R = refOf(where(el)); if (!R) return;
      el._ref = R; el.classList.add('hasref'); el.title = `Linked to: ${label(R)}. Click, then Ctrl+[ to go there (Alt+click jumps).`;

  const bar = document.createElement('div'); bar.id = 'trBar'; bar.className = 'noprint'; bar.hidden = true; document.body.appendChild(bar);

    const el = find(loc); if (el) setTimeout(() => land(el), loc.act ? 60 : 0); else showBar();
  }

  document.addEventListener('click', e => {
    if (e.target.closest('#trBar')) return;
    const el = e.target.closest('td.hasref,.kpi.hasref');
    if (!e.target.closest('#drawer,#modal')) unhit();
    if (!el || e.target.closest('button,input,select,a,textarea,label')) { if (sel && !e.target.closest('#drawer,#modal')) pick(null); return; }
    pick(el); if (e.altKey) { e.preventDefault(); go(); }
  });
  addEventListener('keydown', e => {
    if (e.key === 'Escape' && (sel || back.length || document.querySelector('.trhit'))) { clear(); return; }
    if (!(e.ctrlKey || e.metaKey) || e.target.closest?.('textarea,[contenteditable]')) return;
    if (e.key === '[' || e.code === 'BracketLeft') { if (sel?._ref) { e.preventDefault(); go(); } }
    else if (e.key === ']' || e.code === 'BracketRight') { if (back.length) { e.preventDefault(); goBack(); } }
  });
  /* A re-render replaces the cells: drop the selection but keep the way back */
  const r0 = FP.render; FP.render = function () { r0.apply(this, arguments); sel = null; showBar(); };
})();
</script>

.acard.w{grid-column:1/-1}
.acard h3{font-size:16px;font-weight:700;margin-bottom:4px}.bl{margin:2px 0 0;padding-left:18px;font-size:14.5px}.bl li{margin:3px 0}.acard p{margin:0;font-size:14.5px;color:#4d4552}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{font:600 12.5px var(--fh);background:#f6f2e7;border-radius:12px;padding:4px 10px}.chips b{color:var(--green)}
.tl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin-top:10px;border-radius:12px;overflow:hidden}
.tl div{padding:10px 12px;font-size:13.5px;line-height:1.35}.tl div b{display:block;font:700 18px var(--fh)}
.tl .d{background:#e3eef6}.tl .h{background:#fbefd2}.tl .e{background:#e2f0e6}.tl .d b{color:#2F6E96}.tl .h b{color:#9a6a00}.tl .e b{color:var(--green)}
</style>`);

  /* ---------- page frame ---------- */
  const ctxOf = () => {
    const d = FP.d, st = FP.st, P = [d.self, d.spouse].filter(Boolean);
    return { d, st, P, names: P.map(p => p.name).join(' & '), firsts: P.map(p => p.first || p.name).join(' & '), date: FP.dmy(FP.planDate()), by: st.cpdf?.by || 'Abundance' };
  };
  const top = c => `<div class="top"><div class="wm">ABUNDANCE</div></div>`;
  FP.cp = {
    /* The plan's parts, in reading order. Parts that aren't built yet are listed in the contents as "coming". */
    PARTS: [
      { id: 'intro', title: 'Introduction', sub: 'Why a plan, how to read it, about you, what we assumed' },
      { id: 'today', title: 'Where you are today', sub: 'What you own, what you owe, where your income goes', q: 1 },
      { id: 'goals', title: 'Where you want to go', sub: 'Your goals: what they cost and when you need them', q: 2 },
      { id: 'route', title: 'Lumpsum allocation', sub: 'Your existing investments matched to each goal', q: 3 },
      { id: 'sip', title: 'SIP allocation', sub: 'Monthly SIPs that build the rest', q: 3 },
      { id: 'whatif', title: 'What if?', sub: 'Other routes you could take, compared with the plan', q: 3 },
      { id: 'mix', title: 'Asset allocation', sub: 'How your investments are spread, and what to change', q: 3 },
      { id: 'protect', title: 'Protecting your family', sub: 'Life and health cover', q: 3 },
      { id: 'action', title: 'Your action plan', sub: 'What to do, and when', q: 3 }
    ],
    parts: {},
    /* One page: header, eyebrow (part), title, lead, body */
    page: (c, part, title, lead, body, art) => ({ part, html: `<div class="cpg">${top(c)}<div class="phd"><div><div class="eyebrow">Part ${FP.cp.PARTS.findIndex(p => p.id === part) + 1}${FP.cp.PARTS.find(p => p.id === part).title.toLowerCase() === String(title).toLowerCase() ? '' : ' · ' + E(FP.cp.PARTS.find(p => p.id === part).title)}</div><h1 class="t">${title}</h1>${lead ? `<div class="lead">${lead}</div>` : ''}</div>${art ? il(art, 112, 1) : ''}</div>${body}<!--FOOT--></div>` })
  };

  /* ---------- Part 1: Introduction ---------- */
  /* Cover art: geometric tiles in the brand colours */
  const coverArt = () => {
    const s = 86, C = { g: '#005826', b: '#934E32', y: '#F9B738', c: '#f1e6cc', d: '#39293E', l: '#7FA98B', w: '#fffdf8' };
    const shape = (k, f, r) => { const t = `transform="rotate(${r || 0} ${s / 2} ${s / 2})"`;
      return k === 'q' ? `<path d="M0 0H${s}A${s} ${s} 0 0 1 0 ${s}Z" fill="${C[f]}" ${t}/>` : k === 'h' ? `<path d="M0 ${s}A${s / 2} ${s / 2} 0 0 1 ${s} ${s}Z" fill="${C[f]}" ${t}/>` : k === 'c' ? `<circle cx="${s / 2}" cy="${s / 2}" r="${s / 2 - 6}" fill="${C[f]}"/>`
        : k === 'o' ? `<circle cx="${s / 2}" cy="${s / 2}" r="${s / 2 - 14}" fill="none" stroke="${C[f]}" stroke-width="12"/>` : k === 'd' ? [0, 1, 2].flatMap(i => [0, 1, 2].map(j => `<circle cx="${16 + i * 27}" cy="${16 + j * 27}" r="7" fill="${C[f]}"/>`)).join('') : k === 'l' ? `<path d="M0 0L${s} ${s}V0Z" fill="${C[f]}" ${t}/>` : ''; };
    /* [col,row,bg,shape,fg,rot] on a 5 × 4 grid */
    const T = [[2, 0, 'w', 'q', 'y', 90], [3, 0, 'c', 'h', 'b', 180], [4, 0, 'g', 'c', 'y'],
      [1, 1, 'w', 'h', 'l', 0], [2, 1, 'b', 'q', 'c', 0], [3, 1, 'y', 'o', 'g'], [4, 1, 'c', 'q', 'g', 270],
      [0, 2, 'w', 'd', 'y'], [1, 2, 'g', 'q', 'y', 180], [2, 2, 'c', 'c', 'b'], [3, 2, 'd', 'h', 'y', 90], [4, 2, 'b', 'l', 'y', 0],
      [0, 3, 'y', 'h', 'g', 0], [1, 3, 'c', 'q', 'b', 90], [2, 3, 'g', 'h', 'c', 180], [3, 3, 'w', 'q', 'g', 0], [4, 3, 'y', 'c', 'w']];
    /* as an image: html2canvas draws it reliably that way */
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${s * 5}" height="${s * 4}" viewBox="0 0 ${s * 5} ${s * 4}">${T.map(([x, y, bg, k, f, r]) => `<g transform="translate(${x * s} ${y * s})"><rect width="${s}" height="${s}" fill="${C[bg]}"/>${shape(k, f, r)}</g>`).join('')}</svg>`;
    return `<img class="cv-art" alt="" width="${s * 5}" height="${s * 4}" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}">`;
  };
  const cover = c => { const pd = FP.planDate();
    return { part: 'intro', cover: 1, html: `<div class="cpg cpcover"><div class="cv-l"><span class="cv-chip">${MON[pd.getMonth()].toUpperCase()} ${pd.getFullYear()}</span>
      <div class="cv-t1">FINANCIAL</div><div class="cv-t2">BLUEPRINT</div><div class="cv-tag">Your goals, your route, and the steps to get there.</div></div>
      <div class="cv-who">Prepared for<b>${E(c.names)}</b>Plan date<b>${c.date}</b></div>
      ${coverArt()}<div class="cv-wm">ABUNDANCE<small>Designing Portfolio. Delivering Peace.</small></div></div>` }; };

  const contents = c => FP.cp.page(c, 'intro', "What's inside", 'Six short parts. Read them in order: each one builds on the last.',
    `<div class="toc"><!--TOC--></div>`, 'contents');

  const questions = c => FP.cp.page(c, 'intro', 'Your plan answers three questions', 'Just like a map app. Each part of this plan answers one of them.',
    `<div class="qs">${[[1, 'now', 'Where are you today?', 'A snapshot of what you own, what you owe, and where your monthly income goes. This is your starting point: the blue dot on the map.'],
      [2, 'goal', 'Where do you want to go?', 'Each goal you shared with us: what it costs today, what it will cost when it falls due, and how important it is to you.'],
      [3, 'how', 'How will you get there?', 'The route: how your savings and monthly investments are matched to each goal, how your family stays protected, and the steps to take.']]
      .map(([n, k, h, p], i) => `<div class="q">${il(k, 120, i)}<div><div class="k">Question ${n}</div><h2>${h}</h2><p>${p}</p>
        <div class="in">${FP.cp.PARTS.filter(x => x.q === n).map(x => `<span data-part="${x.id}">Part ${FP.cp.PARTS.indexOf(x) + 1} · ${E(x.title)}<!--PG:${x.id}--></span>`).join('')}</div></div></div>`).join('')}</div>
    <p class="unit">All amounts are in Indian rupees and rounded. L = lakh, Cr = crore.</p>`);

  const assume = c => {
    const { d, st } = c, R = FP.calc.retire(d), AA = FP.calc.aa(d, st), rm = st.goals?.Retirement?.month ?? 3, re = FP.pctOf('retEq');
    const card = (k, h, body, w) => `<div class="acard${w ? ' w' : ''}">${il(k, 56, h.length)}<div><h3>${h}</h3>${body}</div></div>`;
    const ul = a => `<ul class="bl">${a.filter(Boolean).map(x => `<li>${x}</li>`).join('')}</ul>`;
    return FP.cp.page(c, 'intro', "What we've assumed", 'Estimates, not promises. We review them with you every year.',
      `<div class="as">
      ${card('infl', 'Prices rise every year', ul([`Living costs: <b>${pc(FP.rate('infl'))}</b> a year`, `Education: <b>${pc(FP.rate('inflEdu'))}</b> a year`, `Weddings: <b>${pc(FP.rate('inflMarriage'))}</b> a year`]))}
      ${card('stepup', 'Your SIP grows every year', ul([`Steps up <b>${pc(FP.rate('stepUp'))}</b> a year`, `In line with your income growth (${pc(FP.rate('salaryInc'))})`]))}
      ${card('grow', 'Expected returns depend on when you need the money', `<div class="tl"><div class="d"><b>${pc(FP.rate('rDebt'))}</b>Under 2 years<br>Safe funds (debt)</div><div class="h"><b>${pc(FP.rate('rHybrid'))}</b>2 to 3 years<br>Balanced funds (hybrid)</div><div class="e"><b>${pc(FP.rate('rEquity'))}</b>3 years or more<br>Growth funds (equity)</div></div>`, 1)}
      ${R ? card('retire', 'Retirement', ul([`Retire in <b>${MON[rm - 1]} ${R.ry}</b>${R.age ? ` (age ${R.age})` : ''}`, `Money lasts till <b>${R.endYear}</b> (age ${FP.rate('lifeExp')})`, `Earns about <b>${pc(FP.rate('rPost'))}</b> a year after retiring (${re}% growth, ${100 - re}% safe)`])) : ''}
      ${card('risk', 'Your risk profile', ul([`<b>${E(AA.risk)}</b>`, `Growth ${AA.mix[0]}% · Safe ${AA.mix[1]}% · Gold ${AA.mix[2]}%`, 'For money not needed in the next 3 years']))}
      </div>`);
  };

  FP.cp.parts.intro = c => [cover(c), questions(c), assume(c)];   /* contents page to be revisited */

  /* ---------- Assemble: page numbers, contents, footers ---------- */
  FP.cp.build = () => {
    const c = ctxOf(), pages = [];
    FP.cp.PARTS.forEach(p => { const fn = FP.cp.parts[p.id]; if (!fn) return; try { fn(c).forEach(pg => pages.push(pg)); } catch (e) { console.error(e); pages.push(FP.cp.page(c, p.id, E(p.title), '', `<p class="note">This part could not be built: ${E(e.message)}</p>`)); } });
    const N = pages.length, first = {}; pages.forEach((pg, i) => { if (first[pg.part] == null && !pg.cover) first[pg.part] = i + 1; });
    const toc = FP.cp.PARTS.map((p, i) => `<div class="r${first[p.id] ? '' : ' soon'}"><span class="n">${String(i + 1).padStart(2, '0')}</span><div><h3>${E(p.title)}</h3><div class="s">${E(p.sub)}</div></div><span class="pg">${first[p.id] ? 'Page ' + first[p.id] : ''}</span></div>`).join('');
    return pages.map((pg, i) => pg.html.replace('<!--TOC-->', toc).replace(/<!--PG:(\w+)-->/g, (m, id) => first[id] ? ` · page ${first[id]}` : '')
      .replace('<!--FOOT-->', `<div class="foot"><span>Designing Portfolio. Delivering Peace.</span><span>Page ${i + 1} of ${N}</span></div>`));
  };

  /* ---------- Preview and download ---------- */
  document.body.insertAdjacentHTML('beforeend', `<div id="cpView" class="noprint" hidden><div class="cpbar"><b>Client PDF</b><span class="hint" id="cpMsg"></span><span class="sp"></span><button class="btn primary" id="cpDl">Download PDF</button><button class="btn" id="cpX">Close</button></div><div id="cpPages" class="zoom"></div></div>`);
  const tools = document.querySelector('.topbar .tools');
  tools.insertAdjacentHTML('afterbegin', '<button class="btn" id="cpBtn" title="Preview and download the client PDF">Client PDF</button>');
  const view = $('#cpView');
  /* A page whose content runs into the footer is tightened a little (then a little more) instead of spilling over */
  const fit = () => document.querySelectorAll('#cpPages .cpg:not(.cpcover)').forEach(pg => { if (!pg.offsetParent) return; const over = () => { const f = pg.querySelector('.foot').getBoundingClientRect().top - 6; return [...pg.children].some(x => !x.classList.contains('foot') && x.getBoundingClientRect().bottom > f); };
    if (over()) pg.classList.add('fit1'); if (over()) pg.classList.add('fit2'); });
  const draw = () => { $('#cpPages').innerHTML = FP.cp.build().join(''); fit(); const n = FP.cp.PARTS.filter(p => FP.cp.parts[p.id]).length; $('#cpMsg').textContent = n < FP.cp.PARTS.length ? `Parts ready: ${n} of ${FP.cp.PARTS.length}` : ''; };
  FP.cp.open = () => { FP.closeDrawer?.(); FP.closeModal?.(); view.hidden = false; draw(); view.scrollTop = 0; document.body.style.overflow = 'hidden'; };
  const close = () => { view.hidden = true; document.body.style.overflow = ''; };
  $('#cpBtn').onclick = FP.cp.open; $('#cpX').onclick = close;
  addEventListener('keydown', e => { if (e.key === 'Escape' && !view.hidden) close(); }, true);

  FP.cp.download = async () => {
    const btn = $('#cpDl'); btn.disabled = true; const msg = $('#cpMsg'), keep = msg.textContent;
    try {
      await Promise.all(LIBS.map(load)); await document.fonts?.ready;
      await Promise.all(['500 16px Montserrat', '600 16px Montserrat', '700 16px Montserrat', '800 16px Montserrat', '400 16px Carlito', '700 16px Carlito'].map(f => document.fonts?.load(f).catch(() => 0)));
      if (document.fonts && !document.fonts.check('700 16px Montserrat')) FP.toast?.('Montserrat did not load (no internet?): the PDF will use a fallback font.');
      $('#cpPages').classList.remove('zoom');
      const { jsPDF } = window.jspdf, pdf = new jsPDF({ unit: 'mm', format: 'a4', compress: true }), pgs = [...document.querySelectorAll('#cpPages .cpg')];
      for (const [i, pg] of pgs.entries()) {
        msg.textContent = `Making page ${i + 1} of ${pgs.length}…`;
        const cv = await html2canvas(pg, { scale: 2, backgroundColor: '#fffdf8', logging: false, useCORS: true });
        if (i) pdf.addPage(); pdf.addImage(cv.toDataURL('image/jpeg', .9), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
      }
      $('#cpPages').classList.add('zoom');
      const c = ctxOf(), name = `Financial Blueprint - ${c.firsts || 'Client'} - ${c.date.replace(/\//g, '-')}.pdf`, blob = pdf.output('blob');
      /* Where the browser allows it (the desktop copy of the tool), ask where to save; inside claude.ai the save prompt is used */
      if (window.showSaveFilePicker) { try { const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: 'PDF', accept: { 'application/pdf': ['.pdf'] } }] }), w = await h.createWritable(); await w.write(blob); await w.close(); FP.toast?.('PDF saved to ' + h.name); $('#cpPages').classList.add('zoom'); msg.textContent = keep; btn.disabled = false; return; } catch (e) { if (e?.name === 'AbortError') { $('#cpPages').classList.add('zoom'); msg.textContent = keep; btn.disabled = false; return; } } }
      const dl = window.claude?.use ? await window.claude.use('downloads').catch(() => null) : null;
      if (dl) { try { await dl.save({ filename: name, data: blob }); FP.toast?.('PDF saved'); } catch (e) { if (e?.code !== 'declined') FP.toast?.('Could not save the PDF here (' + (e?.code || 'error') + ')'); } }
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
    } catch (e) { console.error(e); FP.toast?.(e.message || 'Could not make the PDF'); }
    $('#cpPages').classList.add('zoom'); msg.textContent = keep; btn.disabled = false;
  };
  $('#cpDl').onclick = FP.cp.download;
})();
</script>

.hc .hh{white-space:nowrap;display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 13px var(--fh)}.hc i{font:700 10.5px var(--fh);font-style:normal;color:var(--t);background:var(--tt);border-radius:10px;padding:2px 8px;white-space:nowrap}
.hc>b{display:block;font:700 23px var(--fh);color:var(--t);margin:6px 0 2px}.hc p{margin:0;font-size:13.5px;line-height:1.35}.hc small{display:block;margin-top:6px;font-size:12px;color:#6d6470}
.top5 .r{display:grid;grid-template-columns:170px 1fr 86px;gap:10px;align-items:center;font-size:13.5px;padding:2px 0}.top5 .r i{display:block;height:12px;border-radius:6px;background:#A3502F}.top5 .r b{font:700 13px var(--fh);text-align:right}
</style>`);
  const T = { good: ['#1E7A46', '#e9f3ec'], warn: ['#B7791F', '#fdf1d8'], bad: ['#B42318', '#fde7e5'] };
  /* Health check card: bands [{max, label, tone}] ascending, same as the tool */
  const hc = (name, v, show, bands, sent, aim) => { const b = bands.find(x => v <= x.max) || bands[bands.length - 1], [t, tt] = T[b.tone];
    return `<div class="hc" style="--t:${t};--tt:${tt}"><div class="hh"><span>${name}</span><i>${b.label}</i></div><b>${show}</b><div class="sc">${bands.map(x => `<span${x === b ? ' class="on"' : ''}></span>`).join('')}</div><p>${sent}</p></div>`; };
  const kp = (items, n) => `<div class="kp" style="grid-template-columns:repeat(${n},1fr)">${items.map(([l, v, s, h]) => `<div class="${h ? 'hero' : ''}"><span>${l}</span><b>${v}</b>${s ? `<small>${s}</small>` : ''}</div>`).join('')}</div>`;
  const bar = segs => `<div class="sbar">${segs.map(s => `<div style="width:${s.p * 100}%;background:${s.c}"></div>`).join('')}</div>`;
  const CL = [['Equity', 'Shares, equity funds'], ['Gold', 'Gold, silver'], ['Debt', 'EPF, PPF, FDs, debt funds'], ['Real estate', 'House, land'], ['Cash', 'Savings account'], ['Others', 'Vehicle, deposits']];

  const nwPage = c => {
    const { d, st } = c, n = FP.calc.nw(d, st), tot = n.total || 1;
    const lq = n.liquid / tot, solv = n.liabs ? n.total / n.liabs : Infinity, dta = n.liabs / tot;
    const segs = CL.map(([k, sub], i) => ({ k, sub, v: n.byClass[i], c: FP.COLORS[i], p: n.byClass[i] / tot })).filter(x => x.v > 0);
    const pers = n.rows.filter(r => r.use === 'Personal').map(r => r.label.replace(/\s*\(.*?\)|\s*-\s*own use|value of the |\s*balance/gi, '').trim());
    const loanFor = l => { const k = /hous|home/i.test(l) ? /hous|home/i : /vehicle|auto|car/i.test(l) ? /auto|vehicle|car/i : /personal/i.test(l) ? /personal/i : /credit/i.test(l) ? /credit/i : null; return k ? d.loans.filter(x => k.test(x.desc)) : []; };
    const owe = d.liabs.filter(l => l.m > 0);
    return FP.cp.page(c, 'today', 'What you own and what you owe', 'Your starting point: the blue dot on the map.',
      kp([['Your assets', S(n.total), 'What you own'], ['Your liabilities', S(n.liabs), 'What you owe'], ['Your net worth', S(n.net), 'Assets minus liabilities', 1]], 3)
      + `<h3 class="st">What you own</h3>${bar(segs)}<div class="lg">${segs.map(s => `<div><i style="background:${s.c}"></i><span><b>${s.k}</b> ${S(s.v)} · ${pc0(s.p)}</span><small>${s.sub}</small></div>`).join('')}</div>
      <div class="two"><div class="box"><h3 class="st">Financial assets vs lifestyle assets</h3>${bar([{ p: n.invest / tot, c: '#005826' }, { p: n.personal / tot, c: '#c9bfae' }])}
        <div class="ln"><span>Financial assets<small>Investments that can fund your goals</small></span><b>${S(n.invest)} · ${pc0(n.invest / tot)}</b></div>
        <div class="ln"><span>Lifestyle assets<small>${E(pers.join(', ') || 'Home, jewellery, vehicle')}: not used for goals</small></span><b>${S(n.personal)} · ${pc0(n.personal / tot)}</b></div></div>
      <div class="box"><h3 class="st">What you owe</h3>${owe.map(l => { const ls = loanFor(l.label); return `<div class="ln"><span>${E(l.label)}${ls.map(x => `<small>EMI ${FP.inr(x.emi)} · ends ${x.closeYear || '—'}</small>`).join('')}</span><b>${S(l.m)}</b></div>`; }).join('') || '<p style="margin:0">Nothing. You are debt-free.</p>'}</div></div>
      <h3 class="st" style="margin-top:22px">Health check</h3><div class="hcs">
      ${hc('Liquidity', lq, pc0(lq), [{ max: .2, label: 'Low', tone: 'bad' }, { max: .6, label: 'Good', tone: 'good' }, { max: Infinity, label: 'Excellent', tone: 'good' }], 'Share of assets you can access within days.')}
      ${hc('Solvency', solv, isFinite(solv) ? solv.toFixed(1) + '×' : 'No debt', [{ max: 1, label: 'Poor', tone: 'bad' }, { max: 5, label: 'Good', tone: 'good' }, { max: Infinity, label: 'Excellent', tone: 'good' }], 'How many times your assets cover everything you owe.')}
      ${hc('Debt to assets', dta, pc0(dta), [{ max: .3, label: 'Healthy', tone: 'good' }, { max: .5, label: 'Watch', tone: 'warn' }, { max: Infinity, label: 'High', tone: 'bad' }], 'Portion of your assets funded by loans.')}</div>`, 'now');
  };

  const cfPage = c => {
    const { d, st } = c, { t, epf, out } = FP.calc.cf(d, st), n = FP.calc.nw(d, st);
    const xe = st.cf.epfOutside ? epf : 0, gi = t.inc + xe, sr = gi ? (gi - t.spend) / gi : 0, ir = gi ? (t.sav + xe) / gi : 0, er = t.inc ? t.living / t.inc : 0, emiR = t.inc ? t.emi / t.inc : 0, efm = t.spend ? n.ef / t.spend : 0;
    const efG = d.goals.find(g => g.type === 'emergency'), efT = efG ? FP.efMonths(st, efG) : 6;
    const base = Math.max(t.inc, t.living + t.emi + t.ins + t.sav + Math.max(t.surplus, 0)) || 1;
    const segs = [['Household & lifestyle', t.living, '#A3502F'], ['Loan EMIs', t.emi, '#8A5FA0'], ['Insurance premiums', t.ins, '#2F86BC'], ['Already investing', t.sav, '#1E7A46'], ['Free surplus', Math.max(t.surplus, 0), '#D99A1A']].filter(x => x[1] > 0).map(([k, v, c]) => ({ k, v, c, p: v / base }));
    const top = out.filter(x => x.g === 'living').sort((a, b) => b.pm - a.pm).slice(0, 4), mx = top[0]?.pm || 1;
    return FP.cp.page(c, 'today', 'Where your monthly income goes', 'Per month, from all sources.',
      kp([['Income', FP.inr(t.inc), 'Take-home'], ['Spending', FP.inr(t.spend), 'Home, EMIs, insurance'], ['Investing', FP.inr(t.sav), 'SIPs, PPF and similar'], [t.surplus >= 0 ? 'Free surplus' : 'Shortfall', FP.inr(Math.abs(t.surplus)), t.surplus >= 0 ? 'Left over each month' : 'Spending more than income', 1]], 4)
      + `<h3 class="st">Out of every ₹100 you earn</h3>${bar(segs)}<div class="lg">${segs.map(s => `<div><i style="background:${s.c}"></i><span><b>₹${Math.round(s.p * 100)}</b> ${s.k}</span><small>${FP.inr(s.v)} a month</small></div>`).join('')}</div>
      ${top.length ? `<div class="box top5" style="margin-top:20px"><h3 class="st">Biggest household expenses</h3>${top.map(x => `<div class="r"><span>${E(x.label.replace(/\s*\(.*?\)/g, ''))}</span><i style="width:${x.pm / mx * 100}%"></i><b>${FP.inr(x.pm)}</b></div>`).join('')}</div>` : ''}
      <h3 class="st" style="margin-top:22px">Health check</h3><div class="hcs">
      ${hc('Surplus ratio', sr, pc0(sr), [{ max: .1, label: 'Poor', tone: 'bad' }, { max: .5, label: 'Good', tone: 'good' }, { max: Infinity, label: 'Excellent', tone: 'good' }], 'Income left after spending, available to invest.')}
      ${hc('Investment rate', ir, pc0(ir), [{ max: .1, label: 'Low', tone: 'bad' }, { max: .2, label: 'Fair', tone: 'warn' }, { max: .35, label: 'Good', tone: 'good' }, { max: Infinity, label: 'Excellent', tone: 'good' }], 'Income already going into investments every month.')}
      ${hc('Lifestyle spending', er, pc0(er), [{ max: .5, label: 'Healthy', tone: 'good' }, { max: .7, label: 'Watch', tone: 'warn' }, { max: Infinity, label: 'High', tone: 'bad' }], 'Income spent on running the household.')}
      ${hc('EMI to income', emiR, pc0(emiR), [{ max: .1, label: 'Best', tone: 'good' }, { max: .2, label: 'Good', tone: 'good' }, { max: .4, label: 'Concerning', tone: 'warn' }, { max: Infinity, label: 'High', tone: 'bad' }], 'Income going to loan repayments.')}
      ${hc('Emergency cover', efm, efm.toFixed(1) + ' months', [{ max: 3, label: 'Low', tone: 'bad' }, { max: 6, label: 'Good', tone: 'good' }, { max: Infinity, label: 'Excellent', tone: 'good' }], `Months of spending covered by money set aside for emergencies (target: ${efT} months).`)}</div>`, 'grow');
  };

  FP.cp.parts.today = c => [nwPage(c), cfPage(c)];
})();
</script>
<script data-src="cp-p3.js">/* Client PDF, Part 3 — Where you want to go: a timeline of goals, then one card per goal (cost today and when due).
   No SIPs or lumpsums here: the final funding is shown once, in Part 4. Goals left out of the plan are not shown. */
(() => {
  const E = FP.esc, S = FP.short, il = (...a) => FP.art.il(...a);
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const PC = { High: ['#005826', '#e9f3ec'], Medium: ['#9a6a00', '#fdf1d8'], Low: ['#934E32', '#f3e9e3'] };
  document.head.insertAdjacentHTML('beforeend', `<style>
.tline{position:relative;height:430px;margin:6px 0 4px}
.tline .ax{position:absolute;left:0;right:0;top:215px;height:4px;border-radius:2px;background:#e4dccb}
.tline .tk{position:absolute;top:207px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--gold);border:4px solid #fffdf8;box-shadow:0 0 0 2px var(--gold)}
.tline .st2{position:absolute;width:2px;margin-left:-1px;background:#d9cfbd}

.tline .yr{position:absolute;top:232px;font:600 11px var(--fh);color:#8b7f8e;transform:translateX(-50%)}
.gl{display:flex;gap:16px;justify-content:center;margin-top:6px;font-size:13px;color:#6d6470}.gl i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.ex{display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:center;margin-top:16px}
.gc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.gcard .h{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.gcard h3{font-size:14.5px;font-weight:700;line-height:1.2}.gcard .m{font-size:12.5px;color:#6d6470;margin-top:2px}
.pri{font:700 9.5px var(--fh);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:9px;margin-right:5px}
.gcard .f{display:grid;grid-template-columns:1fr 1fr;margin-top:8px;border-radius:10px;background:#f6f2e7}
.gcard .f div{padding:6px 8px}.gcard .f div+div{border-left:1px solid #e4dccb}
.gcard .f small{display:block;font-size:11.5px;color:#6d6470}.gcard .f b{font:700 14.5px var(--fh)}.gcard .f div+div b{color:var(--green)}
.gcard .nt{font-size:12px;color:#6d6470;margin:4px 0 8px}
.gp2{font:700 12px var(--fh);letter-spacing:.1em;text-transform:uppercase;color:var(--dark);margin:14px 0 8px;display:flex;align-items:center;gap:8px}.gp2 i{width:10px;height:10px;border-radius:50%}
.gk3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.gk{border:1.5px solid #e4dccb;border-radius:14px;background:#fff;padding:9px 12px;display:flex;flex-direction:column}.gk.wide{grid-column:1/-1}
.gk .h{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin-bottom:6px;min-height:46px}.gk.wide .h{min-height:0}.gk h3{font-size:13px;font-weight:700;line-height:1.2}.gk .m{font-size:11.5px;color:#6d6470;margin-top:2px}
.gk .f2,.gk .f3{display:grid;border-radius:10px;background:#f6f2e7}.gk .f2{grid-template-columns:1fr 1fr}.gk .f3{grid-template-columns:1fr 1fr 1fr}
.gk .f2>div,.gk .f3>div{padding:5px 9px}.gk .f2>div+div,.gk .f3>div+div{border-left:1px solid #e4dccb}
.gk small{display:block;font-size:11px;color:#6d6470}.gk b{font:700 14px var(--fh)}.gk .g b{color:var(--green)}.gk .u{font-size:11px;font-weight:600}.gk .cr{margin-top:6px;border-radius:8px;background:#e9f3ec;padding:5px 9px;font-size:12px;color:var(--green)}.gk .cr b{font-size:14.5px;color:var(--green)}
.nt2{font-size:11.5px;line-height:1.3;color:#6d6470;margin-top:5px;min-height:15px;outline:none;border-radius:4px}.nt2:empty::before{content:'+ Add a note';color:#c2b8a8}
#cpPages:not(.zoom) .nt2:empty::before,.cap .nt2:empty{content:none}#cpPages.zoom .nt2:hover,#cpPages.zoom .nt2:focus{background:#fff8e1;box-shadow:0 0 0 1px var(--gold)}
</style>`);

  /* Same order as Section 3 (drag ⠿ there to rearrange); priority groups keep that order inside them */
  const goals = c => { const all = FP.calc.goals(c.d, c.st).filter(g => g.on), o = c.st.g3order || [], pos = x => { const i = o.indexOf(x.name); return i < 0 ? 1e6 + x.n : i; }; return o.length ? all.sort((a, b) => pos(a) - pos(b)) : FP.goalOrder(c.st, all); };
  const nm = g => E(String(g.name).replace(/post\s*-?\s*graduation/i, 'Post Grad').replace(/graduation/i, 'Grad'));
  const when = g => g.n <= 0 ? (g.type === 'emergency' ? 'Needed now' : 'Due now') : `${MON[g.mon - 1]} ${g.year}`;
  const away = n => n <= 0 ? '' : n < 12 ? `in ${n} month${n > 1 ? 's' : ''}` : `in ${Math.round(n / 6) / 2} years`;
  const pri = p => { const [t, b] = PC[p] || PC.Medium; return `<span class="pri" style="color:${t};background:${b}">${E(p)}</span>`; };
  const note = (g, c) => g.members ? `${g.members.length} years of fees: ${g.members.map(m => m.year).join(', ')}` : g.type === 'retirement' ? `Money to last till ${g.ret.endYear}` : g.type === 'emergency' ? `${g.efMonths || 6} months of household spending` : g.rep ? `Every year till ${g.rep}` : '';

  /* Page 1: when each goal falls due */
  const glance = c => {
    const G = goals(c), y0 = FP.planDate().getFullYear(), yr = g => g.n <= 0 ? y0 : g.year;
    const groups = []; G.slice().sort((a, b) => a.n - b.n).forEach(g => { const y = yr(g), k = g.n <= 0 ? 'now' : y; let x = groups.find(z => z.k === k); if (!x) groups.push(x = { k, y, label: g.n <= 0 ? 'Now' : String(y), g: [] }); x.g.push(g); });
    const y1 = Math.max(y0 + 1, ...groups.map(x => x.y)), W = 682, pos = i => groups.length < 2 ? W / 2 : 82 + i * (W - 164) / (groups.length - 1);   /* evenly spaced: order matters, not distance */
    const bh = x => 40 + x.g.length * 30, upH = Math.max(0, ...groups.filter((x, i) => i % 2 === 0).map(bh)), dnH = Math.max(0, ...groups.filter((x, i) => i % 2).map(bh)), A = upH + 26, H = A + 26 + dnH;   /* timeline only as tall as its boxes */
    const tl = groups.map((x, i) => { const up = i % 2 === 0, cx = pos(i), left = Math.min(Math.max(cx - 82, 0), W - 164), h = 30 + x.g.length * 30;
      return `<div class="st2" style="left:${cx}px;top:${up ? A - 22 : A + 4}px;height:22px"></div><div class="tk" style="left:${cx}px;top:${A - 8}px"></div>
        <div class="bx" style="left:${left}px;${up ? `bottom:${H - A + 22}px` : `top:${A + 26}px`}"><h4>${x.label}</h4>${x.g.map((g, j) => `<div class="g">${il(FP.art.goalKey(g), 26, j)}<span>${nm(g)}</span></div>`).join('')}</div>`; }).join('');
    const nHigh = G.filter(g => g.pri === 'High').length, fv = G.reduce((s, g) => s + g.fv, 0);
    const ex = G.filter(g => g.type !== 'retirement' && g.type !== 'emergency' && g.n >= 24 && !g.members).sort((a, b) => b.fv / b.amt - a.fv / a.amt)[0];
    return FP.cp.page(c, 'goals', 'Your goals at a glance', 'What you are planning for, and when.',
      `<div class="kp" style="grid-template-columns:repeat(3,1fr)"><div><span>Your goals</span><b>${G.length}</b><small>${nHigh} high priority</small></div>
        <div><span>Time span</span><b>${groups[0]?.label === 'Now' ? 'Now' : groups[0]?.label} – ${y1}</b><small>${y1 - y0} years ahead</small></div>
        <div class="hero"><span>Total cost when due</span><b>${S(fv)}</b><small>After inflation</small></div></div>
      <div class="tline" style="height:${H}px"><div class="ax" style="top:${A}px"></div>${tl}</div>
      <div class="gl">${['High', 'Medium', 'Low'].filter(p => G.some(g => g.pri === p)).map(p => `<span><i style="background:${PC[p][0]}"></i>${p} priority: ${G.filter(g => g.pri === p).length}</span>`).join('')}</div>
      ${ex ? `<div class="note ex" style="margin-top:${Math.max(16, Math.round((1050 - 370 - H - 100) / 2))}px">${il('infl', 72, 2)}<div><b>Why goals cost more later.</b> ${E(ex.name)} costs <b>${S(ex.amt)}</b> today. With prices rising ${FP.pct(ex.infl, 0)} a year, it will cost about <b>${S(ex.fv)}</b> by ${ex.year}. Every goal in this plan is priced for the year it falls due.</div></div>` : ''}`, 'goal');
  };

  /* Page 2+: cards grouped by priority. Retirement gets a wide card. Each card has an optional note you type in the preview
     (st.cpdf.notes[goal]); some goals get a suggested note that you can change or clear. */
  const cards = c => {
    const G = goals(c), MONf = m => MON[m - 1], notes = c.st.cpdf?.notes || {};
    const auto = g => g.type === 'emergency' ? 'Kept in a liquid fund, ready to use any time' : g.rep ? `Every year till ${g.rep}` : g.members ? `Fees paid each year from a safe fund` : g.type === 'retirement' && g.ret.contIncome ? `After ${FP.inr(g.ret.contIncome)} a month of income that continues` : '';
    const nt = g => { const v = notes[g.name] ?? auto(g); return `<div class="nt2" contenteditable="true" data-gn="${E(g.name)}" spellcheck="false">${E(v)}</div>`; };
    const fig = (l, v, cls = '') => `<div class="${cls}"><small>${l}</small><b>${v}</b></div>`;
    const card = (g, j) => {
      if (g.type === 'retirement') { const r = g.ret;
        return `<div class="gk"><div class="h">${il('retire', 38, j)}<div><h3>Retirement</h3><div class="m">${MONf(g.mon)} ${g.year}${r.age ? ` · age ${r.age}` : ''} · till age ${FP.rate('lifeExp')}</div></div></div>
          <div class="f2">${fig('Expense today', S(r.today) + '<span class="u">/mo</span>')}${fig(`Expense in ${g.year}`, S(r.today * r.f) + '<span class="u">/mo</span>')}</div><div class="cr">Needed on retiring <b>${S(g.fv)}</b></div>${nt(g)}</div>`; }
      const sub = g.n <= 0 ? (g.type === 'emergency' ? `Now · ${g.efMonths || 6} months of spending` : 'Due now') : `${MONf(g.mon)} ${g.members ? g.members[0].year + '–' + String(g.members[g.members.length - 1].year).slice(2) : g.year}${g.infl ? ` · ${FP.pct(g.infl, 0)} inflation` : ''}`;
      const today = g.members ? fig('Fees today', `${S(g.members[0].amt)}<span class="u">/yr</span>`) : fig('Cost today', S(g.amt));
      return `<div class="gk"><div class="h">${il(FP.art.goalKey(g), 38, j)}<div><h3>${nm(g)}</h3><div class="m">${sub}</div></div></div>
        <div class="f2">${today}${fig(g.n <= 0 ? 'Needed now' : g.members ? 'Needed by ' + g.year : 'Cost when due', S(g.fv), 'g')}</div>${nt(g)}</div>`;
    };
    const groups = ['High', 'Medium', 'Low'].map(p => [p, G.filter(g => g.pri === p)]).filter(x => x[1].length);
    /* page breaks between rows of three */
    const pages = [[]]; let used = 0;
    groups.forEach(([p, L]) => { for (let i = 0; i < L.length; i += 3) { const r = L.slice(i, i + 3), h = (r.some(g => g.type === 'retirement') ? 160 : 138) + (i ? 0 : 36);
      if (used + h > (pages.length > 1 ? 880 : 830)) { pages.push([]); used = 0; } const pg = pages[pages.length - 1]; if (!pg.length || pg[pg.length - 1][0] !== p) pg.push([p, []]); pg[pg.length - 1][1].push(...r); used += h; } });
    return pages.map((pg, k) => FP.cp.page(c, 'goals', k ? 'Your goals, continued' : 'Your goals, one by one', k ? '' : 'What each goal costs today, and what it will cost when it falls due.',
      pg.map(([p, L]) => `<div class="gp2"><i style="background:${PC[p][0]}"></i>${p} priority</div><div class="gk3">${L.map(card).join('')}</div>`).join('')));

  const me = who, pname = () => `${clean(me())} - ${yr()}.json`, fname = pname, dname = () => `${clean(me())} - ${yr()} (${FP.dmy(new Date()).replace(/\//g, '-')}).json`;
  const tm = t => new Date(t).toTimeString().slice(0, 5);
  const bdata = async () => { const rec = await idbGet(FP.key); return { rec, text: JSON.stringify({ app: 'Abundance Financial Blueprint', v: 1, key: String(FP.key), name: who(), at: Date.now(), st: FP.st, file: rec?.blob ? { name: rec.name, data: await b64(rec.blob) } : null }) }; };
  FP.backupFile = () => H[FP.key]?.name || null;
  /* ---- WorkDrive folder: link once; each client's plan file then saves itself into <folder>/<client>/ ---- */
  const dirOK = 'showDirectoryPicker' in window && window.self === window.top;
  document.querySelector('#syncChip').insertAdjacentHTML('afterend', '<button class="btn" id="wdChip" hidden></button>');
  const wdShow = () => { const c = $('#wdChip'); if (c) { c.hidden = !root || !!FP.base?.sample;
      c.textContent = wdState === 'ask' ? '⚠ WorkDrive: click to allow' : wdState === 'saving' ? 'WorkDrive: saving…' : wdState === 'error' ? '⚠ WorkDrive: not saved' : wdState === 'saved' ? `✓ WorkDrive ${tm(wdAt)}` : 'WorkDrive linked';
      c.classList.toggle('warnbtn', wdState === 'ask' || wdState === 'error'); } renderPane(); };
  $('#wdChip').onclick = () => wdState === 'ask' || wdState === 'error' ? wdSave(true) : FP.openDrawer('clientsPanel');
  const perm = async ask => { let p = await root.queryPermission({ mode: 'readwrite' }); if (p !== 'granted' && ask) p = await root.requestPermission({ mode: 'readwrite' }).catch(() => 'denied'); return p === 'granted'; };
  const cdir = () => root.getDirectoryHandle(clean(me()), { create: true });
  async function wdWrite(ask, onlyNew) {
    if (!root || FP.base?.sample || FP.key === 'sample') return false;
    if (!(await perm(ask))) { wdState = 'ask'; wdShow(); return false; }
    try { const dir = await cdir();
      if (onlyNew) { try { await dir.getFileHandle(pname()); dirty = false; if (wdState !== 'saved') wdState = 'idle'; wdShow(); return false; } catch (e) { } }   /* opening a client doesn't rewrite an existing file */
      wdState = 'saving'; wdShow();
      const fh = await dir.getFileHandle(pname(), { create: true }), { text } = await bdata(), w = await fh.createWritable(); await w.write(text); await w.close();
      wdState = 'saved'; wdAt = Date.now(); wdErr = ''; dirty = false; wdShow(); return fh.name; }
    catch (e) { wdState = 'error'; wdErr = e.message || 'unknown error'; wdShow(); return false; }
  }
  let wdBusy = Promise.resolve(); wdSave = (ask, onlyNew) => (wdBusy = wdBusy.then(() => wdWrite(ask, onlyNew)));
  async function link() {
    try { root = await window.showDirectoryPicker({ id: 'fp-workdrive', mode: 'readwrite' }); }
    catch (e) { if (e?.name !== 'AbortError') msg('<span class="no">Could not link the folder: ' + FP.esc(e.message) + '</span>'); return; }
    hdb('readwrite', s => s.put(root, '__root')); wdState = 'idle'; wdShow(); if (!FP.base?.sample) wdSave(true);
  }
  if (dirOK) hdb('readonly', s => s.get('__root')).then(async h => { if (!h) return; root = h; wdState = (await perm(false)) ? 'idle' : 'ask'; wdShow(); });
  /* ---- Never lose work: on a new client, save to WorkDrive (or ask how); warn before closing with unsaved work ---- */
  document.head.insertAdjacentHTML('beforeend', `<style>#wdAsk{position:fixed;inset:0;background:rgba(57,41,62,.45);display:grid;place-items:center;z-index:9999;padding:16px}#wdAsk>div{background:#fff;border-radius:14px;padding:22px 24px;max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
    #wdAsk h3{margin:0 0 8px;font:700 18px var(--fh);color:var(--green)}#wdAsk p{margin:0 0 18px;font-size:14.5px;line-height:1.5}#wdAsk .row{display:flex;gap:8px;justify-content:flex-end}#wdAsk .bt{font:700 14px var(--fh);text-transform:none;letter-spacing:0;padding:9px 18px}</style>`);
  const ask = (title, text, label, fn) => { $('#wdAsk')?.remove(); document.body.insertAdjacentHTML('beforeend', `<div id="wdAsk"><div><h3>${title}</h3><p>${text}</p><div class="row"><button class="bt" id="wdLater">Later</button><button class="bt pri" id="wdGo">${label}</button></div></div></div>`);
    $('#wdLater').onclick = () => $('#wdAsk').remove(); $('#wdGo').onclick = () => { $('#wdAsk').remove(); fn(); }; };
  async function onNewClient() {
    if (FP.base?.sample || opening) return; dirty = true; const nm = FP.esc(clean(who()));
    if (root) { if (await perm(false)) { const n = await wdSave(false, true); if (n) FP.toast?.(`Saved to WorkDrive: ${clean(who())} / ${n}`); return; }
      return ask('Save to WorkDrive?', `Allow the browser to save <b>${nm}</b> to your WorkDrive folder <b>${FP.esc(root.name)}</b>. After that, every change saves itself.`, 'Allow and save', () => wdSave(true)); }
    if (dirOK) return ask('Save this client to WorkDrive?', `Link your WorkDrive folder (for example <b>Financial Plans</b>) so <b>${nm}</b>'s work saves itself after every change. Without it, closing this page can lose your work.`, 'Link WorkDrive folder', link);
    setTimeout(() => { if (status !== 'synced' && dirty) ask('Save a plan file?', `Your work on <b>${nm}</b> is only in this browser. Save a plan file so it isn't lost.`, 'Save plan file', () => backup(false)); }, 4000);   /* in claude.ai: only if account saving didn't work */
  }
  addEventListener('beforeunload', e => { if (dirty && !FP.base?.sample) { e.preventDefault(); e.returnValue = ''; } });   /* browser's "Leave site? Changes may not be saved" */
  document.addEventListener('visibilitychange', () => { if (document.hidden && dirty && root) { clearTimeout(wdT); wdSave(false); } });   /* switching away: save now, don't wait */
  /* ---- Open a client straight from the linked WorkDrive folder: one row per client subfolder, newest first ---- */
  const dt = t => `${FP.dmy(new Date(t))} ${tm(t)}`;
  function wdListHTML() {
    const L = Array.isArray(wdList) ? wdList : null;
    return `<h3>Open a client from WorkDrive</h3>
      ${wdList === 'ask' ? '<p>The browser needs your OK to read your WorkDrive folder.</p><button class="bt pri" id="wdRef">Allow and show clients</button>'
        : wdList === 'error' ? '<p class="no">Could not read the folder.</p><button class="bt" id="wdRef">Try again</button>'
        : !L ? '<p class="hint">Loading your clients…</p>'
        : !L.length ? '<p class="hint">No clients saved in this folder yet. Upload a client\'s Excel and it will appear here.</p>'
        : `<div style="display:flex;gap:8px;align-items:center;margin:6px 0 10px"><input id="wdQ" type="search" placeholder="Search ${L.length} client${L.length > 1 ? 's' : ''}" style="flex:1;padding:8px 10px;border:1px solid #cfd8d2;border-radius:6px;font:inherit"><button class="bt" id="wdRef" title="Read the folder again">${wdBusyScan ? 'Refreshing…' : 'Refresh'}</button></div>
          <div class="tbl" style="max-height:340px;overflow:auto"><table><thead><tr><th>Client</th><th>Last saved</th><th data-nosort></th></tr></thead><tbody>
          ${L.map((r, i) => `<tr data-wq="${FP.esc(r.name.toLowerCase())}"><td>${FP.esc(r.name)}${r.files.length > 1 ? `<br><select data-ws="${i}" style="margin-top:4px;max-width:100%;font-size:12.5px">${r.files.map((f, k) => `<option value="${k}" ${f === r.main ? 'selected' : ''}>${FP.esc(f.m.replace(/\.json$/i, ''))}</option>`).join('')}</select>` : ''}</td>
            <td class="n">${dt(r.at)}</td><td><button class="link" data-wo="${i}">Open</button></td></tr>`).join('')}</tbody></table>
          <p class="hint" id="wdNone" hidden style="margin:8px">No client matches.</p></div>`}
      <div style="height:18px"></div>`;
  }
  async function wdScan(ask) {
    if (!root || wdBusyScan) return;
    if (!(await perm(ask))) { wdList = 'ask'; return renderPane(); }
    wdBusyScan = true; if (!Array.isArray(wdList)) wdList = null; renderPane();
    try { const L = [];
      for await (const [n, h] of root.entries()) { if (h.kind !== 'directory') continue; const F = [];
        for await (const [m, f] of h.entries()) if (f.kind === 'file' && /\.json$/i.test(m)) { try { F.push({ m, f, at: (await f.getFile()).lastModified }); } catch (e) { } }
        if (!F.length) continue; F.sort((a, b) => b.at - a.at);
        L.push({ name: n, files: F, main: F.find(x => / - \d{4}\.json$/i.test(x.m)) || F[0], at: F[0].at }); }
      wdList = L.sort((a, b) => b.at - a.at); }
    catch (e) { wdList = 'error'; }
    wdBusyScan = false; renderPane();
  }
  async function wdOpen(i, k) {
    const r = Array.isArray(wdList) && wdList[i], f = r?.files[k]; if (!f) return;
    if (!(await perm(true))) return msg('<span class="no">The browser did not allow reading the folder.</span>');
    if (dirty && !FP.base?.sample) { clearTimeout(wdT); await wdSave(false); }   /* the client on screen is saved before switching */
    msg('Opening…'); opening = true; const ok = await restore(await f.f.getFile()).finally(() => { opening = false; }); if (!ok) return;
    clearTimeout(wdT); dirty = false; wdState = 'idle'; wdShow();   /* just opening doesn't rewrite the file */
    if (FP.pane === 'clientsPanel') FP.closeDrawer(); FP.toast?.(`Opened ${r.name}`);
  }
  async function backup(asNew) {
    if (FP.base?.sample) return FP.toast?.('Upload a client first');
    if (root) {
      if (!asNew) { const n = await wdSave(true); if (n) FP.toast?.(`Saved to WorkDrive: ${clean(me())} / ${n}`); return; }
      try { if (!(await perm(true))) throw new Error('Permission not given'); const h = await window.showSaveFilePicker({ suggestedName: dname(), startIn: await cdir(), types: [{ description: 'Plan file', accept: { 'application/json': ['.json'] } }] });
        const { text } = await bdata(), w = await h.createWritable(); await w.write(text); await w.close(); FP.toast?.(`Saved a separate copy: ${h.name}`); }
      catch (e) { if (e?.name !== 'AbortError') FP.toast?.('Could not save: ' + e.message); }
      return;
    }
    if (pickerOK) {
      try {
        let h = asNew ? null : (H[FP.key] || await hdb('readonly', s => s.get(String(FP.key))));
        if (h && (await h.queryPermission?.({ mode: 'readwrite' })) !== 'granted' && (await h.requestPermission?.({ mode: 'readwrite' })) !== 'granted') h = null;
        if (!h) h = await window.showSaveFilePicker({ suggestedName: asNew ? dname() : fname(), types: [{ description: 'Plan file', accept: { 'application/json': ['.json'] } }] });
        const { rec, text } = await bdata(), w = await h.createWritable(); await w.write(text); await w.close(); dirty = false;
        H[FP.key] = h; hdb('readwrite', s => s.put(h, String(FP.key)));
        FP.toast?.(`Saved to ${h.name}`); msg(`<span class="ok">Saved to ${FP.esc(h.name)}</span>${rec?.blob ? '' : ' (the Excel was not in this browser, so keep it with the plan file)'}. Ctrl+S saves to this file again; Ctrl+Shift+S saves a separate copy.`); renderPane(); return;
      } catch (e) { if (e?.name === 'AbortError') return; if (e?.name === 'SecurityError' || e?.name === 'NotAllowedError' || e instanceof TypeError) pickerOK = false; else { FP.toast?.('Could not save: ' + e.message); return; } }
    }
    const { rec, text } = await bdata();
    try { await save(pname(), text); dirty = false; FP.toast?.('Plan file downloaded');
      msg(`<span class="ok">Plan file downloaded${rec?.blob ? ' (Excel + your work)' : ''}.</span> Inside claude.ai the browser can't overwrite a file you picked, so each save is a new download. To choose the folder, turn on "Ask where to save each file" in your browser's download settings.`); }
    catch (e) { if (e?.code !== 'declined') msg('<span class="no">Could not save the plan file.</span>'); }
  }
  async function restore(f) {
    try {
      const b = JSON.parse(await f.text()); if (b.app !== 'Abundance Financial Blueprint' || !b.st) throw new Error('This is not a Blueprint plan file.');
      if (b.file) await FP.loadFile(new File([unb64(b.file.data)], b.file.name || 'client.xlsx'));
      else if (String(FP.key) !== b.key) throw new Error(`This plan file is for ${b.name}. Upload their Excel first, then open it.`);
      FP.st = Object.assign(FP.defaults(), b.st); FP.st._at = Date.now(); FP.hist = { u: [], r: [] }; FP.save(); FP.render();
      msg(`<span class="ok">Opened ${FP.esc(b.name)}, saved on ${FP.dmy(new Date(b.at))}.</span>`); return true;
    } catch (e) { msg('<span class="no">' + FP.esc(e.message) + '</span>'); return false; }
  }
  /* Ctrl+S = save the backup (same file again after the first time); Ctrl+Shift+S = save as a new file */
  addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 's') { e.preventDefault(); backup(e.shiftKey); } });
  FP.restoreFile = f => restore(f).then(() => { if (FP.pane !== 'clientsPanel') FP.toast?.('Plan file opened'); });
  const od = FP.openDrawer; FP.openDrawer = p => { od(p); if (p === 'clientsPanel' && FP.pane === 'clientsPanel') { renderPane(); loadList(); if (root) wdScan(false); setTimeout(() => $('#wdQ')?.focus(), 50); } };
  show();
})();
</script>
<script>FP.boot()</script>
