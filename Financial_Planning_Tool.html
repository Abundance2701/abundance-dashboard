<title>Abundance Financial Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Carlito:wght@400;700&display=swap">
<style>
/* Layout: sticky brand bar → client cover → sidebar of plan sections + report "pages". Single light, print-ready look on brand background. */
:root{
  --green:#005826; --brown:#934E32; --gold:#F9B738; --bg:#F0F8FF; --dark:#39293E;
  --paper:#ffffff; --ink:#24302a; --muted:#5f6b66; --line:#d9e4ea; --tint:#e6f2ec; --goldtint:#fff4d9;
  --good:#1E7A46; --warn:#B7791F; --bad:#B42318;
  --c1:#1E7A46; --c2:#D99A1A; --c3:#2F86BC; --c4:#A3502F; --c5:#7D8F3A; --c6:#8A5FA0;
  --fh:'Montserrat','Segoe UI',Arial,sans-serif; --fb:'Calibri','Carlito','Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);margin:0}
h1,h2,h3,h4{font-family:var(--fh);color:var(--dark);text-wrap:balance;margin:0}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
button,select,input{font:inherit}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--green);color:#fff;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font:800 20px var(--fh);letter-spacing:.04em}
.brand span{font-size:12px;opacity:.85;letter-spacing:.03em}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tools label{font-size:13px;display:flex;gap:6px;align-items:center}
.tools input[type=month]{border-radius:6px;border:0;padding:5px 8px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
.cover{background:var(--paper);border-radius:10px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;border-top:6px solid var(--gold)}
.cover .eyebrow{font:700 12px var(--fh);letter-spacing:.12em;text-transform:uppercase;color:var(--brown)}
.cover h1{font-size:clamp(22px,3.4vw,32px);margin-top:4px}
.family{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--tint);color:var(--green);font-weight:700;white-space:nowrap}
.chip.warn{background:var(--goldtint);color:#7a4d00}.chip.bad{background:#fde7e5;color:var(--bad)}.chip.muted{background:#eef1f3;color:var(--muted)}
.sample{background:var(--goldtint);color:#6b4500;border-radius:8px;padding:8px 12px;font-size:14px;margin-top:12px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;margin-top:20px}
nav.toc{position:sticky;top:calc(var(--tb,100px) + 12px);align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - var(--tb,100px) - 24px);overflow:auto}
nav.toc a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;color:var(--dark);text-decoration:none;font:600 13.5px var(--fh)}
nav.toc a:hover{background:var(--tint)}
nav.toc a .no{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:11px;flex:none}
nav.toc a.todo{color:var(--muted)} nav.toc a.todo .no{background:#c5d0d6}
main{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--paper);border-radius:10px;padding:18px 20px;min-width:0}
details.panel summary{cursor:pointer;font:700 15px var(--fh);color:var(--dark)}
.checks li{margin:4px 0}
.sec{background:var(--paper);border-radius:10px;overflow:hidden;min-width:0}
.sec>header{display:flex;gap:14px;align-items:center;padding:16px 20px;background:var(--green);color:#fff}
.sec>header .no{font:800 28px var(--fh);color:var(--gold);line-height:1}
.sec>header h2{color:#fff;font-size:20px}
.sec>header p{margin:2px 0 0;font-size:13.5px;opacity:.9}
.sec>header svg{margin-left:auto;flex:none;opacity:.9}
.sec .body{padding:20px;display:flex;flex-direction:column;gap:22px}
.sec.todo .body{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .l{font:600 12px var(--fh);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:700 22px var(--fh);color:var(--dark);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.hero{background:var(--green);border-color:var(--green)} .kpi.hero .l,.kpi.hero .s{color:#cfe6d9} .kpi.hero .v{color:#fff}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:20px}
.grid2>*{min-width:0}
h3{font-size:15.5px;margin-bottom:10px}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.chartbox{position:relative;height:260px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.bar100{display:flex;height:34px;border-radius:6px;overflow:hidden;gap:2px;background:var(--paper)}
.bar100>div{min-width:2px;display:flex;align-items:center;justify-content:center;color:#fff;font:700 12px var(--fh);white-space:nowrap;overflow:hidden}
.ratios{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ratio{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ratio .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ratio .name{font:700 13.5px var(--fh);color:var(--dark)}
.ratio .val{font:700 24px var(--fh);font-variant-numeric:tabular-nums}
.ratio .scale{display:flex;gap:2px;height:6px}.ratio .scale span{flex:1;border-radius:2px;background:#e3e9ec}.ratio .scale span.on{background:var(--c)}
.ratio p{margin:0;font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:700 12px var(--fh);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.grp td{background:var(--tint);font:700 13.5px var(--fh);color:var(--green)}
tr.tot td{font-weight:700;border-top:2px solid var(--dark)}
td .note{display:block;font-size:12.5px;color:var(--muted);max-width:42ch}
td select{border:1px solid var(--line);border-radius:5px;padding:3px 4px;background:var(--paper);color:var(--ink);max-width:140px}
.switch{display:flex;gap:8px;align-items:center;font-size:14px}
.callout{border-left:4px solid var(--gold);background:var(--goldtint);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px}
.assm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px;margin-top:12px}
.assm label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
.assm input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--ink)}
.assm input.need{border-color:var(--bad);background:#fff7f6}
footer.tag{text-align:center;color:var(--muted);font:600 13px var(--fh);margin-top:30px}
.donut{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:center}.donut .chartbox{height:220px}
table.dleg{min-width:0}table.dleg td{overflow-wrap:anywhere;padding:6px 6px;border-bottom:1px solid var(--line)}table.dleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px}
.ratio .how{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.calc{font:700 16px var(--fh);color:var(--dark);padding:6px 0}
button.link{background:none;border:0;color:var(--green);font-weight:700;text-decoration:underline;cursor:pointer;padding:2px 4px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;font:600 13.5px var(--fh);color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected=true]{color:var(--green);border-color:var(--green)}
.assm select,.assm input{border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:var(--paper);color:var(--ink);font:15px var(--fb);height:36px}
.assm{align-items:end}
#selBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--dark);color:#fff;border-radius:10px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
#selBar .link{color:var(--gold)}
.sec,.panel{scroll-margin-top:calc(var(--tb,100px) + 12px)}
td.drag{cursor:grab;color:var(--muted);user-select:none;width:18px;padding-inline:6px;white-space:nowrap}
tr.over td{box-shadow:inset 0 2px var(--green)}
table.ed td:nth-child(2){width:22px}
.vf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;margin:12px 0}
.vf label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
.vf input,.vf select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--paper);color:var(--ink);height:34px}
.xl{font:13px/1.6 Consolas,'Courier New',monospace;background:#f3f7f5;border-radius:6px;padding:10px 12px;overflow-x:auto;white-space:pre}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
.scrolly{max-height:420px;overflow:auto}
.segbtn{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.segbtn button{border:0;background:var(--paper);padding:6px 12px;cursor:pointer;font:600 13px var(--fh);color:var(--muted)}.segbtn button[aria-pressed=true]{background:var(--green);color:#fff}
.ntool{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding:6px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--tint)}
.ntool button{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:4px 9px;cursor:pointer;font:13px var(--fb);color:var(--ink);min-width:30px}
.ntool button:hover{border-color:var(--green)}
#notes{min-height:160px;border:1px solid var(--line);border-radius:0 0 8px 8px;padding:10px 14px;font:15px/1.55 var(--fb);color:var(--ink);background:var(--paper);outline:none;overflow-wrap:anywhere}
#notes:focus{border-color:var(--green)} #notes h4{margin:8px 0 4px;font-size:15px} #notes ul,#notes ol{margin:4px 0;padding-left:22px}
.ws{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.ws button{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:6px;padding:6px 12px;font:600 13px var(--fh);cursor:pointer}
.ws button:hover,.ws button[aria-pressed=true]{background:var(--gold);color:var(--dark)}
.ws .cnt:not(:empty){background:var(--gold);color:var(--dark);border-radius:999px;padding:0 7px;margin-left:4px;font-size:11.5px}
.ws button[aria-pressed=true] .cnt{background:var(--dark);color:#fff}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);z-index:30;background:var(--paper);box-shadow:-8px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#drawer>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;background:var(--green);color:#fff}
#drawer>header h2{color:#fff;font-size:17px}#drawer>header button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;padding:2px 8px}
.drbody{flex:1;overflow:auto;padding:16px 18px 40px}
@media (min-width:1200px){body.dr .wrap{margin-right:640px;max-width:none}body.dr nav.toc{display:none}body.dr .layout{grid-template-columns:1fr}}
#modal{position:fixed;inset:0;z-index:40;background:rgba(57,41,62,.45);display:grid;place-items:center;padding:16px}
.mbox{background:var(--paper);border-radius:12px;width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox>header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.mbox>header h2{font-size:18px}.mbox .x{background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;padding:18px 20px}
.mform{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;align-content:start}
.mform label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}.mform label.full{grid-column:1/-1}
.mform input,.mform select,.mform textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--paper);color:var(--ink);font:15px var(--fb)}
.mform input:not([type=checkbox]),.mform select,.mform textarea{width:100%;min-width:0;box-sizing:border-box}.mform input[type=checkbox]{width:auto;flex:none}.mform>*{min-width:0}
.mform .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.mprev{background:var(--tint);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.mprev .r{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #c9dccf;font-size:14px}.mprev .r b{font-variant-numeric:tabular-nums}
.mprev .big{font:700 20px var(--fh);color:var(--green)}
.mfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.bt{border:1px solid var(--green);background:var(--paper);color:var(--green);border-radius:6px;padding:8px 16px;font:700 14px var(--fh);cursor:pointer}.bt.pri{background:var(--green);color:#fff}.bt.del{border-color:var(--bad);color:var(--bad)}
.glink{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--dark);cursor:pointer;text-align:left;text-decoration:underline dotted #9fb3a8;text-underline-offset:3px}
.glink:hover{color:var(--green)}.glink::after{content:" ✎";font-size:12px;color:var(--green)}
.addgoal{border:1px dashed var(--green);background:var(--tint);color:var(--green);border-radius:6px;padding:6px 12px;font:700 13px var(--fh);cursor:pointer}
.secbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
tr.off td{opacity:.5}
table.ed tr.new td{background:#eaf6ee} table.ed tr.new td:first-child{box-shadow:inset 4px 0 var(--green)}
.newtag{font:600 10.5px var(--fb);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
@media (max-width:700px){.mgrid{grid-template-columns:1fr}}
.hedit{margin-left:auto;background:var(--gold);color:var(--dark);border:0;border-radius:6px;padding:7px 12px;font:700 13px var(--fh);cursor:pointer;flex:none}
input.efin{width:110px;text-align:right;border:1px solid var(--line);border-radius:5px;padding:3px 5px}
.strip{display:flex;flex-wrap:wrap;gap:6px}
table.adj input{width:80px;border:1px solid var(--line);border-radius:5px;padding:3px 5px}table.adj select{max-width:90px}
td.due{color:var(--brown);font-weight:700}
table.ed input,table.ed select{width:100%;min-width:90px;border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--paper);color:var(--ink)}
table.ed input.n{text-align:right;font-variant-numeric:tabular-nums}
table.ed td.chg input,table.ed td.chg select{border-color:var(--gold);background:var(--goldtint)}
table.ed .was{display:block;font-size:11.5px;color:#7a4d00}
table.ed td.drag,table.ed th:first-child{width:20px}table.ed td:nth-child(2),table.ed th:nth-child(2){width:26px}
table.ed input[type=text]:not(.money){min-width:170px}
table.ed tr.flash td{background:var(--goldtint)}
/* Tables: boxed grid with column rules, zebra rows, sortable headers */
.tbl{border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.tbl th{background:#eef5f1;color:var(--dark);border-bottom:1px solid #c9dccf;padding:9px 10px;vertical-align:bottom}
.tbl th,.tbl td{border-right:1px solid var(--line)}.tbl th:last-child,.tbl td:last-child{border-right:0}
.tbl td{padding:8px 10px}
.tbl tbody tr:nth-child(even):not(.grp):not(.tot)>td{background:#f8fbf9}
.tbl tbody tr:not(.grp):not(.tot):hover>td{background:#eef6f1}
.tbl tbody tr:last-child>td{border-bottom:0}
.tbl tr.tot>td{background:var(--tint);border-top:2px solid var(--green);color:var(--dark)}
.tbl tr.flash>td{background:var(--goldtint)!important}.tbl tr.new>td{background:#eaf6ee}
.scrolly thead th{position:sticky;top:0;z-index:1}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{background:#e1eee6}
th .si{margin-left:4px;font-size:10px;color:#9fb3a8;white-space:nowrap}th[aria-sort] .si{color:var(--green)}
/* Trace to source (Ctrl+[) */
/* Linked figures: blue like an Excel link, underline on hover */
td.hasref{color:#1d5f8f;cursor:pointer}td.hasref b{color:inherit}td.hasref:hover{text-decoration:underline;text-underline-offset:3px}
.tbl tbody tr>td.hasref:hover{background:#e8f1f8}
.kpi.hasref{cursor:pointer}.kpi.hasref .v{color:#1d5f8f}.kpi.hero.hasref .v{color:#fff}.kpi.hasref:hover{border-color:#2F86BC}
.kpi.hasref .l::after{content:" ↗";color:#2F86BC;font-weight:700}.kpi.hero.hasref .l::after{color:var(--gold)}
.trsel{outline:2px solid var(--gold)!important;outline-offset:-2px}
.trflash,.tbl tbody tr>td.trflash{animation:trf 1.8s ease-out}
@keyframes trf{0%,45%{background:#FBE3A6;box-shadow:inset 0 0 0 2px var(--gold)}100%{}}
#trBar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--dark);color:#fff;border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13.5px;max-width:min(560px,calc(100% - 32px));box-shadow:0 6px 20px rgba(0,0,0,.25)}
#trBar button{background:var(--gold);color:var(--dark);border:0;border-radius:6px;padding:5px 10px;font:700 12.5px var(--fh);cursor:pointer}#trBar button.ghost{background:none;color:#fff;border:1px solid rgba(255,255,255,.4)}
kbd{font:700 11px var(--fh);border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.8}
/* Edit goals grid + Section 6 */
.mbox.wide{width:min(1200px,100%)}
table.bulk input,table.bulk select{width:100%;min-width:64px;border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--paper);color:var(--ink);font:14px var(--fb)}
table.bulk input.n{text-align:right}table.bulk td.c input{width:auto;min-width:0}table.bulk .gname{min-width:160px}table.bulk select[data-f=month]{min-width:112px}table.bulk tr.del>td:last-child{opacity:1;text-decoration:none}table.bulk td.calc .note{font-weight:400;text-align:right;max-width:none}
table.bulk tr.del>td{opacity:.45;text-decoration:line-through}table.bulk td.calc{font-weight:700;color:var(--green);white-space:nowrap;text-align:right}
.scctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 18px;background:var(--tint);border-radius:8px;padding:12px 14px}
.scctl label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
.scctl input,.scctl select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--paper);color:var(--ink);font:14px var(--fb)}
.scctl .row{display:flex;gap:8px;align-items:center}.scctl .row input{width:70px}.scctl .chk{flex-direction:row;gap:6px;align-items:center;color:var(--ink)}
table.sc{font-size:13.5px}table.sc th{min-width:96px}table.sc td:first-child{min-width:150px}table.sc th .note{display:block;font:400 12px var(--fb);text-transform:none;letter-spacing:0;color:var(--muted)}
td.best{box-shadow:inset 0 -3px var(--gold)}

/* Display amounts: calculated figures round UP (₹10,000+ to the next ₹1,000, smaller to the next ₹100). FP.inrx = exact, for data entry and checks */

FP.evalExpr = t => { let i = 0; const pk = () => t[i];
  const atom = () => { if (pk() === '(') { i++; const v = add(); if (t[i++] !== ')') throw 0; return v; } if (pk() === '-') { i++; return -atom(); } if (pk() === '+') { i++; return atom(); } const m = /^\d*\.?\d+/.exec(t.slice(i)); if (!m) throw 0; i += m[0].length; return +m[0]; };
  const mul = () => { let v = atom(); while (pk() === '*' || pk() === '/') { const o = t[i++], r = atom(); v = o === '*' ? v * r : v / r; } return v; };

  { no: 8, id: 'allocation', title: 'Asset Allocation', sub: 'Mix based on your risk profile' },
  { no: 9, id: 'action', title: 'Action Steps', sub: 'What to do, and when' }

  const life = rows(10, 30).filter(r => t(IN, 'C' + r)).map(r => ({ row: r, type: r < 19 ? 'Traditional' : r < 27 ? 'ULIP' : 'Term', company: t(IN, 'C' + r), insured: t(IN, 'D' + r), sa: n(IN, 'I' + r), prem: n(IN, 'J' + r), mode: t(IN, 'K' + r), annual: n(IN, 'T' + r) || n(IN, 'J' + r), maturity: n(IN, 'Q' + r) || null, note: t(IN, 'R' + r) }));

    liabs: items(NW, 40, 61, 'C', 'D', null, ['E', 'F']),
    nwSheet: { assets: n(NW, 'D38'), liabs: n(NW, 'D62') },
    inflows: items(CF, 9, 26, 'C', 'D', 'E', ['F', 'G']),
    outflows: items(CF, 29, 74, 'C', 'D', 'E', ['F', 'G']),
    life, health: pol([33, 34], 'Health'), general: [...pol([38, 39], 'Property'), ...pol([43, 44], 'Disability/CI/PA'), ...pol([48], 'Vehicle')],
    loans,

  };
};

/* ---------- State (per client, kept in this browser only) ---------- */
FP.defaults = () => ({ planMonth: new Date().toISOString().slice(0, 7), assm: {}, nw: {}, cf: { epfOutside: true } });
FP.load = () => { FP.hist = { u: [], r: [] }; let s = null; try { s = JSON.parse(localStorage.getItem('fp:' + FP.key)); } catch (e) { } FP.st = Object.assign(FP.defaults(), s || {});  };
FP.save = () => { try { localStorage.setItem('fp:' + FP.key, JSON.stringify(FP.st)); } catch (e) { } };
/* Re-render after a change, keeping scroll position and moving focus where Tab/click sent it */
/* Undo / redo (Ctrl+Z, Ctrl+Y): every change goes through FP.set, so a snapshot before each one is enough */
FP.hist = { u: [], r: [] };
FP.restore = (snap, msg) => { const y = scrollY, dy = $('#drBody')?.scrollTop || 0; FP.st = JSON.parse(snap); FP.save(); FP.render(); scrollTo(0, y); if ($('#drBody')) $('#drBody').scrollTop = dy; FP.toast(msg); };
FP.undo = redo => { const a = redo ? FP.hist.r : FP.hist.u, b = redo ? FP.hist.u : FP.hist.r; if (!a.length) { FP.toast(redo ? 'Nothing to redo' : 'Nothing to undo'); return; } b.push(JSON.stringify(FP.st)); FP.restore(a.pop(), redo ? 'Redone' : 'Undone · Ctrl+Y to redo'); };
FP.toast = msg => { let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'noprint'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(FP.toast.h); FP.toast.h = setTimeout(() => t.hidden = true, 1800); };
FP.set = fn => { FP.hist.u.push(JSON.stringify(FP.st)); if (FP.hist.u.length > 80) FP.hist.u.shift(); FP.hist.r = []; const y = scrollY, dy = $('#drBody')?.scrollTop || 0; fn(FP.st); FP.save(); setTimeout(() => { const id = document.activeElement?.id; FP.render(); scrollTo(0, y); if ($('#drBody')) $('#drBody').scrollTop = dy; const el = id && document.getElementById(id); if (el) el.focus({ preventScroll: true }); }, 0); };
FP.planDate = () => { const [y, m] = FP.st.planMonth.split('-').map(Number); return new Date(y, m - 1, 1); };
FP.age = (dob, at = FP.planDate()) => dob ? Math.floor((at - dob) / 3.15576e10) : null;

/* ---------- Charts ---------- */

FP.legend = (labels, vals, cols) => `<div class="legend">${labels.map((l, i) => `<span><i style="background:${cols ? cols[i] : FP.COLORS[i % 6]}"></i>${FP.esc(l)} <b>${vals ? FP.short(vals[i]) : ''}</b></span>`).join('')}</div>`;
/* Ratio card. bands: [{max, label, tone}] ascending; tone good|warn|bad. how = formula shown on screen only */
FP.ratio = (name, val, display, bands, note, how) => {
  const i = Math.max(0, bands.findIndex(b => val <= b.max)); const b = bands[i] || bands[bands.length - 1];
  const tone = { good: 'var(--good)', warn: 'var(--warn)', bad: 'var(--bad)' }[b.tone];
  return `<div class="ratio" style="--c:${tone}"><div class="top"><span class="name">${name}</span><span class="chip ${b.tone === 'good' ? '' : b.tone}">${b.label}</span></div>
  <div class="val" style="color:${tone}">${display}</div><div class="scale">${bands.map((x, j) => `<span class="${j === i ? 'on' : ''}" title="${x.label}"></span>`).join('')}</div><p>${note}</p>${how ? `<p class="how noprint">${how}</p>` : ''}</div>`;
};
FP.kpi = (l, v, s, hero) => `<div class="kpi${hero ? ' hero' : ''}"><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
/* Donut with % legend; hover a slice to see the items inside it. segs: [{n, v, c, items:[[label, value]]}] */
FP.donut = (id, segs, total, label) => `<div class="donut"><div class="chartbox"><canvas id="${id}" role="img" aria-label="${label}"></canvas></div>
  <table class="dleg"><tbody>${segs.map(s => `<tr><td><i style="background:${s.c}"></i>${FP.esc(s.n)}</td><td class="n">${FP.pct(s.v / total, 1)}</td><td class="n">${FP.short(s.v)}</td></tr>`).join('')}</tbody></table></div>
  <p class="hint noprint">Hover a slice to see exactly which items are counted in it.</p>`;
FP.donutDraw = (id, segs, total) => FP.chart(id, { type: 'doughnut', data: { labels: segs.map(s => s.n), datasets: [{ data: segs.map(s => s.v), backgroundColor: segs.map(s => s.c), borderColor: '#fff', borderWidth: 2 }] },
  options: { maintainAspectRatio: false, cutout: '60%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: t => `${t.label}: ${FP.pct(t.raw / total, 1)} · ${FP.short(t.raw)}`, afterBody: t => (segs[t[0].dataIndex].items || []).map(([l, v]) => `• ${l}: ${FP.short(v)}`) } } } } });

/* Return rates as decimals; post-retirement = 60% equity + 40% debt */
FP.DEF = { retEq: 60, rDebt: 5, rHybrid: 8, rEquity: 10, infl: 7, inflEdu: 10, inflMarriage: 8, lifeExp: 85 };
FP.pctOf = x => { const v = FP.st.assm[x]; if (v !== '' && v != null) return +v; if (x === 'salaryInc') return FP.base.salaryInc ?? 7; if (x === 'stepUp') return FP.pctOf('salaryInc'); return FP.DEF[x]; };
FP.rate = k => k === 'rPost' ? (FP.pctOf('retEq') * FP.pctOf('rEquity') + (100 - FP.pctOf('retEq')) * FP.pctOf('rDebt')) / 1e4 : k === 'lifeExp' ? FP.pctOf(k) : FP.pctOf(k) / 100;

/* Emergency fund goal: months of spending (household + EMIs + premiums; savings left out), unless an amount is typed in */
FP.efAuto = (d, st, g) => (st.goals || {})[g.name]?.efAuto !== false;
FP.efMonths = (st, g) => (st.goals || {})[g.name]?.efMonths ?? 6;
FP.efAmt = (d, st, g) => FP.efAuto(d, st, g) ? FP.calc.cf(d, st).t.spend * FP.efMonths(st, g) : g.amt;
/* ---------- Shell rendering ---------- */
FP.checkKey = c => (c.sec + '|' + String(c.msg)).replace(/<[^>]+>/g, '').slice(0, 300);
FP.render = () => {
  const st = FP.st; FP.d = Object.assign({}, FP.base, st.ed || {}); const d = FP.d;
  ['children', 'others'].forEach(k => { if (st.ed?.[k]) d[k] = st.ed[k].map(x => ({ ...x, dob: x.dob ? new Date(x.dob) : null })); });   /* edited family rows keep dates as text in the saved state */
  /* Profile corrections (Client data → Profile) */
  ['self', 'spouse'].forEach(w => { const o = st.ed?.profile?.[w]; if (!o || !d[w]) return; const p = d[w] = { ...d[w], ...o };
    if (o.dobTxt != null) { const m = /^(\d{1,2})\D(\d{1,2})\D(\d{4})$/.exec(o.dobTxt.trim()); if (m) p.dob = new Date(+m[3], m[2] - 1, +m[1]); }
    p.name = [p.first, p.middle, p.last].map(x => String(x || '').trim()).filter(Boolean).join(' ') || p.name; });
  document.body.classList.toggle('pa', !!st.appendix);
  $('#planMonth').value = st.planMonth; $('#appendix').checked = !!st.appendix;
  const fam = [d.self, d.spouse].filter(Boolean).map(p => `<span class="chip">${FP.esc(p.name)} · ${FP.age(p.dob) ?? '—'} yrs</span>`).concat(d.children.map(c => `<span class="chip muted">${FP.esc(c.name)} · ${c.rel || 'Child'} · ${FP.age(c.dob) ?? '—'} yrs</span>`), d.others.map(c => `<span class="chip muted">${FP.esc(c.name)} · ${c.rel || ''}</span>`)).join('');
  const names = [d.self, d.spouse].filter(Boolean).map(p => p.first || p.name).join(' & ');
  $('#cover').innerHTML = `<div><div class="eyebrow">Financial Blueprint</div><h1>${FP.esc(names)}</h1><div class="family">${fam}</div>
    ${d.sample ? '<div class="sample">Sample family with made-up numbers. Upload a client\'s data-collection Excel to build their plan.</div>' : ''}</div>
    <div class="hint" style="text-align:right">Plan date<br><b style="font:700 18px var(--fh);color:var(--dark)">${FP.dmy(FP.planDate())}</b><br>Risk profile: <b>${FP.esc(d.other.risk || '—')}</b></div>`;
  $('#toc').innerHTML = FP.PLAN.map(p => `<a href="#${p.id}" class="${FP.sec[p.id] ? '' : 'todo'}"><span class="no">${p.no}</span>${p.title}</a>`).join('') ;
  FP.renderAssm();
  const checks = [];
  $('#sections').innerHTML = FP.PLAN.map(p => `<section class="sec${FP.sec[p.id] ? '' : ' todo'}" id="${p.id}"><header><span class="no">${String(p.no).padStart(2, '0')}</span><div><h2>${p.title}</h2><p>${p.sub}</p></div>${p.edit ? `<button class="hedit noprint" data-edit="${p.edit}">Edit ${p.edit.toLowerCase()} data</button>` : FP.svg(p.id)}</header><div class="body">${FP.sec[p.id] ? '' : '<p>This section is being built next.</p>'}</div></section>`).join('');
  FP.PLAN.forEach(p => { const s = FP.sec[p.id]; if (!s) return; try { s.render($('#' + p.id + ' .body'), d, st); (s.checks?.(d, st) || []).forEach(c => checks.push({ ...c, sec: p.title })); } catch (e) { console.error(e); $('#' + p.id + ' .body').innerHTML = '<p class="callout">This section could not be calculated: ' + FP.esc(e.message) + '</p>'; } });
  const dis = st.dismiss || {}, open = checks.filter(c => !dis[FP.checkKey(c)]), nDis = checks.length - open.length;
  $('#checks').innerHTML = `<h3>Data checks ${open.length ? `<span class="chip warn">${open.length} to review</span>` : '<span class="chip">All clear</span>'}</h3>
    ${open.length ? `<ul class="checks">${open.map(c => `<li><button class="x" data-clr="${FP.esc(FP.checkKey(c))}" title="Mark as reviewed and hide" aria-label="Clear this check">✕</button><span><b>${c.sec}:</b> ${c.msg} ${c.list ? `<button class="link" data-l="${c.list}" data-i="${c.i}">Edit</button>` : ''}</span></li>`).join('')}</ul>` : '<p class="hint">Nothing unusual in the data.</p>'}
    ${nDis ? `<p class="hint">${nDis} cleared by you. <button class="link" id="chkRestore">Show them again</button></p>` : ''}
    <p class="hint">Shown on screen only. Not printed. A check also clears by itself once the data behind it is corrected.</p>`;
  $('#checks').querySelectorAll('[data-clr]').forEach(b => b.onclick = () => FP.set(s => { s.dismiss = { ...(s.dismiss || {}), [b.dataset.clr]: true }; }));
  $('#chkRestore')?.addEventListener('click', () => FP.set(s => { delete s.dismiss; }));
  $('#checks').querySelectorAll('button.link[data-l]').forEach(b => b.onclick = () => b.dataset.l === 'goals' ? FP.openGoal(d.goals[+b.dataset.i]?.name) : FP.editRow(b.dataset.l, +b.dataset.i));
  $('#chkCount').textContent = open.length || '';
  $('#sections').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => FP.openData(b.dataset.edit));
  FP.renderEditor?.(); FP.renderVerify?.();
  const nt = $('#notes'); if (document.activeElement !== nt) nt.innerHTML = st.notes || ''; $('#notesHint').textContent = nt.textContent.trim() ? '•' : '';
};
FP.renderAssm = () => {
  const a = FP.st.assm, f = (k, l) => `<label for="a_${k}">${l}<input id="a_${k}" type="number" step="0.1" data-k="${k}" value="${a[k] ?? ''}" placeholder="${k === 'lifeExp' || k === 'retEq' ? FP.pctOf(k) : +(FP.rate(k) * 100).toFixed(2)}"></label>`;
  const rp = FP.rate('rPost');
  $('#assm').innerHTML = `<p class="hint">All rates are % per year. Grey values are the defaults; type over any of them for this client. Step-up follows income growth unless you set it. Income growth is read from the salary comment in the Excel (e.g. "5% increment"), else 7%.</p>
  <div class="assm">${f('infl', 'General inflation')}${f('inflEdu', 'Education inflation')}${f('inflMarriage', 'Marriage inflation')}

/* Workspace drawer (right side) */
FP.PANES = { dataPanel: 'Client data', assmPanel: 'Assumptions', checksPane: 'Data checks', notesPanel: 'Discussion notes', verifyPanel: 'Verify calculations' };
FP.openDrawer = p => {
  const dr = $('#drawer'); if (!dr.hidden && FP.pane === p) return FP.closeDrawer(); FP.pane = p; dr.hidden = false; document.body.classList.add('dr');
  dr.querySelectorAll('section[data-pane]').forEach(s => s.hidden = s.dataset.pane !== p); $('#drTitle').textContent = FP.PANES[p]; $('#drBody').scrollTop = 0;
  document.querySelectorAll('.ws button').forEach(b => b.setAttribute('aria-pressed', b.dataset.pane === p)); FP.charts && Object.values(FP.charts).forEach(ch => ch.resize?.());
};
FP.closeDrawer = () => { $('#drawer').hidden = true; FP.pane = null; document.body.classList.remove('dr'); document.querySelectorAll('.ws button').forEach(b => b.setAttribute('aria-pressed', false)); setTimeout(() => Object.values(FP.charts).forEach(ch => ch.resize?.()), 0); };
FP.boot = () => {
  document.querySelectorAll('.ws button').forEach(b => b.onclick = () => FP.openDrawer(b.dataset.pane));
  $('#drClose').onclick = FP.closeDrawer;
  /* Ctrl+Z / Ctrl+Y: text you are still typing undoes natively; otherwise the last change to the plan is undone */
  const dirty = el => el?.matches?.('textarea,[contenteditable],[contenteditable] *') || (el?.matches?.('input:not([type=checkbox]):not([type=file])') && (el.classList.contains('money') ? FP.num(el.value) !== +(el.dataset.raw ?? 0) : el.value !== el.defaultValue));
  addEventListener('keydown', e => { if (!(e.ctrlKey || e.metaKey) || e.altKey || !$('#modal').hidden || dirty(document.activeElement)) return; const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); FP.undo(false); } else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); FP.undo(true); } });
  /* Enter saves a pop-up (except in comment boxes); in the side panel Enter commits the cell and moves down, like Excel */
  addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.shiftKey || e.ctrlKey || e.altKey || e.isComposing) return; const t = e.target;
    if (!t.matches?.('input:not([type=checkbox]):not([type=file]),select') ) return;
    if (!$('#modal').hidden && t.closest('#modal')) { const b = $('#mbox .mfoot .bt.pri'); if (!b) return; e.preventDefault(); t.blur(); setTimeout(() => b.click(), 0); return; }
    if (t.closest('#drawer')) { e.preventDefault(); const td = t.closest('td'), tr = td?.parentElement, nx = tr?.nextElementSibling && FP.cellAt?.(tr.nextElementSibling, FP.colOf(td)); const id = nx?.querySelector('input,select')?.id; t.blur(); if (id) setTimeout(() => document.getElementById(id)?.focus(), 30); return; }
    if (t.closest('section.sec')) { e.preventDefault(); t.blur(); }
  });
  addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!$('#modal').hidden) FP.closeModal?.(); else if (!$('#drawer').hidden) FP.closeDrawer(); });
  FP.base = FP.SAMPLE; FP.key = 'sample'; FP.load(); FP.render();
  $('#notes').oninput = e => { FP.st.notes = e.target.innerHTML; FP.save(); };
  document.querySelectorAll('.ntool button').forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => { $('#notes').focus(); document.execCommand('styleWithCSS', false, true); document.execCommand(b.dataset.cmd, false, b.dataset.val || null); FP.st.notes = $('#notes').innerHTML; FP.save(); }; });
  $('#uploadBtn').onclick = () => $('#file').click();
  $('#planMonth').onchange = e => e.target.value && FP.set(s => s.planMonth = e.target.value);
  $('#appendix').onchange = e => FP.set(s => s.appendix = e.target.checked);
  FP.loadFile = async f => {
    try {
      if (/\.json$/i.test(f.name) && FP.restoreFile) return FP.restoreFile(f);
      if (!/\.xlsx?$/i.test(f.name)) throw new Error(`"${f.name}" isn't an Excel or plan file. Use the .xlsx data-collection template or a Blueprint plan file (.json).`);
      const wb = XLSX.read(await f.arrayBuffer(), { cellDates: true });
      if (!wb.Sheets['Net Worth'] || !wb.Sheets['Inflows and Outflows']) throw new Error('This file is missing the "Net Worth" or "Inflows and Outflows" tab. Upload the Abundance data-collection template.');
      FP.base = FP.parse(wb); FP.key = (wb.Sheets['About You']?.C17?.v || FP.base.self?.name || f.name).toString().trim();
      FP.load(); FP.render(); scrollTo(0, 0); FP.onFile?.(f);
    } catch (err) { $('#checks').innerHTML = `<p class="callout"><b>Couldn't read that file.</b> ${FP.esc(err.message)}</p>`; }
  };
  $('#file').onchange = e => { const f = e.target.files[0]; if (f) FP.loadFile(f); e.target.value = ''; };
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) FP.loadFile(f); });
};

</script>
<script data-src="s1-networth.js">
/* Section 1 — Net Worth */
(() => {
  const CLASSES = ['Equity', 'Gold', 'Debt', 'Real estate', 'Cash', 'Others'];
  const MAP = [
    [/^cash$|savings account/i, 'Cash', 'Personal', true],
    [/\bfd\b|\brd\b|post office/i, 'Debt', 'Investable', true],
    [/mutual fund.*debt/i, 'Debt', 'Investable', true],
    [/ppf|epf|nsc|bond|endowment|ulip/i, 'Debt', 'Investable', false],
    [/mutual fund.*equity|share|stock/i, 'Equity', 'Investable', false],
    [/house.*own/i, 'Real estate', 'Personal', false],
    [/house|land|plot|site/i, 'Real estate', 'Investable', false],
    [/jewel/i, 'Gold', 'Personal', false],
    [/gold|silver|commodit/i, 'Gold', 'Investable', false],
    [/vehicle|car|rent deposit/i, 'Others', 'Personal', false]
  ];
  const EFDEF = /^cash$|savings account|\bfd\b|\brd\b|post office/i;
  const guess = l => { const m = MAP.find(x => x[0].test(l)); return m ? { cls: m[1], use: m[2], liquid: m[3] } : { cls: 'Others', use: 'Investable', liquid: false }; };

  FP.calc.nw = (d, st) => {
    const rows = d.assets.filter(a => a.m).map(a => { const o = st.nw[a.label] || {}; const r = { ...a, ...guess(a.label), ...o }; r.ef = Math.min(o.ef ?? (EFDEF.test(a.label) ? a.m : 0), a.m); return r; });
    const sum = f => rows.filter(f).reduce((s, r) => s + r.m, 0);
    const total = sum(() => true), liabs = d.liabs.reduce((s, l) => s + l.m, 0);
    const byClass = CLASSES.map(c => sum(r => r.cls === c));
    return { rows, total, liabs, net: total - liabs, invest: sum(r => r.use === 'Investable'), personal: sum(r => r.use === 'Personal'), liquid: sum(r => r.liquid), ef: rows.reduce((s, r) => s + r.ef, 0), byClass };
  };

  const loanFor = (d, label) => {
    const k = /hous|home/i.test(label) ? /hous|home/i : /vehicle|auto|car/i.test(label) ? /auto|vehicle|car/i : /personal/i.test(label) ? /personal/i : /credit/i.test(label) ? /credit/i : null;
    return k ? d.loans.filter(l => k.test(l.desc)) : [];
  };

  FP.sec.networth = {
    checks(d, st) {
      const c = FP.calc.nw(d, st), out = [];
      if (!st.ed?.assets && d.nwSheet.assets && Math.abs(d.nwSheet.assets - c.total) > 1) out.push({ msg: `Asset total in the sheet (${FP.inr(d.nwSheet.assets)}) doesn't match the sum of rows (${FP.inr(c.total)}). The tool uses the row sum.` });
      /* Clears once the value or comment is corrected in Client data */
      const fixed = a => st.ed?.assets && a._o != null && FP.base.assets[a._o] && (FP.base.assets[a._o].m !== a.m || FP.base.assets[a._o].note !== a.note);
      d.assets.forEach((a, i) => /not updated|not sure|have not/i.test(a.note) && !fixed(a) && out.push({ list: 'assets', i, msg: `"${FP.esc(a.label)}" is marked by the client as possibly outdated: "${FP.esc(a.note)}".` }));
      d.liabs.forEach((l, i) => { if (!l.m) return; const ls = loanFor(d, l.label); const o = ls.reduce((s, x) => s + x.out, 0); if (ls.length && Math.abs(o - l.m) > 1) out.push({ list: 'liabs', i, msg: `${FP.esc(l.label)}: ${FP.inr(l.m)} in Net Worth vs ${FP.inr(o)} outstanding in Loan Details.` }); });
      return out;
    },
    render(el, d, st) {
      const c = FP.calc.nw(d, st);
      const solv = c.liabs ? c.total / c.liabs : Infinity, dta = c.total ? c.liabs / c.total : 0, lq = c.total ? c.liquid / c.total : 0;
      const segs = CLASSES.map((n, i) => ({ n, v: c.byClass[i], c: FP.COLORS[i], items: c.rows.filter(r => r.cls === n).map(r => [r.label, r.m]) })).filter(x => x.v > 0);
      const opt = (arr, v) => arr.map(o => `<option${o === v ? ' selected' : ''}>${o}</option>`).join('');
      const idx = new Map(c.rows.map((r, i) => [r, i]));
      el.innerHTML = `
      <div class="kpis">${FP.kpi('Net worth', FP.short(c.net), 'Assets minus liabilities', 1)}${FP.kpi('Total assets', FP.short(c.total))}${FP.kpi('Liabilities', FP.short(c.liabs), c.liabs ? FP.pct(dta) + ' of assets' : 'Debt-free')}${FP.kpi('Current financial resources', FP.short(c.invest), FP.pct(c.total ? c.invest / c.total : 0, 0) + ' of assets · usable for goals')}</div>
      <div class="grid2">
        <div><h3>What your assets are made of</h3>${FP.donut('nwDonut', segs, c.total, 'Assets by class')}</div>
        <div><h3>Working money vs lifestyle assets</h3>
          <table class="dleg"><tbody><tr><td><i style="background:var(--green)"></i>Current financial resources</td><td class="n">${FP.pct(c.invest / c.total, 1)}</td><td class="n">${FP.short(c.invest)}</td></tr>
          <tr><td><i style="background:var(--brown)"></i>Personal use${c.rows.some(r => r.use === 'Personal') ? ` (${c.rows.filter(r => r.use === 'Personal').map(r => FP.esc(r.label.replace(/\s*\(.*?\)|\s*-\s*own use|value of the /gi, ''))).join(', ')})` : ''}</td><td class="n">${FP.pct(c.personal / c.total, 1)}</td><td class="n">${FP.short(c.personal)}</td></tr></tbody></table>
          <p class="hint">Only current financial resources are used to fund goals in Section 4.</p>
          <h3 style="margin-top:18px">Liabilities</h3>
          ${d.liabs.filter(l => l.m).map(l => { const ls = loanFor(d, l.label); return `<div style="display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:6px 0"><span>${FP.esc(l.label)}${ls.map(x => `<span class="hint" style="display:block;margin:0">${FP.esc(x.inst)} · ${FP.pct(x.rate, 2)} · EMI ${FP.inr(x.emi)} · closes ${x.closeYear || '—'}</span>`).join('')}</span><b class="num">${FP.inr(l.m)}</b></div>`; }).join('') || '<p class="hint">No liabilities.</p>'}
        </div>
      </div>
      <div><h3>Health check</h3><div class="ratios">
        ${FP.ratio('Liquidity', lq, FP.pct(lq, 0), [{ max: .2, label: 'Low', tone: 'bad' }, { max: .6, label: 'Good', tone: 'good' }, { max: Infinity, label: 'Excellent', tone: 'good' }], 'Share of assets you can access within days.', `Liquid assets ÷ total assets = ${FP.short(c.liquid)} ÷ ${FP.short(c.total)}. Liquid = rows ticked “Liquid” below. Bands: under 20% low, 20–60% good, over 60% excellent.`)}
        ${FP.ratio('Solvency', solv, isFinite(solv) ? solv.toFixed(1) + '×' : 'No debt', [{ max: 1, label: 'Poor', tone: 'bad' }, { max: 5, label: 'Good', tone: 'good' }, { max: Infinity, label: 'Excellent', tone: 'good' }], 'How many times your assets cover everything you owe.', `Total assets ÷ total liabilities = ${FP.short(c.total)} ÷ ${FP.short(c.liabs)}. Bands: under 1× poor, 1–5× good, over 5× excellent.`)}
        ${FP.ratio('Debt to assets', dta, FP.pct(dta, 0), [{ max: .3, label: 'Healthy', tone: 'good' }, { max: .5, label: 'Watch', tone: 'warn' }, { max: Infinity, label: 'High', tone: 'bad' }], 'Portion of your assets funded by loans.', `Total liabilities ÷ total assets. Bands: up to 30% healthy, 30–50% watch, over 50% high.`)}
      </div></div>
      <div class="appendix"><h3>Asset details by class</h3><p class="hint noprint">Change the class, use or liquidity of any asset if the default doesn't fit. Emergency fund ₹ sets aside part or all of an asset for emergencies; it defaults to savings and FDs. To change a value, use Client data.</p>
      <div class="tbl"><table><thead><tr><th>Asset</th><th class="n">Value</th><th class="n">Share</th><th class="noprint">Class</th><th class="noprint">Use</th><th class="noprint">Liquid</th><th class="noprint n">Emergency fund ₹</th></tr></thead><tbody>
      ${segs.map(g => `<tr class="grp"><td>${g.n}</td><td class="n">${FP.inr(g.v)}</td><td class="n">${FP.pct(g.v / c.total, 1)}</td><td class="noprint" colspan="4"></td></tr>` + c.rows.filter(r => r.cls === g.n).map(r => { const i = idx.get(r); return `<tr><td>${FP.esc(r.label)}${r.note ? `<span class="note">${FP.esc(r.note)}</span>` : ''}</td><td class="n">${FP.inr(r.m)}</td><td class="n">${FP.pct(r.m / c.total, 1)}</td>
        <td class="noprint"><select data-i="${i}" data-f="cls" aria-label="Class for ${FP.esc(r.label)}">${opt(CLASSES, r.cls)}</select></td>
        <td class="noprint"><select data-i="${i}" data-f="use" aria-label="Use for ${FP.esc(r.label)}">${opt(['Investable', 'Personal'], r.use)}</select></td>
        <td class="noprint"><input type="checkbox" data-i="${i}" data-f="liquid" ${r.liquid ? 'checked' : ''} aria-label="Liquid"></td>
        <td class="noprint"><input type="text" inputmode="decimal" class="efin money" id="ef_${i}" data-i="${i}" data-f="ef" data-raw="${r.ef}" value="${FP.inrx(r.ef)}" aria-label="Emergency fund amount from ${FP.esc(r.label)}"></td></tr>`; }).join('')).join('')}
      <tr class="tot"><td>Total assets</td><td class="n">${FP.inr(c.total)}</td><td class="n">100%</td><td class="noprint" colspan="4"></td></tr></tbody></table></div></div>`;
      el.querySelectorAll('[data-f]').forEach(x => x.onchange = () => { const r = c.rows[x.dataset.i]; FP.set(s => { s.nw[r.label] = { cls: r.cls, use: r.use, liquid: r.liquid, ef: r.ef, [x.dataset.f]: x.type === 'checkbox' ? x.checked : x.dataset.f === 'ef' ? Math.max(0, FP.num(x.value)) : x.value }; }); });
      FP.donutDraw('nwDonut', segs, c.total);
    }
  };
})();

</script>
<script data-src="s2-cashflow.js">
/* Section 2 — Cash Flow */
(() => {
  const GROUPS = [
    { k: 'living', n: 'Household & lifestyle', c: '#A3502F' },
    { k: 'emi', n: 'Loan EMIs', c: '#8A5FA0' },
    { k: 'ins', n: 'Insurance premiums', c: '#2F86BC' },
    { k: 'sav', n: 'Committed savings', c: '#1E7A46' }
  ];
  const grp = l => /liquid fund|\bsip\b|\brd\b|ppf|epf|nps|sukanya|recurring/i.test(l) ? 'sav' : /insurance|ulip|premium/i.test(l) ? 'ins' : /loan|emi|repay/i.test(l) ? 'emi' : 'living';
  const mo = x => x.y > 0 ? x.y / 12 : x.m;

  FP.calc.cf = (d, st) => {
    const isEpf = x => /epf/i.test(x.label);
    const epf = d.outflows.filter(isEpf).reduce((s, x) => s + mo(x), 0);
    const out = d.outflows.filter(x => mo(x) > 0 && !(st.cf.epfOutside && isEpf(x))).map(x => ({ ...x, g: grp(x.label), pm: mo(x) }));
    const inc = d.inflows.filter(x => mo(x) > 0).map(x => ({ ...x, pm: mo(x) }));
    const t = { inc: inc.reduce((s, x) => s + x.pm, 0) };
    GROUPS.forEach(g => t[g.k] = out.filter(x => x.g === g.k).reduce((s, x) => s + x.pm, 0));
    t.spend = t.living + t.emi + t.ins; t.surplus = t.inc - t.spend - t.sav;
    return { inc, out, t, epf };
  };

  FP.sec.cashflow = {
    checks(d, st) {
      const o = [];
      ['inflows', 'outflows'].forEach(k => d[k].forEach((x, i) => { if (x.m && x.y && Math.abs(x.m * 12 - x.y) / x.y > .01) o.push({ list: k, i, msg: `${FP.esc(x.label)}: monthly ${FP.inr(x.m)} × 12 ≠ yearly ${FP.inr(x.y)}. Using yearly ÷ 12 = ${FP.inr(x.y / 12)}.` }); }));
      const c = FP.calc.cf(d, st); if (c.t.surplus < 0) o.push({ msg: `Monthly outflows exceed income by ${FP.inr(-c.t.surplus)}.` });
      return o;
    },
    render(el, d, st) {
      const { out, t, epf } = FP.calc.cf(d, st), nw = FP.calc.nw(d, st);
      const items = k => out.filter(x => x.g === k).sort((a, b) => b.pm - a.pm).map(x => [x.label, x.pm]);
      const segs = [...GROUPS.map(g => ({ n: g.n, v: t[g.k], c: g.c, items: items(g.k) })), { n: 'Free surplus', v: Math.max(t.surplus, 0), c: '#D99A1A', items: [] }].filter(s => s.v > 0);
      const base = Math.max(t.inc, segs.reduce((s, x) => s + x.v, 0));
      /* Saving ratios use income before EPF (EPF from salary is both income and saving); spending ratios use take-home, which is what pays the bills (as banks do for EMIs) */
      const xe = st.cf.epfOutside ? epf : 0, gi = t.inc + xe, ix = xe ? ` (take-home ${FP.inr(t.inc)} + EPF ${FP.inr(xe)})` : '';
      const sr = gi ? (gi - t.spend) / gi : 0, ir = gi ? (t.sav + xe) / gi : 0, er = t.inc ? t.living / t.inc : 0, emiR = t.inc ? t.emi / t.inc : 0, efm = t.spend ? nw.ef / t.spend : 0, efGoal = (g => g ? FP.efAmt(d, st, g) : 0)(d.goals.find(g => g.type === 'emergency'));
      const top = out.filter(x => x.g === 'living').sort((a, b) => b.pm - a.pm).slice(0, 8);
      el.innerHTML = `
      <label class="switch noprint" for="epfOut"><input type="checkbox" id="epfOut" ${st.cf.epfOutside ? 'checked' : ''}> EPF is deducted before take-home pay (not part of the salary entered)</label>
      <div class="kpis">${FP.kpi(t.surplus >= 0 ? 'Free surplus' : 'Monthly deficit', FP.inr(t.surplus), 'Left after expenses, EMIs, premiums and current SIPs', 1)}
        ${FP.kpi('Monthly income', FP.inr(t.inc), 'Take-home, all sources')}${FP.kpi('Spending', FP.inr(t.spend), 'Household, EMIs, premiums')}
        ${FP.kpi('Already investing', FP.inr(t.sav), st.cf.epfOutside && epf ? `Plus ${FP.inr(epf)} EPF from salary` : 'SIPs, PPF, RD, EPF')}</div>
      ${t.surplus < 0 ? `<p class="callout">Outflows are higher than income by <b>${FP.inr(-t.surplus)}</b> a month. Sections 5 and 6 will show how to close this gap.</p>` : ''}
      <div class="grid2">
        <div><h3>How monthly income is used</h3>${FP.donut('cfDonut', segs, base, 'Split of monthly income')}</div>
        <div><h3>Biggest household expenses</h3><div class="chartbox"><canvas id="cfTop" role="img" aria-label="Top household expenses per month"></canvas></div></div>
      </div>
      <div><h3>Health check</h3><div class="ratios">
        ${FP.ratio('Surplus ratio', sr, FP.pct(sr, 0), [{ max: .1, label: 'Poor', tone: 'bad' }, { max: .5, label: 'Good', tone: 'good' }, { max: Infinity, label: 'Excellent', tone: 'good' }], 'Income left after spending, available to invest.', `(Income − household − EMIs − premiums) ÷ income = ${FP.inr(gi - t.spend)} ÷ ${FP.inr(gi)}${ix}. Current SIPs${xe ? ' and EPF' : ''} count as surplus here. Bands: under 10% poor, 10–50% good, over 50% excellent.`)}
        ${FP.ratio('Investment rate', ir, FP.pct(ir, 0), [{ max: .1, label: 'Low', tone: 'bad' }, { max: .2, label: 'Fair', tone: 'warn' }, { max: .35, label: 'Good', tone: 'good' }, { max: Infinity, label: 'Excellent', tone: 'good' }], 'Income already going into investments every month.', `Committed savings (SIP, PPF, RD, liquid fund, EPF) ÷ income = ${FP.inr(t.sav + xe)} ÷ ${FP.inr(gi)}${ix}. Bands: under 10% low, 10–20% fair, 20–35% good, over 35% excellent.`)}
        ${FP.ratio('Lifestyle spending', er, FP.pct(er, 0), [{ max: .5, label: 'Healthy', tone: 'good' }, { max: .7, label: 'Watch', tone: 'warn' }, { max: Infinity, label: 'High', tone: 'bad' }], 'Income spent on running the household.', `Household & lifestyle ÷ take-home income = ${FP.inr(t.living)} ÷ ${FP.inr(t.inc)}. Excludes EMIs, premiums and savings. Bands: up to 50% healthy, 50–70% watch, over 70% high.`)}
        ${FP.ratio('EMI to income', emiR, FP.pct(emiR, 0), [{ max: .1, label: 'Best', tone: 'good' }, { max: .2, label: 'Good', tone: 'good' }, { max: .4, label: 'Concerning', tone: 'warn' }, { max: Infinity, label: 'High', tone: 'bad' }], 'Income going to loan repayments.', `Loan EMIs ÷ take-home income = ${FP.inr(t.emi)} ÷ ${FP.inr(t.inc)}, the way banks check affordability. Bands: under 10% best, 10–20% good, 20–40% concerning, over 40% high.`)}
        ${FP.ratio('Emergency cover', efm, efm.toFixed(1) + ' months', [{ max: 3, label: 'Low', tone: 'bad' }, { max: 6, label: 'Good', tone: 'good' }, { max: Infinity, label: 'Excellent', tone: 'good' }], `Months of spending covered by money set aside for emergencies${efGoal ? ` (target in goals: ${FP.short(efGoal)})` : ''}.`, `Emergency fund earmark ÷ monthly spending = ${FP.short(nw.ef)} ÷ ${FP.inr(t.spend)}. Earmark is set per asset in Net Worth. Spending = household + EMIs + premiums. Bands: under 3 low, 3–6 good, over 6 excellent.`)}
      </div></div>
      <p class="hint noprint">Every line item is in Client data → Cash flow.</p>`;
      el.querySelector('#epfOut').onchange = e => FP.set(s => s.cf.epfOutside = e.target.checked);
      FP.donutDraw('cfDonut', segs, base);
      FP.chart('cfTop', { type: 'bar', data: { labels: top.map(x => x.label.length > 28 ? x.label.slice(0, 26) + '…' : x.label), datasets: [{ data: top.map(x => x.pm), backgroundColor: '#A3502F', borderRadius: 4, barThickness: 14 }] },
        options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => FP.inr(c.raw) + ' / month' } } },
          scales: { x: { grid: { color: '#e8eef1' }, ticks: { callback: v => FP.short(v) } }, y: { grid: { display: false } } } } });
    }
  };
})();

</script>
<script data-src="s3-goals.js">
/* Section 3 — Goal Planning: future cost, SIP, step-up SIP and lumpsum per goal */
(() => {
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const PRI = { High: 0, Medium: 1, Low: 2 }, PCOL = { High: '#1E7A46', Medium: '#D99A1A', Low: '#2F86BC' };
  const bucket = n => n < 24 ? ['Debt', 'rDebt'] : n < 36 ? ['Hybrid', 'rHybrid'] : ['Equity', 'rEquity'];
  const inflFor = t => t === 'education' ? FP.rate('inflEdu') : t === 'marriage' ? FP.rate('inflMarriage') : t === 'emergency' ? 0 : FP.rate('infl');

  /* Retirement need from Other details: monthly expense today minus income that continues after retirement */
  FP.calc.retire = d => {
    const sd = d.self?.dob, ry = d.retireYear || (sd ? sd.getFullYear() + 60 : null);
    if (!ry || !d.other.retireMonthly) return null;
    const le = FP.rate('lifeExp');
    const endYear = Math.max(ry + 1, ...[d.self, d.spouse].filter(p => p?.dob).map(p => p.dob.getFullYear() + le));
    const pm = x => x.y > 0 ? x.y / 12 : x.m;
    const cont = d.inflows.filter(x => (/rent/i.test(x.label) && d.other.rentContinues === 'Yes') || (/interest/i.test(x.label) && d.other.interestContinues === 'Yes') || (/other income|dividend/i.test(x.label) && d.other.otherContinues === 'Yes'));
    const contIncome = cont.reduce((s, x) => s + pm(x), 0);
    return { ry, endYear, age: sd ? ry - sd.getFullYear() : null, today: d.other.retireMonthly, contIncome, contLabels: cont.map(x => x.label), need: Math.max(d.other.retireMonthly - contIncome, 0) };
  };

  FP.mrate = r => Math.pow(1 + r, 1 / 12) - 1;
  /* SIP, step-up SIP (starting) and lumpsum that reach fv in n months at annual return r */
  /* k = months the SIP can run (it stops at retirement for goals due after it); the money then stays invested until the goal */
  FP.need = (fv, n, r, g = FP.rate('stepUp'), k = n) => {
    if (n <= 0 || fv <= 0) return { sip: 0, step: 0, lump: Math.max(fv, 0) };
    if (!(k > 0) || k > n) k = n;
    const i = FP.mrate(r), grow = Math.pow(1 + i, n); let F = 0, S = 0;
    for (let m = 0; m < k; m++) { const w = Math.pow(1 + i, n - m); S += w; F += Math.pow(1 + g, Math.floor(m / 12)) * w; }
    return { sip: fv / S, step: fv / F, lump: fv / grow };
  };
  FP.calc.goals = (d, st) => {
    const pd = FP.planDate(), p0 = pd.getFullYear() * 12 + pd.getMonth(), R = FP.calc.retire(d);
    const list = d.goals.map((x, idx) => ({ ...x, idx, ...(x.type === 'emergency' ? { amt: FP.efAmt(d, st, x), efAuto: FP.efAuto(d, st, x), efMonths: FP.efMonths(st, x) } : {}) }));
    const rm = (st.goals || {}).Retirement?.month ?? 3, nR = R ? R.ry * 12 + rm - 1 - p0 : null, kOf = n => nR > 0 && n > nR ? nR : n;
    if (R) list.push({ name: 'Retirement', pri: (st.goals || {}).Retirement?.pri || 'High', amt: R.need, year: R.ry, type: 'retirement', grp: 'Retirement', note: '' });
    let out = list.map(go => {
      const o = (st.goals || {})[go.name] || {};
      const mon = o.month ?? (go.type === 'education' ? 6 : 3), rep = o.repeat || null;
      let year = go.type === 'emergency' ? null : go.year, n = year ? year * 12 + mon - 1 - p0 : 0;
      if (rep && year) while (n <= 0 && year < rep) { year++; n += 12; }

<script data-src="s5-sip.js">
/* Section 5 — SIP Allocation: monthly investing capacity shared across goal gaps (after Section 4) */
(() => {
  FP.calc.sip = (d, st) => {
    const { goals } = FP.calc.alloc(d, st), cf = FP.calc.cf(d, st).t, step = st.sipMode !== 'flat';
    const availCalc = cf.sav + Math.max(cf.surplus, 0), avail = st.sipAvail ?? availCalc;
    /* Money arriving later (scenarios: asset sale, bonus): funds goals due after it arrives, growing at each goal's return from then */
    const pd = FP.planDate(), p0 = pd.getFullYear() * 12 + pd.getMonth(), ord = FP.goalOrder(st, goals);
    goals.forEach(g => { g.gap0 = g.gap; g.gapFV0 = g.gapFV; g.inflow = 0; });
    const inflows = (st.inflows || []).map(x => {
      let left = +x.amt || 0; const ni = Math.max((+x.year || pd.getFullYear()) * 12 + (+x.month || pd.getMonth() + 1) - 1 - p0, 0), uses = [];
      (x.to && x.to !== 'pool' ? ord.filter(g => g.name === x.to) : ord).forEach(g => {
        if (left < 1) return;
        if (g.due) { if (ni > 0) return; const c = Math.min(left, g.gap); g.gap -= c; left -= c; c > 0 && uses.push([g.name, c]); return; }
        if (g.n < ni || g.noSip && g.gapFV < 1) return;   /* goals due in the month the money arrives, or later */ const left_ = g.n - ni, rr = g.type === 'retirement' && left_ < 36 ? FP.rate('rPost') : FP.rate(left_ < 24 ? 'rDebt' : left_ < 36 ? 'rHybrid' : 'rEquity'), grow = Math.pow(1 + FP.mrate(rr), left_),   /* return set by the time left once the money arrives */ c = Math.min(left * grow, g.gapFV); if (c < 1) return;
        g.gapFV -= c; g.inflow += c; left -= c / grow; uses.push([g.name, c / grow, rr, left_, c]);   /* goal, amount used, growth rate after arrival, months it grows, value on the goal date */
      });
      return { ...x, ni, uses, used: (+x.amt || 0) - left, left };
    });
    const future = FP.goalOrder(st, goals.filter(g => !g.due && g.gapFV > 1 && !g.noSip)).map(g => { const nd = FP.need(g.gapFV, g.n, g.r, undefined, g.k); return { ...g, req: step ? nd.step : nd.sip }; });
    let left = avail; future.forEach(g => { g.alloc = Math.min(g.req, Math.max(left, 0)); left -= g.alloc; g.short = g.req - g.alloc; g.ach = g.req ? g.alloc / g.req : 1; });
    const nowGap = goals.filter(g => g.due && g.gap > 1);
    /* Share of each goal reached: investments (Section 4) + later money + the SIP that fits */
    goals.forEach(g => { const f = future.find(x => x.name === g.name), share = g.due ? (g.gap0 > 1 ? (g.gap0 - g.gap) / g.gap0 : 0) : g.gapFV0 > 1 ? (g.inflow + (f ? f.ach * g.gapFV : 0)) / g.gapFV0 : 0;
      g.sipAlloc = f ? f.alloc : 0; g.funded = g.fullPV ? Math.min((g.got + g.gap0 * share) / g.fullPV, 1) : 1; });
    const sum = (a, k) => a.reduce((s, x) => s + x[k], 0);
    return { goals, inflows, future, nowGap, avail, availCalc, step, req: sum(future, 'req'), alloc: sum(future, 'alloc'), short: sum(future, 'short'), nowShort: sum(nowGap, 'gap'), left: Math.max(left, 0), cf };
  };

  FP.sec.sip = {
    render(el, d, st) {
      const S = FP.calc.sip(d, st), o5 = st.g5order || [], F = o5.length ? S.future.slice().sort((a, b) => ((o5.indexOf(a.name) + 1) || 1e6) - ((o5.indexOf(b.name) + 1) || 1e6)) : S.future, PR = { High: 0, Medium: 1, Low: 2 }, MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const sp = FP.pct(FP.rate('stepUp'), 1);
      el.innerHTML = `
      <div class="noprint" style="display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end">
        <label class="switch">SIP type <span class="segbtn">${[['step', `Step-up (${sp} a year)`], ['flat', 'Flat']].map(([k, l]) => `<button data-sm="${k}" aria-pressed="${(st.sipMode || 'step') === k}">${l}</button>`).join('')}</span></label>
        <label for="sipAvail" style="display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px">Can invest per month
          <input id="sipAvail" type="text" inputmode="decimal" class="money" style="border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:160px" data-raw="${S.avail}" value="${FP.inrx(S.avail)}"></label>
        <span class="hint">Worked out as current SIPs ${FP.inr(S.cf.sav)} + free surplus ${FP.inr(Math.max(S.cf.surplus, 0))} = ${FP.inr(S.availCalc)}. ${st.sipAvail != null ? '<button class="link" id="sipReset">Use this</button>' : 'Type a different amount to override.'} <button class="link" id="sipHow">See how this is worked out</button></span></div>
      <div class="kpis">${FP.kpi('Monthly SIP needed', FP.inr(S.req), S.step ? `Step-up SIP @ ${sp} p.a. · first-year amount, for the ${F.length} goals not yet covered` : `Flat SIP for the ${F.length} goals not yet covered`, 1)}
        ${FP.kpi('Can invest now', FP.inr(S.avail), 'Per month, from current SIPs and surplus')}
        ${FP.kpi(S.short > 0 ? 'Monthly shortfall' : 'Left over each month', FP.inr(S.short > 0 ? S.short : S.left), S.short > 0 ? 'Section 6 shows the income needed to close it' : 'Can go to new goals or step up faster')}
        ${FP.kpi('Goals fully on track', `${F.filter(g => g.short < 1).length} of ${F.length}`)}</div>
      ${S.nowGap.length ? `<div class="callout"><b>${FP.short(S.nowShort)} is needed now and isn't covered by existing investments.</b> A SIP can't build this in time; use the bonus or surplus, or move the goal:<ul style="margin:6px 0 0;padding-left:18px">${S.nowGap.map(g => `<li>${FP.esc(g.name)}: ${FP.short(g.gap)}</li>`).join('')}</ul></div>` : ''}
      <div><h3>SIP for each goal</h3><div class="chartbox" style="height:${Math.max(140, F.length * 30 + 40)}px"><canvas id="sipBar" role="img" aria-label="SIP allocated and shortfall per goal"></canvas></div>
        ${FP.legend(['SIP allocated', 'Monthly shortfall'], null, ['#1E7A46', '#A3502F'])}</div>
      <div><div class="secbar"><h3>How your monthly investment is shared <span class="chip${S.step ? '' : ' muted'}">${S.step ? `Step-up SIP @ ${sp} p.a.` : 'Flat SIP'}</span></h3><button class="addgoal noprint" data-addgoal>+ Add goal</button></div><p class="hint">Money goes to goals in the same order as Section 4.<span class="noprint"> The list below follows that order${st.g5order ? ' until you reorder it here (<button class="link" id="g5reset">follow Section 4 again</button>)' : '; drag ⠿ to show it differently'}.</span> A ${S.step ? `step-up SIP rises ${sp} every 12 months` : 'flat SIP stays the same every month'}.</p>
      <div class="tbl"><table><thead><tr><th class="noprint" data-nosort title="Drag rows to reorder"></th><th>Goal</th><th>Priority</th><th>Due</th><th class="n" data-h="Still to build by due date" title="Part Section 4 could not cover, grown to the due date">Yet to build by due date</th><th>Invest in</th><th class="n" data-h="SIP needed">${S.step ? 'Step-up SIP needed' : 'SIP needed'}</th><th class="n" data-h="SIP allocated">SIP allocated</th><th class="n">Shortfall</th><th class="n">On track</th></tr></thead><tbody>
        ${F.map(g => `<tr data-g="${FP.esc(g.name)}"><td class="noprint drag" draggable="true" title="Drag to reorder. Shift+click to pick several.">⠿</td><td>${FP.goalBtn(g)}</td><td data-sort="${PR[g.pri]}"><span class="chip ${g.pri === 'High' ? '' : g.pri === 'Medium' ? 'warn' : 'muted'}">${g.pri}</span></td><td>${MON[g.mon - 1]} ${g.year}<span class="note">${g.n} months${g.k < g.n ? `; SIP for the first ${g.k} (till retirement), then it grows untouched` : ''}</span></td>
          <td class="n">${FP.inr(g.gapFV)}</td><td>${g.bk} · ${FP.pct(g.r, 0)}</td><td class="n">${FP.inr(g.req)}</td><td class="n"><b>${FP.inr(g.alloc)}</b></td>
          <td class="n" style="${g.short > 1 ? 'color:var(--brown);font-weight:700' : ''}">${g.short > 1 ? FP.inr(g.short) : '—'}</td><td class="n">${FP.pct(g.ach, 0)}</td></tr>`).join('') || '<tr><td colspan="10">Every future goal is already covered by existing investments.</td></tr>'}
        ${FP.calc.goals(d, st).filter(g => !g.on && !g.due).map(g => `<tr class="off noprint"><td class="noprint"></td><td>${FP.goalBtn(g)}<span class="note">Not in the plan. Click the name to include it.</span></td><td>${g.pri}</td><td>${MON[g.mon - 1]} ${g.year}</td><td colspan="6" class="hint">Left out of the plan: no SIP</td></tr>`).join('')}
        <tr class="tot"><td class="noprint"></td><td colspan="5">Total</td><td class="n">${FP.inr(S.req)}</td><td class="n">${FP.inr(S.alloc)}</td><td class="n">${FP.inr(S.short)}</td><td class="n">${FP.pct(S.req ? S.alloc / S.req : 1, 0)}</td></tr></tbody></table></div>
        <p class="hint">${S.step ? `SIP amounts are for year 1; a step-up SIP rises ${sp} a year. ` : ''}"Yet to build by due date" is the part Section 4 couldn't cover, grown to the due date. "On track" is the share of that amount the allocated SIP will reach.</p></div>`;
